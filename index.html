<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="app-title">KAUDHA Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
.badge.active{background:#dcfce7;color:#166534} .badge.pending{background:#fef9c3;color:#854d0e}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- HEADER - DYNAMIC TITLE -->
<header class="bg-white shadow sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 id="app-title-header" data-setting="app_title" class="text-2xl font-bold text-green-700">Loading...</h1>
    <div class="flex gap-3 items-center">
      <span id="user-role-badge" class="badge active"></span>
      <button id="logoutBtn" class="hidden text-sm bg-red-50 text-red-600 px-4 py-2 rounded-lg">Logout</button>
    </div>
  </div>
  <div id="portal-notice" data-setting="portal_notice" class="bg-yellow-50 text-yellow-800 text-center py-2 text-sm"></div>
</header>

<main class="max-w-7xl mx-auto p-6">
  <!-- STATS - DYNAMIC FROM DB -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500 text-sm">Total Members</p><h2 id="stat-total" class="text-3xl font-bold">0</h2></div>
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500 text-sm">Active</p><h2 id="stat-active" class="text-3xl font-bold text-green-600">0</h2></div>
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500 text-sm">Pending</p><h2 id="stat-pending" class="text-3xl font-bold text-yellow-600">0</h2></div>
    <div class="bg-white p-5 rounded-xl shadow"><p class="text-gray-500 text-sm">My Role</p><h2 id="stat-role" class="text-3xl font-bold capitalize">-</h2></div>
  </div>

  <!-- ACTION BAR -->
  <div class="flex justify-between items-center mb-4">
    <h3 class="text-lg font-bold">Members</h3>
    <button onclick="openModal()" class="official-only admin-only bg-green-700 text-white px-5 py-2 rounded-lg"><i class="fa fa-plus mr-2"></i>Add Member</button>
  </div>

  <!-- TABLE - 100% DYNAMIC -->
  <div class="bg-white rounded-xl shadow overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-100 text-left"><tr>
          <th class="p-4">Membership No</th><th class="p-4">Full Name</th><th class="p-4">Email</th><th class="p-4">Phone</th><th class="p-4">Status</th><th class="p-4 admin-only">Action</th>
        </tr></thead>
        <tbody id="members-table-body"><tr><td colspan="6" class="p-8 text-center text-gray-400">Loading from Supabase...</td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<!-- ADD MODAL -->
<div id="memberModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
  <div class="bg-white w-full max-w-md p-6 rounded-xl">
    <h3 class="font-bold text-lg mb-4">Add New Member</h3>
    <form onsubmit="handleAddMember(event)" class="space-y-3">
      <input id="member-no" required placeholder="Membership Number e.g KA-001" class="w-full border p-3 rounded-lg">
      <input id="member-name" required placeholder="Full Name" class="w-full border p-3 rounded-lg">
      <input id="member-email" required type="email" placeholder="Email" class="w-full border p-3 rounded-lg">
      <input id="member-phone" placeholder="Phone" class="w-full border p-3 rounded-lg">
      <div class="flex gap-2 pt-2"><button type="button" onclick="closeModal()" class="flex-1 border py-2 rounded-lg">Cancel</button><button class="flex-1 bg-green-700 text-white py-2 rounded-lg">Save</button></div>
    </form>
  </div>
</div>

<script>
// ========= CONFIG - CHANGE ONLY THESE 2 LINES =========
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_ANON_KEY_HERE";
// ======================================================

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUserProfile = null;

document.addEventListener('DOMContentLoaded', async () => {
  await loadDashboard();
  supabaseClient.auth.onAuthStateChange(async () => await loadDashboard());
});

async function loadDashboard(){
  // Use your dynamic SQL function
  const { data, error } = await supabaseClient.rpc('get_dynamic_dashboard');
  if(error){ console.error(error); document.getElementById('members-table-body').innerHTML = `<tr><td colspan=6 class="p-4 text-red-500">Error: ${error.message}</td></tr>`; return; }
  
  // 1. Settings dynamic
  data.settings?.forEach(s => {
    document.querySelectorAll(`[data-setting="${s.key}"]`).forEach(el => el.innerText = s.value);
    if(s.key === 'app_title') document.title = s.value;
  });

  // 2. Profile dynamic
  currentUserProfile = data.profile;
  if(currentUserProfile){
    document.getElementById('stat-role').innerText = currentUserProfile.role || 'member';
    document.getElementById('user-role-badge').innerText = currentUserProfile.role || 'member';
    document.getElementById('logoutBtn').classList.remove('hidden');
    applyRoleBasedUI(currentUserProfile.role);
  }

  // 3. Members dynamic + stats
  const members = data.members || [];
  document.getElementById('stat-total').innerText = members.length;
  document.getElementById('stat-active').innerText = members.filter(m=>m.status==='active').length;
  document.getElementById('stat-pending').innerText = members.filter(m=>m.status!=='active').length;
  renderMembers(members);
}

function renderMembers(members){
  const tbody = document.getElementById('members-table-body');
  if(!members.length){ tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400">No members yet. Add first member.</td></tr>`; return; }
  tbody.innerHTML = '';
  members.forEach(m => {
    const tr = document.createElement('tr'); tr.className = 'border-t hover:bg-gray-50';
    tr.innerHTML = `<td class="p-4 font-mono">${m.membership_number}</td><td class="p-4 font-medium">${m.full_name}</td><td class="p-4">${m.email}</td><td class="p-4">${m.phone||'N/A'}</td><td class="p-4"><span class="badge ${m.status}">${m.status}</span></td><td class="p-4 admin-only"><button onclick="deleteMember('${m.id}')" class="text-red-600 hover:bg-red-50 px-3 py-1 rounded">Delete</button></td>`;
    tbody.appendChild(tr);
  });
  if(currentUserProfile) applyRoleBasedUI(currentUserProfile.role);
}

function applyRoleBasedUI(role){
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = (role==='admin')?'':'none');
  document.querySelectorAll('.official-only').forEach(el => el.style.display = (role==='admin'||role==='official')?'':'none');
  document.querySelectorAll('.admin-only').forEach(el => { if(role!=='admin') el.style.display='none'; });
}

async function handleAddMember(e){
  e.preventDefault();
  const { data, error } = await supabaseClient.rpc('create_member_dynamic', {
    p_full_name: document.getElementById('member-name').value,
    p_email: document.getElementById('member-email').value,
    p_phone: document.getElementById('member-phone').value,
    p_membership_number: document.getElementById('member-no').value
  });
  if(error) alert(error.message); else { closeModal(); e.target.reset(); await loadDashboard(); }
}

async function deleteMember(id){
  if(!confirm("Delete this member?")) return;
  const { error } = await supabaseClient.from('members').delete().eq('id', id);
  if(error) alert(error.message); else await loadDashboard();
}

function openModal(){ document.getElementById('memberModal').classList.remove('hidden'); document.getElementById('memberModal').classList.add('flex'); }
function closeModal(){ document.getElementById('memberModal').classList.add('hidden'); document.getElementById('memberModal').classList.remove('flex'); }
document.getElementById('logoutBtn').onclick = async () => { await supabaseClient.auth.signOut(); location.reload(); };
</script>
</body>
</html>
