<script type="module">

import {
  createClient

/* ================= LIVE MEMBERS ================= */

export async function loadLive(){

  document.getElementById(
    'connStatus'
  ).innerText =
    "Connecting to Supabase...";


  try{

    const {
      data,
      error
    } = await supabase

      .from('members')

      .select('*')

      .order('membership_number');


    if(error)
      throw error;


    window.membersData =
      (data || []).map(d => ({

        id:d.id,

        name:d.full_name,

        short:(d.full_name || '')
          .split(' ')[0],

        phone:d.phone,

        memberNo:d.membership_number,

        email:d.email,

        zimele:Number(d.zimele || 0),

        monthly:Number(d.monthly || 0),

        arrears:Number(d.arrears ?? 0),

        status:d.status || 'Arrears',

        withdrawal:d.withdrawal || '0.00',

        role:d.role || 'Member',

        joined:d.created_at
          ?.split('T')[0]

      }));


    document.getElementById(
      'connStatus'
    ).innerText =
      `✅ ${window.membersData.length} members LIVE - NO HARD CODE`;


    document.getElementById(
      'loginMember'
    ).innerHTML =

      window.membersData

        .map(m => `

          <option value="${m.id}">

            ${escapeHTML(m.name)}
            -
            ${escapeHTML(m.status)}
            ${m.arrears}

          </option>

        `)

        .join('')

      +

      `
        <option value="Admin">
          Super Admin
        </option>

        <option value="Manager">
          Manager
        </option>
      `;


    document.getElementById(
      'liveCount'
    ).innerText =
      `${window.membersData.length} Members LIVE - NO HARD CODE`;


  }catch(e){

    document.getElementById(
      'connStatus'
    ).innerText =
      "❌ " + e.message +
      " - Members table unavailable";

    document.getElementById(
      'connStatus'
    ).style.color = "red";

  }

}


window.loadLive = loadLive;

loadLive();

</script>

<script>

let currentUser = {};

let currentRole = 'Member';

let selectedAccount = null;


/* ================= HELPERS ================= */

function money(value){

  return Number(value || 0)

    .toLocaleString(
      'en-KE',
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

}


function escapeHTML(value){

  return String(value ?? '')

    .replace(/[&<>"']/g, function(c){

      return {

        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'

      }[c];

    });

}


function modalHTML(html){

  document.getElementById(
    'box'
  ).innerHTML = html;

  document.getElementById(
    'modal'
  ).classList.add('on');

}


function closem(){

  document.getElementById(
    'modal'
  ).classList.remove('on');

}


document.getElementById(
  'modal'
).onclick = function(e){

  if(e.target.id === 'modal')
    closem();

};


/* ================= LOGIN ================= */

function doLogin(){

  const selected =
    document.getElementById(
      'loginMember'
    ).value;


  if(selected === 'Admin'){

    currentUser = {

      name:"Super Admin",

      memberNo:"ADM001",

      role:"Admin"

    };

    currentRole = "Admin";

  }

  else if(selected === 'Manager'){

    currentUser = {

      name:"Manager",

      memberNo:"MGR001",

      role:"Manager"

    };

    currentRole = "Manager";

  }

  else{

    const md =
      window.membersData.find(
        x => x.id === selected
      );


    if(!md){

      alert(
        'Member is no longer available. Reload LIVE members.'
      );

      return;

    }


    currentUser = {

      id:md.id,

      name:md.name,

      memberNo:md.memberNo,

      phone:md.phone,

      email:md.email,

      role:"Member",

      arrears:md.arrears

    };

    currentRole = "Member";

  }


  localStorage.setItem(
    'KAUDHA_LOGGED',
    '1'
  );

  localStorage.setItem(
    'KAUDHA_USER',
    JSON.stringify(currentUser)
  );

  localStorage.setItem(
    'KAUDHA_ROLE',
    currentRole
  );


  showApp();

}


function doLogout(){

  localStorage.removeItem(
    'KAUDHA_LOGGED'
  );

  localStorage.removeItem(
    'KAUDHA_USER'
  );

  localStorage.removeItem(
    'KAUDHA_ROLE'
  );


  document.getElementById(
    'app'
  ).style.display = 'none';


  document.getElementById(
    'loginWrap'
  ).style.display = 'flex';

}


function showApp(){

  document.getElementById(
    'loginWrap'
  ).style.display = 'none';


  document.getElementById(
    'app'
  ).style.display = 'block';


  document.getElementById(
    'sideName'
  ).innerText =
    currentUser.name || '-';


  document.getElementById(
    'currentRoleLabel'
  ).innerText =
    currentRole;


  document.getElementById(
    'sideRoleBadge'
  ).innerText =
    currentRole;


  home();

}

/* =========================================================
   SAVE GOAL ACCOUNT
   ========================================================= */

window.saveGoalAccount =
async function(){

  const name =
    document.getElementById(
      'goalAccountName'
    ).value.trim();


  const type =
    document.getElementById(
      'goalAccountType'
    ).value.trim()
    ||
    'Goal Account';


  const goal =
    document.getElementById(
      'goalName'
    ).value.trim()
    ||
    name;


  const target =
    Number(
      document.getElementById(
        'goalTarget'
      ).value
    ) || 0;


  if(!name){

    alert(
      'Account name required'
    );

    return;

  }


  /*
    Use a unique account number.
    The account itself is created in
    public.accounts.
  */

  const accountNo =
    'GOAL-' +
    Date.now();


  const {
    data,
    error
  } =
    await window.supabase

      .from('accounts')

      .insert({

        account_no:accountNo,

        name:name,

        account_type:type,

        goal:goal,

        balance:0,

        is_main:false

      })

      .select()

      .single();


  if(error){

    alert(
      'Supabase Error: ' +
      error.message
    );

    return;

  }


  /*
    Create the matching goal record.
  */

  if(target > 0){

    const goalResult =
      await window.supabase

        .from('goals')

        .insert({

          account_id:data.id,

          name:goal,

          target_amount:target,

          current_amount:0,

          description:
            `Goal account: ${name}`

        });


    if(goalResult.error){

      alert(
        'Account created, but goal record failed: ' +
        goalResult.error.message
      );

    }

  }


  closem();


  /*
    Open the NEW ACCOUNT STATEMENT
    immediately after creation.
  */

  await accountStatement(
    data.id
  );

};


/* =========================================================
   ACCOUNT STATEMENT
   ========================================================= */

async function accountStatement(
  accountId
){

  selectedAccount =
    (window.accountsData || [])
      .find(
        a => a.id === accountId
      );


  if(!selectedAccount){

    const result =
      await window.supabase

        .from('accounts')

        .select('*')

        .eq('id',accountId)

        .single();


    if(result.error){

      alert(
        result.error.message
      );

      return;

    }


    selectedAccount =
      result.data;

  }


  document.getElementById(
    'main'
  ).innerHTML = `

    <div class="card">

      <p>
        Loading account statement...
      </p>

    </div>

  `;


  const result =
    await window.supabase

      .from('transactions')

      .select('*')

      .eq('account_id',accountId)

      .order(
        'transaction_date',
        {
          ascending:false
        }
      )

      .order(
        'created_at',
        {
          ascending:false
        }
      );


  window.transactionsData =
    result.data || [];


  renderAccountStatement(
    window.transactionsData,
    result.error
  );

}


window.accountStatement =
  accountStatement;

window.filterAccountStatement =
function(){

  const from =
    document.getElementById(
      'fromDate'
    ).value;


  const to =
    document.getElementById(
      'toDate'
    ).value;


  const type =
    document.getElementById(
      'txFilter'
    ).value;


  let filtered =
    window.transactionsData.filter(
      t =>

        (!from ||
          t.transaction_date >= from)

        &&

        (!to ||
          t.transaction_date <= to)

    );


  if(type !== 'all'){

    filtered =
      filtered.filter(t => {

        const x =
          (t.transaction_type || '')
            .toLowerCase();


        if(type === 'deposit')
          return x.includes('deposit');


        if(type === 'withdrawal')
          return x.includes('withdraw');


        if(type === 'transfer')
          return x.includes('transfer');


        return true;

      });

  }


  renderAccountStatement(
    filtered,
    null
  );

};

function(id){

  accountStatement(id);

};

/* =========================================================
   SAVE TRANSACTION
   ========================================================= */

window.saveTransaction =
async function(
  accountId,
  type
){

  const amount =
    Number(

      type === 'Deposit'

        ?

        document.getElementById(
          'depAmount'
        ).value

        :

        document.getElementById(
          'wdAmount'
        ).value

    );


  const ref =
    document.getElementById(

      type === 'Deposit'

        ?

        'depRef'

        :

        'wdRef'

    ).value.trim();


  const desc =
    document.getElementById(

      type === 'Deposit'

        ?

        'depDesc'

        :

        'wdDesc'

    ).value.trim();


  if(!amount || amount <= 0){

    alert(
      'Enter a valid amount'
    );

    return;

  }


  const account =
    (window.accountsData || [])
      .find(
        a => a.id === accountId
      )
      ||
      selectedAccount;


  if(!account){

    alert(
      'Account not found'
    );

    return;

  }


  const oldBalance =
    Number(
      account.balance || 0
    );


  const newBalance =

    type === 'Deposit'

      ?

      oldBalance + amount

      :

      oldBalance - amount;


  if(
    type === 'Withdrawal'
    &&
    newBalance < 0
  ){

    alert(
      'Insufficient account balance'
    );

    return;

  }


  const payload = {

    account_id:accountId,

    member_id:
      currentUser.id || null,

    transaction_date:
      new Date()
        .toISOString()
        .slice(0,10),

    reference:
      ref || null,

    description:
      desc || type,

    transaction_type:
      type,

    deposit:
      type === 'Deposit'
        ? amount
        : 0,

    withdrawal:
      type === 'Withdrawal'
        ? amount
        : 0,

    debit:
      type === 'Withdrawal'
        ? amount
        : 0,

    credit:
      type === 'Deposit'
        ? amount
        : 0,

    balance:
      newBalance

  };


  const inserted =
    await window.supabase

      .from('transactions')

      .insert(payload);


  if(inserted.error){

    alert(
      'Supabase Error: ' +
      inserted.error.message
    );

    return;

  }


  const updated =
    await window.supabase

      .from('accounts')

      .update({
        balance:newBalance
      })

      .eq(
        'id',
        accountId
      );


  if(updated.error){

    alert(
      'Transaction saved but account balance update failed: ' +
      updated.error.message
    );

    return;

  }


  closem();


  await accountStatement(
    accountId
  );

};

async function saveTransfer(
  fromId
){

  const toId =
    document.getElementById(
      'transferTo'
    ).value;


  const amount =
    Number(
      document.getElementById(
        'transferAmount'
      ).value
    );


  if(
    !toId
    ||
    !amount
    ||
    amount <= 0
  ){

    alert(
      'Select destination and amount'
    );

    return;

  }


  const from =
    window.accountsData.find(
      a => a.id === fromId
    );


  const to =
    window.accountsData.find(
      a => a.id === toId
    );


  if(
    !from
    ||
    !to
  ){

    alert(
      'Account not found'
    );

    return;

  }


  if(
    Number(from.balance) < amount
  ){

    alert(
      'Insufficient source balance'
    );

    return;

  }


  const date =
    new Date()
      .toISOString()
      .slice(0,10);


  const ref =
    document.getElementById(
      'transferRef'
    ).value.trim();


  const desc =
    document.getElementById(
      'transferDesc'
    ).value.trim()
    ||
    'Transfer';


  const outgoing =
    await window.supabase

      .from('transactions')

      .insert({

        account_id:fromId,

        member_id:
          currentUser.id || null,

        transaction_date:date,

        reference:
          ref || null,

        description:
          desc +
          ' → ' +
          to.name,

        transaction_type:'Transfer',

        deposit:0,

        withdrawal:amount,

        debit:amount,

        credit:0,

        balance:
          Number(from.balance)
          - amount

      });


  if(outgoing.error){

    alert(
      outgoing.error.message
    );

    return;

  }


  const incoming =
    await window.supabase

      .from('transactions')

      .insert({

        account_id:toId,

        member_id:
          currentUser.id || null,

        transaction_date:date,

        reference:
          ref || null,

        description:
          desc +
          ' ← ' +
          from.name,

        transaction_type:'Transfer',

        deposit:amount,

        withdrawal:0,

        debit:0,

        credit:amount,

        balance:
          Number(to.balance)
          + amount

      });


  if(incoming.error){

    alert(
      incoming.error.message
    );

    return;

  }


  await window.supabase

    .from('accounts')

    .update({

      balance:
        Number(from.balance)
        - amount

    })

    .eq(
      'id',
      fromId
    );


  await window.supabase

    .from('accounts')

    .update({

      balance:
        Number(to.balance)
        + amount

    })

    .eq(
      'id',
      toId
    );


  closem();


  await financials();

}

window.saveNewMember =
async function(){

  const name =
    document.getElementById(
      'newMName'
    ).value.trim();


  const phone =
    document.getElementById(
      'newMPhone'
    ).value.trim();


  const memberNo =
    document.getElementById(
      'newMMemberNo'
    ).value.trim();


  const email =
    document.getElementById(
      'newMEmail'
    ).value.trim();


  const zimele =
    Number(
      document.getElementById(
        'newMZimele'
      ).value
    ) || 0;


  const monthly =
    Number(
      document.getElementById(
        'newMMonthly'
      ).value
    ) || 0;


  if(!name){

    alert(
      'Name required'
    );

    return;

  }


  const arrears =
    zimele - monthly;


  const {
    error
  } =
    await window.supabase

      .from('members')

      .insert({

        membership_number:
          memberNo,

        full_name:
          name,

        email:
          email,

        phone:
          phone,

        zimele:
          zimele,

        monthly:
          monthly,

        arrears:
          arrears,

        status:
          arrears >= 0
            ? 'Credit'
            : 'Arrears',

        role:
          'Member',

        withdrawal:
          '0.00'

      });


  if(error){

    alert(
      "Supabase Error: " +
      error.message
    );

    return;

  }


  closem();


  await window.loadLive();


  members();

};

window.saveEdit =
async function(i){

  const m =
    window.membersData[i];


  const zimele =
    Number(
      document.getElementById(
        'editMZimele'
      ).value
    ) || 0;


  const monthly =
    Number(
      document.getElementById(
        'editMMonthly'
      ).value
    ) || 0;


  const updated = {

    full_name:
      document.getElementById(
        'editMName'
      ).value,

    phone:
      document.getElementById(
        'editMPhone'
      ).value,

    email:
      document.getElementById(
        'editMEmail'
      ).value,

    zimele:
      zimele,

    monthly:
      monthly,

    arrears:
      zimele - monthly,

    status:
      (zimele - monthly) >= 0
        ? 'Credit'
        : 'Arrears'

  };


  const {
    error
  } =
    await window.supabase

      .from('members')

      .update(updated)

      .eq(
        'id',
        m.id
      );


  if(error){

    alert(
      error.message
    );

    return;

  }


  closem();


  await window.loadLive();


  members();

};


window.deleteMember =
async function(i){

  if(
    !confirm(
      'Delete ' +
      window.membersData[i].name +
      ' from Supabase LIVE?'
    )
  )
    return;


  const {
    error
  } =
    await window.supabase

      .from('members')

      .delete()

      .eq(
        'id',
        window.membersData[i].id
      );


  if(error){

    alert(
      error.message
    );

    return;

  }


  await window.loadLive();


  members();

};
