async function saveTopup(id){let amount=Number($('topAmount').value||0);if(amount<=0)return notify('Enter amount');let account=id==='main'?currentAccount:goals.find(x=>String(x.id)===String(id));if(!account)return notify('Account not found');let payload={account_id:account.id||null,transaction_date:new Date().toISOString().slice(0,10),transaction_type:'Deposit',amount,description:'M-Pesa Top Up',reference_no:'STK-'+Date.now()};let {error}=await supabaseClient.from('zimele_transactions').insert(payload);if(error)return notify(error.message);try{if(account.id)await supabaseClient.from('zimele_accounts').update({balance:Number(account.balance||0)+amount}).eq('id',account.id)}catch(e){}account.balance=Number(account.balance||0)+amount;closem();statements();notify('Deposit recorded. Production STK callback should confirm payment server-side.')}

function openL(id){let a=id==='main'?currentAccount:goals.find(x=>String(x.id)===String(id));modal(`<div class="stmt-header">LOCK-IN</div><div class="topup-body"><div class="topup-field"><label>Amount</label><input id="lockAmt" type="number" value="${Number(a?.balance||0)}"></div><div class="topup-field"><label>Until</label><input id="lockUntil" type="date"></div><div class="topup-field"><label>Period / Interest</label><select id="lockPeriod"><option>3 Months – 8%</option><option>6 Months – 10%</option><option>12 Months – 12%</option><option>Custom</option></select></div><div class="topup-field"><label>Reason</label><textarea id="lockReason"></textarea></div><div style="background:#fff3cd;padding:10px;border-radius:8px;font-size:11px">Early withdrawal warning: unlocking before maturity may attract a 10% penalty.</div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="activateLock('${esc(id)}')">Activate Lock-In</button><button class="btn d" onclick="unlockAccount('${esc(id)}')">Unlock</button></div>`)}

async function saveWithdrawal(){let amount=Number($('wdAmount').value||0);if(amount<=0)return notify('Enter amount');if(Number(currentAccount?.balance||0)<amount)return notify('Insufficient balance');if(currentAccount.locked_until&&new Date(currentAccount.locked_until)>new Date())return notify('Account is locked until '+currentAccount.locked_until);let {error}=await supabaseClient.from('zimele_transactions').insert({account_id:currentAccount.id||null,transaction_date:new Date().toISOString().slice(0,10),transaction_type:'Withdrawal',amount,description:$('wdDesc').value,reference_no:'WD-'+Date.now()});if(error)return notify(error.message);if(currentAccount.id)await supabaseClient.from('zimele_accounts').update({balance:Number(currentAccount.balance)-amount}).eq('id',currentAccount.id);currentAccount.balance-=amount;closem();home();notify('Withdrawal recorded')}

async function saveTransfer(){let to=$('toAcct').value.trim(),amount=Number($('trAmt').value||0);if(!to||amount<=0)return notify('Destination and amount required');if(amount>Number(currentAccount?.balance||0))return notify('Insufficient balance');let {data:dest}=await supabaseClient.from('zimele_accounts').select('*').eq('account_no',to).maybeSingle();if(!dest)return notify('Destination account not found');let date=new Date().toISOString().slice(0,10);let a=await supabaseClient.from('zimele_transactions').insert({account_id:currentAccount.id,transaction_date:date,transaction_type:'Withdrawal',amount,description:$('trDesc').value+' to '+to,reference_no:'TR-'+Date.now()});if(a.error)return notify(a.error.message);let b=await supabaseClient.from('zimele_transactions').insert({account_id:dest.id,transaction_date:date,transaction_type:'Deposit',amount,description:'Transfer from '+currentAccount.account_no,reference_no:'TR-'+Date.now()});if(b.error)return notify(b.error.message);await supabaseClient.from('zimele_accounts').update({balance:Number(currentAccount.balance)-amount}).eq('id',currentAccount.id);await supabaseClient.from('zimele_accounts').update({balance:Number(dest.balance||0)+amount}).eq('id',dest.id);currentAccount.balance-=amount;closem();home();notify('Transfer completed')}
async function getMembers(){let q=await supabaseClient.from('members').select('*').order('full_name');if(!q.error&&q.data?.length){membersCache=q.data;return q.data}return sampleMembers.map(x=>({full_name:x[0],short_name:x[1],phone:x[2],member_no:x[3],email:x[4],national_id:x[5],zimele_balance:x[6],monthly_increment:x[7],arrears:x[8],status:x[9],withdrawal:x[10],role:x[11],registration_date:x[12]}))}

function newLoan(){modal(`<div class="stmt-header">LOAN APPLICATION</div><div class="topup-body"><div class="row"><div><label>Amount</label><input id="loanAmt" type="number"></div><div><label>Purpose</label><input id="loanPurpose"></div><div><label>Guarantor 1 Member ID</label><input id="g1"></div><div><label>Guarantor 2 Member ID</label><input id="g2"></div></div><div class="flow" style="margin-top:14px"><div class="flow-step">1. Applicant approval — application submitted by member.</div><div class="flow-arrow">▼</div><div class="flow-step">2. Guarantor requests — Guarantor 1 and Guarantor 2 Accept / Reject.</div><div class="flow-arrow">▼</div><div class="flow-step">3. Loan Approvals — Secretary, Treasurer and Chairman.</div><div class="flow-arrow">▼</div><div class="flow-step"><b>4. Final Approval</b> — disbursement after all required approvals.</div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveLoan()">Submit Application</button></div>`)}
async function saveLoan(){if(!currentMember?.id)return notify('Real authenticated member required');let amt=Number($('loanAmt').value||0);if(amt<=0)return notify('Enter loan amount');let applicationNo='LA-'+Date.now();let q=await supabaseClient.from('loan_applications').insert({application_no:applicationNo,member_id:currentMember.id,amount:amt,purpose:$('loanPurpose').value,status:'Applicant Pending',guarantor_count:2}).select().single();if(q.error)return notify(q.error.message);let l=q.data;let gs=[$('g1').value,$('g2').value].filter(Boolean);if(gs.length){let rows=gs.map((m,i)=>({loan_application_id:l.id,guarantor_id:m,guarantor_no:i+1,status:'Pending'}));await supabaseClient.from('guarantor_requests').insert(rows)}await supabaseClient.from('loan_approvals').insert([{loan_application_id:l.id,approval_role:'Secretary',status:'Pending'},{loan_application_id:l.id,approval_role:'Treasurer',status:'Pending'},{loan_application_id:l.id,approval_role:'Chairman',status:'Pending'}]);closem();loanApplications();notify('Loan application submitted')}
async function viewLoan(id){let l=(await supabaseClient.from('loan_applications').select('*').eq('id',id).single()).data;let gs=(await supabaseClient.from('guarantor_requests').select('*').eq('loan_application_id',id)).data||[];let ap=(await supabaseClient.from('loan_approvals').select('*').eq('loan_application_id',id)).data||[];modal(`<div class="stmt-header">LOAN APPLICATION WORKFLOW</div><div class="topup-body"><div class="flow"><div class="flow-step"><b>Applicant approval</b><br>Applicant: ${esc(l?.member_id)}<br>Amount: KSh ${money(l?.amount)}<br>Status: <span class="badge">${esc(l?.status)}</span></div><div class="flow-arrow">▼</div><div class="flow-step"><b>Guarantor requests</b>${gs.length?gs.map(g=>`<div class="card"><b>Guarantor ${g.guarantor_no}</b> — ${esc(g.guarantor_id)}<br>Status: <span class="badge ${g.status==='Accepted'?'ok':g.status==='Rejected'?'no':'pending'}">${esc(g.status)}</span><div class="actions"><button class="btn s" onclick="guarantorDecision('${g.id}','Accepted','${id}')">Accept</button><button class="btn d" onclick="guarantorDecision('${g.id}','Rejected','${id}')">Reject</button></div></div>`).join(''):'<small>No guarantor requests found.</small>'}</div><div class="flow-arrow">▼</div><div class="flow-step"><b>Loan Approvals</b><div class="approval-grid">${['Secretary','Treasurer','Chairman'].map(r=>{let x=ap.find(a=>a.approval_role===r);return `<div class="card"><b>${r}</b><br><span class="badge ${x?.status==='Approved'?'ok':x?.status==='Rejected'?'no':'pending'}">${esc(x?.status||'Pending')}</span><br><button class="btn s" onclick="approveLoan('${x?.id}','Approved','${id}')">Approve</button><button class="btn d" onclick="approveLoan('${x?.id}','Rejected','${id}')">Reject</button></div>`}).join('')}</div></div><div class="flow-arrow">▼</div><div class="flow-step"><b>Final Approval</b><br><button class="btn p" onclick="finalApprove('${id}')">Final Approval / Disburse</button></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button></div>`)}
async function guarantorDecision(id,status,loan){let q=await supabaseClient.from('guarantor_requests').update({status,response_at:new Date().toISOString()}).eq('id',id);if(q.error)return notify(q.error.message);viewLoan(loan)}async function approveLoan(id,status,loan){if(!id)return notify('Approval row not found');let q=await supabaseClient.from('loan_approvals').update({status,approved_at:new Date().toISOString(),approved_by:currentUser?.id||null}).eq('id',id);if(q.error)return notify(q.error.message);viewLoan(loan)}async function finalApprove(id){let ap=(await supabaseClient.from('loan_approvals').select('*').eq('loan_application_id',id)).data||[];if(ap.length<3||ap.some(x=>x.status!=='Approved'))return notify('Secretary, Treasurer and Chairman must approve first');let q=await supabaseClient.from('loan_applications').update({status:'Approved',final_approved_at:new Date().toISOString()}).eq('id',id);if(q.error)return notify(q.error.message);closem();loanApplications();notify('Final approval completed. Disbursement can now be processed.')}

ates</h3><div class="row"><div><label>3 Months</label><input value="8%"></div><div><label>6 Months</label><input value="10%"></div><div><label>12 Months</label><input value="12%"></div></div>`;if(settingTab===14)return `<h3>About</h3><p><b>ZIMELE – THE KAUDHA ALUMNI FRATERNITY</b></p><p class="muted">Supabase-connected MIS interface preserving the Financials, Statements, Members, Documents, Projects, Loan Application and 15 Settings modules.</p>`;return `<h3>${settingNames[settingTab]}</h3><p class="muted">Configuration panel for ${settingNames[settingTab]}. Values should be stored in the Supabase settings table for production use.</p><div class="row"><div><label>Setting</label><input id="setKey" value="${settingNames[settingTab]}"></div><div><label>Value</label><input id="setValue"></div></div><button class="btn p" onclick="saveSetting()">Save Setting</button>`}

/* ========================= ZIMELE SUPABASE DATA LAYER — CORRECTED =========================
   This layer uses the actual columns in the connected database. No demo member/account
   data is used as a fallback for production screens.

const DB={members:'members',accounts:'zimele_accounts',tx:'zimele_transactions',reminders:'zimele_reminders',projects:'projects',docs:'documents',loans:'loan_applications',approvals:'loan_approvals',guarantors:'guarantor_requests',settings:'settings',permissions:'permissions',roles:'roles',audit:'audit_logs',profiles:'profiles'};
const today=()=>new Date().toISOString().slice(0,10);
function dbErr(error){ if(error){ console.error('[ZIMELE Supabase]',error); notify(error.message||String(error)); return true } return false }
function displayAccount(a){return {...a,name:a.goal_name ? a.goal_name : 'Main Account'};}
async function addAudit(action,detail='',module='System',recordId=null){
  try{await supabaseClient.from(DB.audit).insert({action,module,record_id:recordId,description:detail})}catch(e){console.warn('Audit log failed',e)}
}
async function refreshAll(){await loadUser();}

async function loadUser(){
  if(!currentUser?.email)return;
  const {data:m,error}=await supabaseClient.from(DB.members).select('*').eq('email',currentUser.email).maybeSingle();
  if(error){dbErr(error);return}
  currentMember=m||null;
  if(!currentMember){
    const {data:p}=await supabaseClient.from(DB.profiles).select('*').eq('id',currentUser.id).maybeSingle();
    currentRole=p?.role||currentUser.app_metadata?.role||'Member';
    currentMember=p?.member_id?{id:p.member_id,full_name:p.full_name,email:p.email,phone:p.phone,role:currentRole}:null;
  } else currentRole=currentMember.role||currentUser.app_metadata?.role||'Member';
  if(currentMember?.id)await loadAccount(); else {currentAccount=null;goals=[]}
  setRoleUI();
}

async function loadAccount(){
  if(!currentMember?.id)return;
  const {data,error}=await supabaseClient.from(DB.accounts).select('*').eq('member_id',currentMember.id).order('created_at',{ascending:true});
  if(error){dbErr(error);currentAccount=null;goals=[];return}
  const rows=(data||[]).map(displayAccount);
  currentAccount=rows.find(a=>!a.goal_name)||rows[0]||null;
  goals=rows.filter(a=>a.id!==currentAccount?.id && !!a.goal_name);
}

function setRoleUI(){
  if($('currentRoleLabel'))$('currentRoleLabel').textContent=currentRole||'Member';
  if($('sideName'))$('sideName').textContent=currentMember?.full_name||currentUser?.email||'Member';
  if($('sideRoleBadge')){$('sideRoleBadge').textContent=currentRole||'Member';$('sideRoleBadge').className='role-badge '+roleClass(currentRole||'Member')}
}

async function doLogin(){
  const email=$('loginEmail').value.trim(),pass=$('loginPass').value;
  if(!email||!pass)return notify('Enter email and password');
  const {error}=await supabaseClient.auth.signInWithPassword({email,password:pass});
  if(dbErr(error))return;
}
function demoLogin(){notify('Demo mode is disabled. Sign in with a Supabase Auth account so all data is real.');}
async function doLogout(){await supabaseClient.auth.signOut();currentUser=null;currentMember=null;currentAccount=null;goals=[];$('app').style.display='none';$('loginWrap').style.display='flex'}
function showApp(){$('loginWrap').style.display='none';$('app').style.display='block';setRoleUI();home()}

async function home(){
  if(currentUser&&!currentMember?.id){return renderEmptyState('No member record is linked to this Supabase Auth account. Add/link the member in Members before using financial modules.')}
  await loadAccount();
  const bal=Number(currentAccount?.balance||0), arr=Number(currentAccount?.arrears||0);
  $('main').innerHTML=`<div class="hero"><h2 style="margin:0 0 8px">THE KAUDHA ALUMNI FRATERNITY Accounts</h2><div>Main account: <b>${esc(currentAccount?.account_no||'Not created')}</b></div><div style="font-size:30px;font-weight:900;margin-top:10px">KSh ${money(bal)}</div><small>Available ZIMELE balance</small></div><div class="grid4" style="margin-top:12px"><div class="action" onclick="financials()">💰<h3>Financials</h3><small>Deposit • Withdraw • Transfer</small></div><div class="action" onclick="statements()">📄<h3>Statements – 6 Buttons Active</h3><small>Chama • Member • Top Up • Annual • Reminders • Lock-In</small></div><div class="action" onclick="loanApplications()">💳<h3>Loan Application</h3><small>Applicant • Guarantors • Approvals</small></div><div class="action ${arr<0?'arrears-card':'member-credit'}" onclick="members()">⚠️<h3>${arr<0?'Arrears':'Credit'}</h3><b>KSh ${money(Math.abs(arr))}</b></div></div>`;
}
function renderEmptyState(message){$('main').innerHTML=`<div class="card"><h2>ZIMELE</h2><p>${esc(message)}</p><button class="btn p" onclick="members()">Open Members</button></div>`}

async function statements(){toggleSide();await loadAccount();const arr=[currentAccount,...goals].filter(Boolean);$('main').innerHTML='<div class="statements-title">STATEMENTS</div><div style="text-align:center;margin-bottom:12px"><button class="btn p" onclick="addGoal()">＋ Add Goal Account</button></div>'+(arr.length?arr.map(statementCard).join(''):'<div class="card" style="text-align:center">No ZIMELE accounts found.</div>')}
function statementCard(a){return `<div class="statement-card"><b>Account Statement</b><div style="font-size:18px;font-weight:900;margin:8px">${esc(a.name||'Main Account')}</div><div class="muted">A/C Type: Fixed Income Fund (Savings Plan)</div><div>Member No: <b>${esc(currentMember?.member_no||'')}</b></div><div>Account No: <b>${esc(a.account_no||'')}</b></div>${a.goal_name?`<div>Goal: <b>${esc(a.goal_name)}</b></div>`:''}<div style="font-size:24px;font-weight:900;margin:10px">KSh ${money(a.balance)}</div><div>Target: KSh ${money(a.target_amount||0)} | Period: ${esc(a.target_period||'Open')}</div>${a.locked_until?`<div class="badge pending">🔒 Locked until ${esc(a.locked_until)}</div>`:''}<div class="btns-grid"><button class="btn-outline" onclick="openC('${esc(a.id)}')">Chama Statement</button><button class="btn-outline" onclick="openB('${esc(a.id)}')">Member Statement</button><button class="btn-outline" onclick="topup('${esc(a.id)}')">Top Up</button><button class="btn-outline" onclick="openA('${esc(a.id)}')">Annual Report</button><button class="btn-outline" onclick="openR('${esc(a.id)}')">Reminders</button><button class="btn-outline" onclick="openL('${esc(a.id)}')">Lock-In</button></div></div>`}
function addGoal(){modal(`<div class="topup-header">Add Goal Account</div><div class="topup-body"><div class="row"><div><label>Goal Name</label><input id="gName" placeholder="Goal name"></div><div><label>Target Amount</label><input id="gTarget" type="number" min="0"></div><div><label>Target Period</label><input id="gPeriod" placeholder="12 Months"></div><div><label>Opening Balance</label><input id="gBal" type="number" min="0" value="0"></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveGoal()">Create Goal</button></div>`)}
async function saveGoal(){
  if(!currentMember?.id)return notify('No database member is linked to this login');
  const goal=$('gName').value.trim(),target=Number($('gTarget').value||0),period=$('gPeriod').value.trim(),bal=Number($('gBal').value||0);
  if(!goal)return notify('Goal name required'); if(bal<0||target<0)return notify('Amounts cannot be negative');
  const accountNo=`GOAL-${currentMember.member_no||currentMember.id}-${Date.now()}`;
  const {data,error}=await supabaseClient.from(DB.accounts).insert({account_no:accountNo,member_id:currentMember.id,member_name:currentMember.full_name||'',goal_name:goal,balance:bal,target_amount:target,target_period:period,monthly_increment:0,arrears:0,status:'Active'}).select().single();
  if(dbErr(error))return; goals.unshift(displayAccount(data)); closem();await loadAccount();statements();await addAudit('CREATE','Goal account created: '+goal,'Financials',data.id);notify('Goal account created in Supabase')
}

async function accountTransactions(id){if(!id)return [];const {data,error}=await supabaseClient.from(DB.tx).select('*').eq('account_id',id).order('transaction_date',{ascending:false}).order('id',{ascending:false});if(dbErr(error))return [];return data||[]}
function txDeposit(r){return Number(r.deposit||0)} function txWithdrawal(r){return Number(r.withdrawal||0)} function txInterest(r){return Number(r.interest||0)}
async function openC(id){const rows=await accountTransactions(id);modal(`<div class="stmt-header">CHAMA STATEMENT</div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Deposit</th><th>Withdrawal</th><th>Interest</th><th>Reference</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${esc(r.transaction_date)}</td><td>${esc(r.description||'')}</td><td>${money(txDeposit(r))}</td><td>${money(txWithdrawal(r))}</td><td>${money(txInterest(r))}</td><td>${esc(r.reference_no||'')}</td></tr>`).join(''):`<tr><td colspan="6" style="text-align:center">No transactions found.</td></tr>`}</tbody></table></div><div class="summary-box"><table><tr><td>Total Deposit</td><td>${money(rows.reduce((s,r)=>s+txDeposit(r),0))}</td></tr><tr><td>Total Withdrawal</td><td>${money(rows.reduce((s,r)=>s+txWithdrawal(r),0))}</td></tr><tr><td>Total Interest</td><td>${money(rows.reduce((s,r)=>s+txInterest(r),0))}</td></tr></table></div><div class="topup-footer"><button class="btn l" onclick="printCurrent()">Print/PDF</button><button class="btn s" onclick="downloadCurrentCSV()">Excel</button><button class="btn l" onclick="closem()">Close</button></div>`)}

async function openB(){const rows=await getMembers();modal(`<div class="stmt-header">MEMBER STATEMENT</div><div class="table-wrap"><table id="memberStmt"><thead><tr><th>No</th><th>Date</th><th>Description</th><th>Deposit</th><th>Withdrawal</th><th>Zimele Account</th><th>Monthly Increment</th><th>Arrears</th><th>Status</th></tr></thead><tbody>${rows.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.registration_date||'')}</td><td>${esc(m.full_name||'')}</td><td>${money(m.zimele_balance)}</td><td>${money(m.withdrawal)}</td><td>${money(m.zimele_balance)}</td><td>${money(m.monthly_increment)}</td><td>${money(m.arrears)}</td><td><span class="${Number(m.arrears)<0?'status-arrears':'status-credit'}">${esc(m.status||'')}</span></td></tr>`).join('')}</tbody></table></div><div style="padding:12px;font-weight:800">Total Withdrawal: KSh ${money(rows.reduce((s,m)=>s+Number(m.withdrawal||0),0))}</div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button><button class="btn s" onclick="downloadCurrentCSV()">Download</button></div>`) }

function topup(id){const a=[currentAccount,...goals].find(x=>String(x?.id)===String(id));if(!a)return notify('Account not found');modal(`<div class="topup-header">M-PESA TOP UP</div><div class="topup-body"><div class="topup-field"><label>M-Pesa Phone</label><input id="mpesaPhone" value="${esc(currentMember?.phone||'')}"></div><div class="topup-field"><label>Amount</label><input id="topAmount" type="number" min="1"></div><div class="topup-field acct-display">Account Number: <b>${esc(a.account_no)}</b></div><div style="background:#e8f5e9;padding:10px;border-radius:8px;font-size:11px"><b>Paybill 501101</b><br>Use your account number as the account/reference.</div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveTopup('${esc(id)}')">Save Deposit</button></div>`)}
async function saveTopup(id){
  const a=[currentAccount,...goals].find(x=>String(x?.id)===String(id));const amount=Number($('topAmount').value||0);if(!a)return notify('Account not found');if(amount<=0)return notify('Enter amount');
  const ref='DEP-'+Date.now();const {data,error}=await supabaseClient.from(DB.tx).insert({account_id:a.id,member_id:currentMember.id,transaction_date:today(),description:'M-Pesa Top Up',deposit:amount,withdrawal:0,interest:0,reference_no:ref}).select().single();if(dbErr(error))return;
  const newBal=Number(a.balance||0)+amount;const u=await supabaseClient.from(DB.accounts).update({balance:newBal}).eq('id',a.id).select().single();if(dbErr(u.error))return;await loadAccount();closem();statements();await addAudit('CREATE','Deposit '+amount,'Financials',data.id);notify('Deposit saved to Supabase')
}

async function openA(id){const a=[currentAccount,...goals].find(x=>String(x?.id)===String(id));if(!a)return notify('Account not found');const rows=await accountTransactions(a.id);const y=new Date().getFullYear();const start=`${y}-01-01`,end=`${y}-12-31`;const yr=rows.filter(r=>r.transaction_date>=start&&r.transaction_date<=end);const deposits=yr.reduce((s,r)=>s+txDeposit(r),0),interest=yr.reduce((s,r)=>s+txInterest(r),0),withdrawals=yr.reduce((s,r)=>s+txWithdrawal(r),0);const opening=Number(a.balance||0)-deposits-interest+withdrawals;const closing=Number(a.balance||0);modal(`<div class="stmt-header">ANNUAL REPORT – FY ${y}</div><div style="padding:18px"><table><tr><td>Opening Balance</td><td>KSh ${money(opening)}</td></tr><tr><td>Deposits</td><td>KSh ${money(deposits)}</td></tr><tr><td>Withdrawals</td><td>KSh ${money(withdrawals)}</td></tr><tr><td>Gross Interest</td><td>KSh ${money(interest)}</td></tr><tr><th>Closing Balance</th><th>KSh ${money(closing)}</th></tr></table></div><div class="topup-footer"><button class="btn l" onclick="printCurrent()">Print/PDF</button><button class="btn l" onclick="closem()">Close</button></div>`)}

async function openR(id){const accountId=id||currentAccount?.id;if(!accountId)return notify('Account not found');const q=await supabaseClient.from(DB.reminders).select('*').eq('account_id',accountId).order('reminder_date',{ascending:true});if(dbErr(q.error))return;reminders=q.data||[];modal(`<div class="stmt-header">REMINDERS</div><div class="topup-body"><div class="row"><div><label>Message</label><input id="rMsg"></div><div><label>Date</label><input id="rDate" type="date"></div><div><label>Repeat</label><select id="rRepeat"><option>Once</option><option>Monthly</option><option>Weekly</option><option>Yearly</option></select></div><div><label>Type</label><select id="rType"><option>SMS</option><option>Email</option><option>Both</option></select></div><div><label>Time</label><input id="rTime" type="time"></div></div><button class="btn p" onclick="saveReminder('${esc(accountId)}')">Save Reminder</button><hr>${reminders.map(r=>`<div class="card"><b>${esc(r.message)}</b><br><small>${esc(r.reminder_date||'')} ${esc(r.reminder_time||'')} • ${esc(r.frequency||'Once')} • ${esc(r.reminder_type||'Both')}</small><button class="btn d right" onclick="deleteReminder('${r.id}','${esc(accountId)}')">Delete</button></div>`).join('')}</div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button></div>`)}
async function saveReminder(accountId){if(!accountId)return notify('Account not found');const p={account_id:accountId,message:$('rMsg').value.trim(),reminder_date:$('rDate').value||null,frequency:$('rRepeat').value,reminder_type:$('rType').value,reminder_time:$('rTime').value||null,repeat_enabled:$('rRepeat').value!=='Once'};if(!p.message)return notify('Message required');const q=await supabaseClient.from(DB.reminders).insert(p).select().single();if(dbErr(q.error))return;await addAudit('CREATE','Reminder created','Financials',q.data.id);openR(accountId);notify('Reminder saved to Supabase')}
async function deleteReminder(id,accountId){const q=await supabaseClient.from(DB.reminders).delete().eq('id',id);if(dbErr(q.error))return;await addAudit('DELETE','Reminder deleted','Financials',id);openR(accountId)}

function openL(id){const a=[currentAccount,...goals].find(x=>String(x?.id)===String(id));if(!a)return notify('Account not found');modal(`<div class="stmt-header">LOCK-IN</div><div class="topup-body"><div class="topup-field"><label>Amount</label><input id="lockAmt" type="number" value="${Number(a.balance||0)}"></div><div class="topup-field"><label>Until</label><input id="lockUntil" type="date"></div><div class="topup-field"><label>Period / Interest</label><select id="lockPeriod"><option>3 Months – 8%</option><option>6 Months – 10%</option><option>12 Months – 12%</option><option>Custom</option></select></div><div style="background:#fff3cd;padding:10px;border-radius:8px;font-size:11px">Early withdrawal warning: unlocking before maturity may attract a 10% penalty.</div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="activateLock('${esc(id)}')">Activate Lock-In</button><button class="btn d" onclick="unlockAccount('${esc(id)}')">Unlock</button></div>`)}
async function activateLock(id){const a=[currentAccount,...goals].find(x=>String(x?.id)===String(id));if(!a)return;const until=$('lockUntil').value;if(!until)return notify('Select unlock date');if(new Date(until)<=new Date())return notify('Unlock date must be in the future');const q=await supabaseClient.from(DB.accounts).update({locked_until:until,locked_amount:Number($('lockAmt').value||a.balance)}).eq('id',a.id).select().single();if(dbErr(q.error))return;await loadAccount();closem();statements();await addAudit('UPDATE','Lock-In activated','Financials',a.id);notify('Lock-In saved to Supabase')}
async function unlockAccount(id){const a=[currentAccount,...goals].find(x=>String(x?.id)===String(id));if(!a)return;const early=a.locked_until&&new Date(a.locked_until)>new Date();if(early&&!confirm('Unlock before maturity? A 10% penalty may apply. Continue?'))return;const q=await supabaseClient.from(DB.accounts).update({locked_until:null,locked_amount:0}).eq('id',a.id).select().single();if(dbErr(q.error))return;await loadAccount();closem();statements();await addAudit('UPDATE','Account unlocked','Financials',a.id);notify('Account unlocked')}

async function saveWithdrawal(){const amount=Number($('wdAmount').value||0);if(amount<=0)return notify('Enter amount');await loadAccount();if(!currentAccount)return notify('Main account not found');if(amount>Number(currentAccount.balance||0))return notify('Insufficient balance');if(currentAccount.locked_until&&new Date(currentAccount.locked_until)>new Date())return notify('Account is locked until '+currentAccount.locked_until);const ref='WD-'+Date.now();const q=await supabaseClient.from(DB.tx).insert({account_id:currentAccount.id,member_id:currentMember.id,transaction_date:today(),description:$('wdDesc').value||'Member withdrawal',deposit:0,withdrawal:amount,interest:0,reference_no:ref}).select().single();if(dbErr(q.error))return;const u=await supabaseClient.from(DB.accounts).update({balance:Number(currentAccount.balance)-amount}).eq('id',currentAccount.id).select().single();if(dbErr(u.error))return;await loadAccount();closem();home();await addAudit('CREATE','Withdrawal '+amount,'Financials',q.data.id);notify('Withdrawal saved to Supabase')}
async function saveTransfer(){await loadAccount();const to=$('toAcct').value.trim(),amount=Number($('trAmt').value||0);if(!to||amount<=0)return notify('Destination and amount required');if(!currentAccount)return notify('Main account not found');if(to===currentAccount.account_no)return notify('Destination must be different');if(amount>Number(currentAccount.balance||0))return notify('Insufficient balance');if(currentAccount.locked_until&&new Date(currentAccount.locked_until)>new Date())return notify('Account is locked until '+currentAccount.locked_until);const d=await supabaseClient.from(DB.accounts).select('*').eq('account_no',to).maybeSingle();if(dbErr(d.error))return;if(!d.data)return notify('Destination account not found');const ref='TR-'+Date.now(),date=today(),desc=$('trDesc').value||'Account transfer';const a=await supabaseClient.from(DB.tx).insert({account_id:currentAccount.id,member_id:currentMember.id,transaction_date:date,description:desc+' to '+to,deposit:0,withdrawal:amount,interest:0,reference_no:ref}).select().single();if(dbErr(a.error))return;const b=await supabaseClient.from(DB.tx).insert({account_id:d.data.id,member_id:d.data.member_id,transaction_date:date,description:'Transfer from '+currentAccount.account_no,deposit:amount,withdrawal:0,interest:0,reference_no:ref}).select().single();if(dbErr(b.error))return;const u1=await supabaseClient.from(DB.accounts).update({balance:Number(currentAccount.balance)-amount}).eq('id',currentAccount.id).select().single();if(dbErr(u1.error))return;const u2=await supabaseClient.from(DB.accounts).update({balance:Number(d.data.balance||0)+amount}).eq('id',d.data.id).select().single();if(dbErr(u2.error))return;await loadAccount();closem();home();await addAudit('CREATE','Transfer '+amount,'Financials',a.data.id);notify('Transfer saved to Supabase')}

async function getMembers(){const q=await supabaseClient.from(DB.members).select('*').order('full_name');if(dbErr(q.error))return [];const ms=q.data||[];if(!ms.length)return [];
  const ids=ms.map(m=>m.id);const aq=await supabaseClient.from(DB.accounts).select('*').in('member_id',ids);if(dbErr(aq.error))return ms;
  const uq=await supabaseClient.from('users').select('member_id,role,status').in('member_id',ids);if(uq.error)console.warn('Users role lookup failed:',uq.error);
  const pq=await supabaseClient.from(DB.profiles).select('member_id,role,status').in('member_id',ids);if(pq.error)console.warn('Profiles role lookup failed:',pq.error);
  const mainBy={};(aq.data||[]).forEach(a=>{if(!a.goal_name&&!mainBy[a.member_id])mainBy[a.member_id]=a});
  const userBy={};(uq.data||[]).forEach(x=>{if(x.member_id&&!userBy[x.member_id])userBy[x.member_id]=x});
  const profileBy={};(pq.data||[]).forEach(x=>{if(x.member_id&&!profileBy[x.member_id])profileBy[x.member_id]=x});
  return ms.map(m=>{const a=mainBy[m.id]||{},u=userBy[m.id]||{},pr=profileBy[m.id]||{};return {...m,zimele_balance:Number(a.balance||0),monthly_increment:Number(a.monthly_increment||0),arrears:Number(a.arrears||0),status:a.status||m.status||'',withdrawal:0,account_no:a.account_no||'',role:u.role||pr.role||'Member'}})
}
async function members(){toggleSide();const rows=await getMembers();renderMembers(rows)}
function renderMembers(rows){$('main').innerHTML=`<div class="card"><h2 style="margin:0">Members – FULLY ACTIVE – ${rows.length} Members</h2><div class="grid4" style="margin-top:12px"><div class="card"><b>${rows.length}</b><br><small>Total Members</small></div><div class="card"><b>${rows.filter(x=>Number(x.arrears||0)>=0).length}</b><br><small>Credit</small></div><div class="card"><b>${rows.filter(x=>Number(x.arrears||0)<0).length}</b><br><small>Arrears</small></div><div class="card"><b>KSh ${money(rows.reduce((s,x)=>s+Number(x.zimele_balance||0),0))}</b><br><small>ZIMELE Total</small></div></div><div class="actions"><input id="memSearch" style="max-width:260px" placeholder="Search member..." oninput="filterMembers()"><select id="memStatus" style="max-width:180px" onchange="filterMembers()"><option value="">All Status</option><option>Credit</option><option>Arrears</option></select><button class="btn p" onclick="memberForm()">＋ Add Member</button><button class="btn s" onclick="exportMembers()">Export Excel</button><button class="btn l" onclick="window.print()">Print</button></div></div><div class="card table-wrap"><table id="membersTable"><thead><tr><th>No</th><th>Member</th><th>Phone</th><th>Member No</th><th>Zimele</th><th>Monthly</th><th>Arrears</th><th>Status</th><th>Role</th><th>Actions</th></tr></thead><tbody>${memberRows(rows)}</tbody></table></div>`;window._members=rows}
function memberRows(rows){return rows.map((m,i)=>`<tr><td>${i+1}</td><td><b>${esc(m.full_name)}</b><br><small>${esc(m.email||'')}</small></td><td>${esc(m.phone||'')}</td><td>${esc(m.member_no||'')}</td><td>${money(m.zimele_balance)}</td><td>${money(m.monthly_increment)}</td><td>${money(m.arrears)}</td><td><span class="${Number(m.arrears||0)<0?'status-arrears':'status-credit'}">${esc(m.status||'')}</span></td><td><span class="role-badge ${roleClass(m.role||'Member')}">${esc(m.role||'Member')}</span></td><td class="actions"><button class="btn l" onclick="viewMember(${i})">View</button><button class="btn l" onclick="editMember(${i})">Edit</button><button class="btn l" onclick="openC('${esc(m.account_id||'')}')">Statement</button><button class="btn d" onclick="deleteMember(${i})">Del</button></td></tr>`).join('')}
function filterMembers(){const s=($('memSearch')?.value||'').toLowerCase(),st=$('memStatus')?.value||'';renderMembers((window._members||[]).filter(m=>(!s||JSON.stringify(m).toLowerCase().includes(s))&&(!st||m.status===st)))}
function memberForm(m=null,index=null){modal(`<div class="stmt-header">${m?'Edit':'Add'} Member</div><div class="topup-body"><div class="row"><div><label>Full Name</label><input id="mfName" value="${esc(m?.full_name)}"></div><div><label>Phone</label><input id="mfPhone" value="${esc(m?.phone)}"></div><div><label>Member No</label><input id="mfNo" value="${esc(m?.member_no)}"></div><div><label>Email</label><input id="mfEmail" value="${esc(m?.email)}"></div><div><label>National ID</label><input id="mfId" value="${esc(m?.national_id)}"></div><div><label>Role</label><select id="mfRole">${['Member','Manager','Secretary','Treasurer','Chairman','Admin'].map(r=>`<option ${m?.role===r?'selected':''}>${r}</option>`).join('')}</select></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveMember(${index===null?'null':index})">Save</button></div>`)}
async function saveMember(index){const p={full_name:$('mfName').value.trim(),phone:$('mfPhone').value.trim(),member_no:$('mfNo').value.trim(),email:$('mfEmail').value.trim(),national_id:$('mfId').value.trim(),status:'Active'};const selectedRole=$('mfRole')?.value||'Member';if(!p.full_name||!p.member_no)return notify('Full name and member number are required');let q;if(index===null){q=await supabaseClient.from(DB.members).insert(p).select().single()}else{const m=window._members[index];if(!m?.id)return notify('Database member ID missing');q=await supabaseClient.from(DB.members).update(p).eq('id',m.id).select().single()}if(dbErr(q.error))return;const saved=q.data;const uq=await supabaseClient.from('users').update({role:selectedRole,full_name:p.full_name,phone:p.phone,email:p.email}).eq('member_id',saved.id);if(uq.error)console.warn('Role/user mapping not updated:',uq.error);const pq=await supabaseClient.from(DB.profiles).update({role:selectedRole,full_name:p.full_name,phone:p.phone,email:p.email}).eq('member_id',saved.id);if(pq.error)console.warn('Profile role mapping not updated:',pq.error);closem();await addAudit(index===null?'CREATE':'UPDATE',index===null?'Member created':'Member updated','Members',saved.id);await members();notify('Member saved to Supabase')}
function viewMember(i){const m=window._members[i];modal(`<div class="stmt-header">MEMBER DETAILS</div><div style="padding:18px"><div class="profile-avatar">👤</div><h2 style="text-align:center">${esc(m.full_name)}</h2><table>${Object.entries(m).filter(([k])=>!['id','created_at','updated_at'].includes(k)).map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('')}</table></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button></div>`)}function editMember(i){memberForm(window._members[i],i)}async function deleteMember(i){const m=window._members[i];if(!m?.id)return;if(!confirm('Delete this member and related records where allowed?'))return;const q=await supabaseClient.from(DB.members).delete().eq('id',m.id);if(dbErr(q.error))return;await addAudit('DELETE','Member deleted','Members',m.id);members()}
async function exportMembers(){const rows=await getMembers();const csv=['No,Full Name,Phone,Member No,Zimele,Monthly,Arrears,Status,Role'].concat(rows.map((m,i)=>[i+1,m.full_name,m.phone,m.member_no,m.zimele_balance,m.monthly_increment,m.arrears,m.status,m.role].map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(','))).join('\n');downloadBlob(csv,'members.csv','text/csv')}

const DOC_BUCKET='documents';
async function documentSignedUrl(path,download=false){if(!path)return null;if(/^https?:\/\//i.test(path))return download&&!path.includes('download=')?path+(path.includes('?')?'&':'?')+'download=1':path;const q=await supabaseClient.storage.from(DOC_BUCKET).createSignedUrl(path,3600,download?{download:true}:{});if(q.error){notify(q.error.message||'Unable to access document');return null}return q.data?.signedUrl||null}
async function docs(){toggleSide();const q=await supabaseClient.from(DB.docs).select('*').order('date',{ascending:false});if(dbErr(q.error))return;const rows=q.data||[];window._documents=rows;$('main').innerHTML=`<div class="card"><h2>Documents</h2><p class="muted">Upload, view, edit and download documents stored with Supabase.</p><button class="btn p" onclick="documentForm()">⬆ Upload Document</button></div><div class="card table-wrap"><table><thead><tr><th>Title</th><th>Category</th><th>Description</th><th>Date</th><th>File</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(d=>{const key=d.document_id||d.id;return `<tr><td>${esc(d.title)}</td><td>${esc(d.category)}</td><td>${esc(d.description)}</td><td>${esc(d.date)}</td><td>${d.file_url?`<button class="btn l" onclick="viewDoc('${esc(key)}')">View</button>`:'No file'}</td><td><div class="actions"><button class="btn p" onclick="documentForm('${esc(key)}')">Edit</button>${d.file_url?`<button class="btn s" onclick="downloadDoc('${esc(key)}')">Download</button>`:''}<button class="btn d" onclick="deleteDoc('${esc(key)}')">Delete</button></div></td></tr>`}).join(''):`<tr><td colspan="6">No documents found.</td></tr>`}</tbody></table></div>`}
function documentForm(id=null){const d=id?(window._documents||[]).find(x=>String(x.document_id||x.id)===String(id)):null;modal(`<div class="stmt-header">${d?'EDIT DOCUMENT':'UPLOAD DOCUMENT'}</div><div class="topup-body"><label>Title</label><input id="dTitle" value="${esc(d?.title||'')}"><label>Category</label><input id="dCat" value="${esc(d?.category||'')}"><label>Description</label><textarea id="dDesc">${esc(d?.description||'')}</textarea><label>File ${d?.file_url?'(choose a new file only if replacing)':''}</label><input id="dFile" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.png,.jpg,.jpeg,.zip"><small class="muted">File storage bucket: <b>${DOC_BUCKET}</b></small></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveDoc('${d?esc(d.document_id||d.id):''}')">${d?'Save Changes':'Upload & Save'}</button></div>`)}
async function saveDoc(id=''){const title=$('dTitle').value.trim(),category=$('dCat').value.trim(),description=$('dDesc').value.trim(),file=$('dFile')?.files?.[0];if(!title)return notify('Document title required');const existing=id?(window._documents||[]).find(x=>String(x.document_id||x.id)===String(id)):null;let filePath=existing?.file_url||null;if(file){const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');filePath=`${currentUser?.id||'user'}/${Date.now()}-${safe}`;const up=await supabaseClient.storage.from(DOC_BUCKET).upload(filePath,file,{contentType:file.type||'application/octet-stream',upsert:false});if(dbErr(up.error))return}const payload={title,category,description,date:existing?.date||today(),file_url:filePath};let q;if(existing){q=await supabaseClient.from(DB.docs).update(payload).eq(existing.document_id?'document_id':'id',existing.document_id||existing.id).select().single()}else{payload.document_id='DOC-'+Date.now();q=await supabaseClient.from(DB.docs).insert(payload).select().single()}if(dbErr(q.error)){if(file&&filePath&&filePath!==existing?.file_url)await supabaseClient.storage.from(DOC_BUCKET).remove([filePath]);return}if(existing?.file_url&&filePath&&existing.file_url!==filePath&&!/^https?:\/\//i.test(existing.file_url))await supabaseClient.storage.from(DOC_BUCKET).remove([existing.file_url]);closem();await addAudit(existing?'UPDATE':'CREATE',existing?'Document edited':'Document uploaded','Documents',q.data?.id);await docs();notify(existing?'Document updated':'Document uploaded to Supabase')}
async function viewDoc(id){const d=(window._documents||[]).find(x=>String(x.document_id||x.id)===String(id));if(!d?.file_url)return notify('No file attached');const url=await documentSignedUrl(d.file_url,false);if(url)window.open(url,'_blank','noopener')}
async function downloadDoc(id){const d=(window._documents||[]).find(x=>String(x.document_id||x.id)===String(id));if(!d?.file_url)return notify('No file attached');const url=await documentSignedUrl(d.file_url,true);if(url)window.open(url,'_blank','noopener')}
async function deleteDoc(id){const d=(window._documents||[]).find(x=>String(x.document_id||x.id)===String(id));if(!d)return;if(!confirm('Delete document?'))return;if(d.file_url&&!/^https?:\/\//i.test(d.file_url))await supabaseClient.storage.from(DOC_BUCKET).remove([d.file_url]);const key=d.document_id?'document_id':'id';const q=await supabaseClient.from(DB.docs).delete().eq(key,d.document_id||d.id);if(dbErr(q.error))return;await addAudit('DELETE','Document deleted','Documents',d.id);await docs();notify('Document deleted')}

async function projects(){toggleSide();const q=await supabaseClient.from(DB.projects).select('*').order('start_date',{ascending:false});if(dbErr(q.error))return;const rows=q.data||[];$('main').innerHTML=`<div class="card"><h2>Projects</h2><button class="btn p" onclick="projectForm()">＋ Add Project</button></div><div class="grid4">${rows.length?rows.map(p=>`<div class="card"><h3>${esc(p.project_name)}</h3><p>${esc(p.description)}</p><b>Budget: KSh ${money(p.budget)}</b><br>Spent: KSh ${money(p.amount_spent)}<br><span class="badge">${esc(p.status||'')}</span><div class="actions" style="margin-top:10px"><button class="btn l" onclick="projectForm(${p.id})">Edit</button></div></div>`).join(''):`<div class="card">No projects found.</div>`}</div>`}
function projectForm(id=null){const p=id?(window._projects||[]).find(x=>x.id===id):null;modal(`<div class="stmt-header">${p?'Edit':'Add'} Project</div><div class="topup-body"><label>Name</label><input id="pName" value="${esc(p?.project_name)}"><label>Description</label><textarea id="pDesc">${esc(p?.description)}</textarea><div class="row"><div><label>Start Date</label><input id="pDate" type="date" value="${esc(p?.start_date)}"></div><div><label>Budget</label><input id="pBudget" type="number" value="${p?.budget||0}"></div><div><label>Amount Spent</label><input id="pSpent" type="number" value="${p?.amount_spent||0}"></div><div><label>Status</label><select id="pStatus"><option ${p?.status==='Active'?'selected':''}>Active</option><option ${p?.status==='Completed'?'selected':''}>Completed</option><option ${p?.status==='Pending'?'selected':''}>Pending</option></select></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveProject(${id??'null'})">Save</button></div>`)}
async function saveProject(id){const p={project_name:$('pName').value.trim(),description:$('pDesc').value.trim(),start_date:$('pDate').value||null,budget:Number($('pBudget').value||0),amount_spent:Number($('pSpent').value||0),status:$('pStatus').value};if(!p.project_name)return notify('Project name required');const q=id?await supabaseClient.from(DB.projects).update(p).eq('id',id).select().single():await supabaseClient.from(DB.projects).insert(p).select().single();if(dbErr(q.error))return;closem();projects();await addAudit(id?'UPDATE':'CREATE','Project saved','Projects',q.data?.id);notify('Project saved to Supabase')}

function newLoan(){modal(`<div class="stmt-header">LOAN APPLICATION</div><div class="topup-body"><div class="row"><div><label>Amount</label><input id="loanAmt" type="number" min="1"></div><div><label>Purpose</label><input id="loanPurpose"></div><div><label>Period (months)</label><input id="loanPeriod" type="number" min="1" value="12"></div><div><label>Interest Rate</label><input id="loanRate" type="number" step="0.01" value="10"></div><div><label>Guarantor 1 Member ID</label><input id="g1" type="number"></div><div><label>Guarantor 2 Member ID</label><input id="g2" type="number"></div></div><div class="flow" style="margin-top:14px"><div class="flow-step">1. Applicant approval</div><div class="flow-arrow">▼</div><div class="flow-step">2. Guarantor requests → Guarantor 1 / Guarantor 2 → Accept / Reject</div><div class="flow-arrow">▼</div><div class="flow-step">3. Loan Approvals → Secretary / Treasurer / Chairman</div><div class="flow-arrow">▼</div><div class="flow-step"><b>4. Final Approval</b></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveLoan()">Submit Application</button></div>`)}
async function loanApplications(){toggleSide();const q=await supabaseClient.from(DB.loans).select('*').order('created_at',{ascending:false});if(dbErr(q.error))return;const rows=q.data||[];const gs=rows.length?await supabaseClient.from(DB.guarantors).select('application_id'):null;const counts={};(gs?.data||[]).forEach(x=>counts[x.application_id]=(counts[x.application_id]||0)+1);$('main').innerHTML=`<div class="card"><h2>Loan Application</h2><p class="muted">Applicant approval → Guarantor requests → Secretary/Treasurer/Chairman → Final Approval</p><button class="btn p" onclick="newLoan()">＋ New Loan Application</button></div><div class="card table-wrap"><table><thead><tr><th>Application</th><th>Applicant</th><th>Amount</th><th>Status</th><th>Guarantors</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(l=>`<tr><td>${esc(l.application_no||l.id)}</td><td>${esc(l.member_id||'')}</td><td>KSh ${money(l.amount)}</td><td><span class="badge ${l.status==='Approved'?'ok':l.status==='Rejected'?'no':'pending'}">${esc(l.status||'Pending')}</span></td><td>${counts[l.id]||0}</td><td><button class="btn l" onclick="viewLoan(${l.id})">View Workflow</button></td></tr>`).join(''):`<tr><td colspan="6">No loan applications found.</td></tr>`}</tbody></table></div>`}
async function saveLoan(){if(!currentMember?.id)return notify('No database member is linked to this login');const amt=Number($('loanAmt').value||0);if(amt<=0)return notify('Enter loan amount');const appNo='LA-'+Date.now();const q=await supabaseClient.from(DB.loans).insert({application_no:appNo,member_id:currentMember.id,amount:amt,purpose:$('loanPurpose').value.trim(),period_months:Number($('loanPeriod').value||12),interest_rate:Number($('loanRate').value||0),application_date:today(),status:'Applicant Pending',loan_type:'Normal'}).select().single();if(dbErr(q.error))return;const l=q.data;const g1=Number($('g1').value||0),g2=Number($('g2').value||0);const gs=[g1,g2].filter(x=>x>0).map((member,i)=>({application_id:l.id,guarantor_member_id:member,requested_date:today(),status:'Pending'}));if(gs.length){const gq=await supabaseClient.from(DB.guarantors).insert(gs);if(dbErr(gq.error))return}const aq=await supabaseClient.from(DB.approvals).insert({application_id:l.id,applicant_approved:false,secretary_approved:false,treasurer_approved:false,chairman_approved:false,final_status:'Pending'}).select().single();if(dbErr(aq.error))return;closem();loanApplications();await addAudit('CREATE','Loan application '+appNo,'Loan Application',l.id);notify('Loan application saved to Supabase')}
async function viewLoan(id){const lq=await supabaseClient.from(DB.loans).select('*').eq('id',id).single();if(dbErr(lq.error))return;const gq=await supabaseClient.from(DB.guarantors).select('*').eq('application_id',id);if(dbErr(gq.error))return;const aq=await supabaseClient.from(DB.approvals).select('*').eq('application_id',id).maybeSingle();if(dbErr(aq.error))return;const a=aq.data||{};modal(`<div class="stmt-header">LOAN APPLICATION WORKFLOW</div><div class="topup-body"><div class="flow"><div class="flow-step"><b>Applicant approval</b><br>Applicant member ID: ${esc(lq.data.member_id)}<br>Amount: KSh ${money(lq.data.amount)}<br>Status: ${esc(lq.data.status||'Pending')}<br><button class="btn s" onclick="applicantDecision(${id},true)">Approve Applicant</button><button class="btn d" onclick="applicantDecision(${id},false)">Reject Applicant</button></div><div class="flow-arrow">▼</div><div class="flow-step"><b>Guarantor requests</b>${(gq.data||[]).map(g=>`<div class="card"><b>Guarantor</b> ${esc(g.guarantor_member_id)}<br>Status: <span class="badge ${g.status==='Accepted'?'ok':g.status==='Rejected'?'no':'pending'}">${esc(g.status||'Pending')}</span><div class="actions"><button class="btn s" onclick="guarantorDecision(${g.id},'Accepted',${id})">Accept</button><button class="btn d" onclick="guarantorDecision(${g.id},'Rejected',${id})">Reject</button></div></div>`).join('')||'<small>No guarantor requests.</small>'}</div><div class="flow-arrow">▼</div><div class="flow-step"><b>Loan Approvals</b><div class="approval-grid">${['Secretary','Treasurer','Chairman'].map(r=>{const key=r.toLowerCase()+'_approved';return `<div class="card"><b>${r}</b><br><span class="badge ${a[key]?'ok':'pending'}">${a[key]?'Approved':'Pending'}</span><br><button class="btn s" onclick="approveLoan(${id},'${r}',true)">Approve</button><button class="btn d" onclick="approveLoan(${id},'${r}',false)">Reject</button></div>`}).join('')}</div></div><div class="flow-arrow">▼</div><div class="flow-step"><b>Final Approval</b><br><span class="badge">${esc(a.final_status||'Pending')}</span><br><button class="btn p" onclick="finalApprove(${id})">Final Approval / Disburse</button></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button></div>`)}
async function applicantDecision(id,approved){const q=await supabaseClient.from(DB.approvals).update({applicant_approved:approved,applicant_date:new Date().toISOString(),applicant_comment:approved?'Approved':'Rejected'}).eq('application_id',id).select().single();if(dbErr(q.error))return;const l=await supabaseClient.from(DB.loans).update({status:approved?'Guarantors Pending':'Rejected'}).eq('id',id);if(dbErr(l.error))return;viewLoan(id)}
async function guarantorDecision(id,status,loan){const q=await supabaseClient.from(DB.guarantors).update({status,response_date:today(),comment:status}).eq('id',id).select().single();if(dbErr(q.error))return;viewLoan(loan)}
async function approveLoan(applicationId,role,approved){const field=role.toLowerCase()+'_approved';const patch={[field]:approved,[role.toLowerCase()+'_date']:new Date().toISOString(),[role.toLowerCase()+'_comment']:approved?'Approved':'Rejected'};const q=await supabaseClient.from(DB.approvals).update(patch).eq('application_id',applicationId).select().single();if(dbErr(q.error))return;viewLoan(applicationId)}
async function finalApprove(id){const a=await supabaseClient.from(DB.approvals).select('*').eq('application_id',id).maybeSingle();if(dbErr(a.error))return;if(!a.data?.applicant_approved||!a.data.secretary_approved||!a.data.treasurer_approved||!a.data.chairman_approved)return notify('Applicant, Secretary, Treasurer and Chairman must approve first');const gs=await supabaseClient.from(DB.guarantors).select('*').eq('application_id',id);if(dbErr(gs.error))return;if((gs.data||[]).some(g=>g.status!=='Accepted'))return notify('All guarantors must accept first');const q=await supabaseClient.from(DB.approvals).update({final_status:'Approved',updated_at:new Date().toISOString()}).eq('application_id',id).select().single();if(dbErr(q.error))return;const l=await supabaseClient.from(DB.loans).update({status:'Approved'}).eq('id',id);if(dbErr(l.error))return;closem();loanApplications();await addAudit('UPDATE','Final loan approval completed','Loan Application',id);notify('Final approval completed')}

settingTab=0;
function settings(){toggleSide();renderSettings()}
async function renderSettings(){const q=await supabaseClient.from(DB.settings).select('*').order('setting_key');settingsCache={};(q.data||[]).forEach(x=>settingsCache[x.setting_key]=x.setting_value);$('main').innerHTML=`<div class="card"><h2>Settings - 15 Modules ACTIVE</h2><div class="settings-tabs">${settingNames.map((n,i)=>`<button class="settings-tab ${i===settingTab?'active':''}" onclick="settingTab=${i};renderSettings()">${i+1}. ${n}</button>`).join('')}</div>${settingContent()}</div>`}
function settingContent(){if(settingTab===1)return `<h3>28 Themes</h3><div class="theme-grid">${['#7a1010','#1E5631','#2e6b28','#8B1E22','#1f4e79','#5b2c83','#37474f','#6d4c41','#455a64','#00695c','#ad1457','#283593','#4e342e','#1565c0','#00838f','#558b2f','#9e9d24','#ef6c00','#c62828','#4527a0','#0277bd','#2e7d32','#6a1b9a','#bf360c','#37474f','#795548','#263238','#000000'].map((c,i)=>`<div class="theme-box" style="background:${c}" onclick="applyTheme('${c}')">Theme ${i+1}</div>`).join('')}</div>`;if(settingTab===2)return `<h3>Roles</h3><div class="grid4">${['Member','Manager','Secretary','Treasurer','Chairman','Admin'].map(r=>`<div class="card"><b>${r}</b><p class="muted">${esc((settingsCache['role_'+r]||'Role-based module access'))}</p></div>`).join('')}</div>`;if(settingTab===3)return `<h3>Permissions Matrix</h3><div class="table-wrap"><table><thead><tr><th>Module</th><th>Member</th><th>Manager</th><th>Secretary</th><th>Treasurer</th><th>Chairman</th><th>Admin</th></tr></thead><tbody>${['Home','Financials','Members','Documents','Projects','Loan Application','Loan Approvals','Reports','Settings','Database Manager','Button Manager'].map(x=>`<tr><td>${x}</td>${['Member','Manager','Secretary','Treasurer','Chairman','Admin'].map(r=>{const k=r+'|'+x;return `<td><input type="checkbox" ${settingsCache[k]==='true'?'checked':''} onchange="savePermission('${esc(r)}','${esc(x)}',this.checked)"></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;if(settingTab===5)return `<h3>Audit Log</h3><button class="btn s" onclick="loadAudit()">Refresh Audit Log</button><div id="auditArea"></div>`;if(settingTab===6)return `<h3>Dev Backup JSON</h3><button class="btn p" onclick="backupJSON()">Download Current Configuration</button>`;if(settingTab===7)return settingKV('mpesa_paybill','Mpesa Paybill');if(settingTab===8)return settingKV('interest_rates','Interest Rates');if(settingTab===14)return `<h3>About</h3><p><b>ZIMELE – THE KAUDHA ALUMNI FRATERNITY</b></p><p class="muted">Live Supabase-connected MIS.</p>`;const k='module_'+settingNames[settingTab].replaceAll(' ','_');return `<h3>${settingNames[settingTab]}</h3><div class="row"><div><label>Setting Key</label><input id="setKey" value="${esc(k)}"></div><div><label>Value</label><input id="setValue" value="${esc(settingsCache[k]||'')}"></div></div><button class="btn p" onclick="saveSetting()">Save Setting</button>`}
function settingKV(k,label){return `<h3>${label}</h3><div class="row"><div><label>Setting Key</label><input id="setKey" value="${esc(k)}"></div><div><label>Value</label><input id="setValue" value="${esc(settingsCache[k]||'')}"></div></div><button class="btn p" onclick="saveSetting()">Save Setting</button>`}
async function saveSetting(){const key=$('setKey').value.trim(),value=$('setValue').value;if(!key)return notify('Setting key required');const q=await supabaseClient.from(DB.settings).upsert({setting_key:key,setting_value:value,description:'ZIMELE application setting',updated_at:new Date().toISOString()},{onConflict:'setting_key'}).select().single();if(dbErr(q.error))return;notify('Setting saved to Supabase');renderSettings()}
async function savePermission(role,module,allowed){const key=role+'|'+module;const q=await supabaseClient.from(DB.permissions).upsert({role,module,allowed,updated_at:new Date().toISOString()},{onConflict:'role,module'});if(dbErr(q.error))return;notify('Permission saved')}
async function loadAudit(){const q=await supabaseClient.from(DB.audit).select('*').order('created_at',{ascending:false}).limit(100);if(dbErr(q.error))return;$('auditArea').innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Action</th><th>Module</th><th>Description</th></tr></thead><tbody>'+((q.data||[]).map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.module)}</td><td>${esc(x.description)}</td></tr>`).join('')||'<tr><td colspan="4">No audit records.</td></tr>')+'</tbody></table></div>'}
function backupJSON(){downloadBlob(JSON.stringify({project:'ZIMELE',user:currentUser?.email,member:currentMember,account:currentAccount,goals,settings:settingsCache},null,2),'zimele-backup.json','application/json')}
function applyTheme(c){document.documentElement.style.setProperty('--maroon',c);notify('Theme applied')}

function openProfile(){modal(`<div class="stmt-header">PROFILE</div><div class="topup-body"><div class="profile-avatar">👤</div><div class="row"><div><label>Name</label><input id="prName" value="${esc(currentMember?.full_name)}"></div><div><label>Phone</label><input id="prPhone" value="${esc(currentMember?.phone)}"></div><div><label>Email</label><input id="prEmail" value="${esc(currentMember?.email||currentUser?.email)}"></div><div><label>Member No</label><input disabled value="${esc(currentMember?.member_no)}"></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button><button class="btn p" onclick="saveProfile()">Save</button></div>`)}
async function saveProfile(){if(!currentMember?.id)return notify('No database member linked');const p={full_name:$('prName').value.trim(),phone:$('prPhone').value.trim(),email:$('prEmail').value.trim()};const q=await supabaseClient.from(DB.members).update(p).eq('id',currentMember.id).select().single();if(dbErr(q.error))return;currentMember={...currentMember,...q.data};setRoleUI();closem();await addAudit('UPDATE','Member profile updated','Profile',currentMember.id);notify('Profile updated in Supabase')}

/* Correct Financials page helpers retained from the original UI. */
function financials(){toggleSide();$('main').innerHTML=`<div class="statements-title">FINANCIALS</div><div class="grid4"><div class="action" onclick="statements()">📄<h3>Statements</h3></div><div class="action" onclick="depositForm()">➕<h3>Deposit</h3></div><div class="action" onclick="withdrawForm()">➖<h3>Withdrawals</h3></div><div class="action" onclick="transferForm()">↔️<h3>Transfer</h3></div></div>`}
function depositForm(){topup(currentAccount?.id)}function withdrawForm(){modal(`<div class="stmt-header">WITHDRAWAL</div><div class="topup-body"><div class="topup-field"><label>Amount</label><input id="wdAmount" type="number" min="1"></div><div class="topup-field"><label>Phone / M-Pesa</label><input id="wdPhone" value="${esc(currentMember?.phone||'')}"></div><div class="topup-field"><label>Description</label><textarea id="wdDesc">Member withdrawal</textarea></div><div style="background:#fff3cd;padding:10px;font-size:11px;border-radius:8px">Withdrawal is subject to available balance and Lock-In restrictions.</div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button><button class="btn p" onclick="saveWithdrawal()">M-Pesa / Approve</button></div>`)}
function transferForm(){modal(`<div class="stmt-header">TRANSFER</div><div class="topup-body"><div class="topup-field"><label>Destination Account</label><input id="toAcct"></div><div class="topup-field"><label>Amount</label><input id="trAmt" type="number" min="1"></div><div class="topup-field"><label>Description</label><input id="trDesc" value="Account transfer"></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveTransfer()">Transfer</button></div>`)}

/* Boot: authenticate first, then read the member/account rows from Supabase. */
async function init(){
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session){currentUser=session.user;await loadUser();showApp()}else $('loginWrap').style.display='flex';
  supabaseClient.auth.onAuthStateChange(async(_event,session2)=>{if(session2){currentUser=session2.user;await loadUser();showApp()}else{$('app').style.display='none';$('loginWrap').style.display='flex'}});
}
init();
</script>
