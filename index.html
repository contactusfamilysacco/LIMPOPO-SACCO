<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a1010">
<title>ZIMELE Chama Manager</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --maroon:#7a1010;--forest:#1e5631;--green:#2e6b28;--crimson:#8b1e22;
  --beige:#f6f3e8;--light:#f5f7e8;--border:#d9d2b8;--ink:#182018;
  --white:#fff;--danger:#c0392b;--shadow:0 4px 16px rgba(20,30,20,.08);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef1d6;color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.top{
  height:62px;background:#fdfcf0;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  position:sticky;top:0;z-index:50
}
.brand{display:flex;align-items:center;gap:10px}
.hamb{border:0;background:transparent;font-size:25px;padding:6px;line-height:1}
.logo{background:#9b2c2c;color:#fff;padding:7px 12px;font-weight:900;border-radius:5px}
.logout{border:0;background:transparent;color:var(--danger);font-weight:700}
.app{display:flex;min-height:calc(100vh - 62px)}
.side{
  width:270px;flex:0 0 270px;background:#fdfcf0;border:1.5px solid var(--border);
  border-radius:12px;position:fixed;top:70px;bottom:10px;left:10px;
  overflow:auto;padding:10px;z-index:40;transition:transform .22s ease
}
.main{width:100%;margin-left:290px;padding:16px;min-width:0}
.profile-circle{
  width:140px;height:140px;border-radius:50%;background:#111;color:#fff;
  display:flex;align-items:center;justify-content:center;text-align:center;margin:20px auto;
  font-weight:900;font-size:11px;line-height:1.2;border:4px solid #333;
}
.nav-btn{
  width:100%;display:flex;gap:10px;padding:12px;border:0;background:transparent;
  border-radius:8px;text-align:left;font-size:14px;align-items:center
}
.nav-btn:hover,.nav-btn.active{background:var(--beige)}
.nav-btn.active{color:var(--crimson);font-weight:700}
.nav-btn.dev{background:var(--forest);color:#fff;font-weight:700;margin-top:10px}
.card,.dashboard-main{
  background:#fdfcf0;border:1px solid var(--border);border-radius:12px;padding:18px;
  box-shadow:var(--shadow);margin-bottom:14px
}
.dashboard-main{padding:20px}
.page-title{text-align:center;font-weight:900;font-size:20px;margin:4px 0 18px}
.muted{color:#687068;font-size:12px}
.dash-icons{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0
}
.dash-icon{
  background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;
  text-align:center;cursor:pointer;min-width:0
}
.icon-box{
  width:52px;height:52px;margin:0 auto 8px;border:1.5px solid #9b2c2c;
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#fff
}
.card-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.module-card{
  background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;
  min-width:0;box-shadow:0 2px 8px rgba(0,0,0,.04)
}
.module-card h3{margin:0 0 8px;font-size:15px}
.module-card p{margin:0 0 12px;font-size:12px;color:#666}
.btn{
  border:0;padding:10px 14px;border-radius:9px;font-weight:700;min-height:40px
}
.btn.p{background:var(--maroon);color:#fff}.btn.s{background:var(--forest);color:#fff}
.btn.l{background:#eee;color:#333}.btn.d{background:#c0392b;color:#fff}
.btn.out{background:#fff;border:1.5px solid var(--green);color:var(--green)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:#666;margin-bottom:5px}
input,select,textarea{
  width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fffdf0;
  outline:none
}
input:focus,select:focus,textarea:focus{border-color:var(--forest)}
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;
  justify-content:center;z-index:100;padding:10px
}
.modal.on{display:flex}
.box{
  background:#fff;border-radius:12px;padding:0;width:min(96vw,980px);
  max-height:94vh;overflow:auto
}
.modal-head{padding:14px 16px;background:#f5f5f0;border-bottom:1px solid #ddd;text-align:center}
.modal-body{padding:16px}
.stmt-filters{
  display:grid;grid-template-columns:1fr 1fr auto;gap:14px;padding:14px 16px;
  background:#fff;border-bottom:1px solid #eee;align-items:end
}
.fetch-btn{background:#fff;border:1px solid #ddd;padding:10px 16px;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.table-wrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:680px}
th{background:#1a1a1a;color:#fff;padding:10px 8px;text-align:left;font-size:11px;white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid #e3e6df;font-size:11px;white-space:nowrap}
.summary-box{width:min(100%,360px);margin:14px auto 0;border:1px solid #ddd;border-radius:7px;overflow:hidden}
.sum-head,.sum-row{display:grid;grid-template-columns:1fr 1fr}
.sum-head{background:#1a1a1a;color:#fff;font-size:11px;font-weight:700}
.sum-head div,.sum-row div{padding:9px;text-align:right}.sum-head div:first-child,.sum-row div:first-child{text-align:left}
.sum-row{border-bottom:1px solid #eee;font-size:11px}.sum-row div:first-child{background:#f9f9f9}
.status{display:inline-block;padding:5px 10px;border-radius:20px;font-weight:700;font-size:10px}
.status.credit{background:#d6f3df;color:#17652a}.status.arrears{background:#ffd9df;color:#b11d2a}
.statement-card{
  border:1.5px solid #9b2c2c;border-radius:14px;padding:20px 16px;background:#fdfcf0;
  max-width:540px;margin:0 auto 18px;text-align:center
}
.btns-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:18px}
.balance-badge{background:#d5e8d4;border:1px solid #2e6b28;padding:8px 14px;border-radius:6px;color:#1b4d1b;font-weight:700;font-size:13px}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:18px}
.login-card{width:min(440px,100%);background:#fdfcf0;border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
.login-logo{background:#9b2c2c;color:#fff;font-weight:900;font-size:22px;padding:10px 16px;width:max-content;margin:0 auto 12px;border-radius:6px}
.error{background:#ffe5e5;color:#a11;padding:9px;border-radius:8px;font-size:12px;margin-bottom:10px}
.success{background:#e2f4e6;color:#17652a;padding:9px;border-radius:8px;font-size:12px;margin-bottom:10px}
.toast{position:fixed;right:16px;bottom:16px;z-index:200;background:#1d2a20;color:#fff;padding:12px 15px;border-radius:10px;font-size:12px;box-shadow:var(--shadow)}
.mobile-backdrop{display:none}
.empty{padding:28px;text-align:center;color:#777;font-size:12px}
.small{font-size:10px}
.kpi{font-size:23px;font-weight:900}
.config-note{font-size:11px;color:#666;background:#f5f3e9;padding:10px;border-radius:8px}
@media(max-width:1100px){
  .card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dash-icons{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .top{height:56px;padding:0 10px}
  .app{min-height:calc(100vh - 56px)}
  .side{
    top:66px;bottom:8px;transform:translateX(-115%);box-shadow:0 8px 30px rgba(0,0,0,.2)
  }
  .side.open{transform:translateX(0)}
  .mobile-backdrop{position:fixed;inset:56px 0 0;background:rgba(0,0,0,.25);z-index:35}
  .mobile-backdrop.on{display:block}
  .main{margin-left:0;padding:10px}
  .dashboard-main,.card{padding:13px}
  .card-grid{grid-template-columns:1fr}
  .dash-icons{grid-template-columns:1fr}
  .stmt-filters{grid-template-columns:1fr}
  .fetch-btn{width:100%}
  .statement-card{padding:15px 12px}
  .btns-grid{grid-template-columns:1fr 1fr}
  .box{width:100%;max-height:96vh}
  .actions .btn{flex:1 1 120px}
  .logo{font-size:13px;padding:6px 9px}
}
@media(max-width:420px){
  .btns-grid{grid-template-columns:1fr}
  .page-title{font-size:17px}
  .top .logout{font-size:12px}
}
</style>
</head>
<body>
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🐃 ZIMELE</div>
    <h2 style="text-align:center;margin:4px 0">Chama Manager</h2>
    <p class="muted" style="text-align:center">Supabase-connected responsive website</p>
    <div id="authMsg"></div>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div>
      <div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div>
      <button class="btn p" style="width:100%" type="submit">Sign In</button>
    </form>
    <div style="height:8px"></div>
    <button class="btn out" style="width:100%" onclick="signUp()">Create Account</button>
    <button class="btn l" style="width:100%;margin-top:8px" onclick="resetPassword()">Reset Password</button>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="brand">
      <button class="hamb" aria-label="Open menu" onclick="toggleMenu()">☰</button>
      <div class="logo">🐃 ZIMELE</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="userLabel" class="small"></span>
      <button class="logout" onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="app">
    <aside class="side" id="sidebar">
      <div class="profile-circle">FAMILY DEVELOPMENT<br>GROUP<br><span class="small">ZIMELE</span></div>
      <button class="nav-btn active" data-nav="home" onclick="home()">🏛️ Home</button>
      <button class="nav-btn" data-nav="members" onclick="members()">👥 Members</button>
      <button class="nav-btn" data-nav="financials" onclick="financials()">📁 Financials</button>
      <button class="nav-btn" data-nav="statements" onclick="statements()">📑 Statements</button>
      <button class="nav-btn" data-nav="projects" onclick="projects()">💡 Projects</button>
      <button class="nav-btn" data-nav="docs" onclick="docs()">📄 Documents</button>
      <button class="nav-btn" data-nav="loan" onclick="loanApplication()">💳 Loan Application</button>
      <button class="nav-btn dev" data-nav="settings" onclick="settings()">⚙️ Settings</button>
    </aside>
    <div id="backdrop" class="mobile-backdrop" onclick="toggleMenu(false)"></div>
    <main class="main" id="main"></main>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closem()">
  <div class="box" id="box"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL = "https://lodjqbszdrpimldtdfev.supabase.co";
const SUPABASE_KEY = "sb_publishable_ewOzpBWF_G6MPhceYJKWNA_NYZkMcYR";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
let currentProfile = null;
let accounts = [];
let summaries = [];

const money = n => Number(n||0).toLocaleString("en-KE",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),3000)}
function modalHTML(h){document.getElementById("box").innerHTML=h;document.getElementById("modal").classList.add("on")}
function closem(){document.getElementById("modal").classList.remove("on")}
function toggleMenu(force){const side=document.getElementById("sidebar"),back=document.getElementById("backdrop");const open=force===undefined?!side.classList.contains("open"):force;side.classList.toggle("open",open);back.classList.toggle("on",open)}
function closeMenu(){if(innerWidth<=760)toggleMenu(false)}
function navActive(name){document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.nav===name))}
function setMain(html,name){document.getElementById("main").innerHTML=html;navActive(name);closeMenu()}
function authMsg(text,type="error"){document.getElementById("authMsg").innerHTML=text?`<div class="${type}">${esc(text)}</div>`:""}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){await enterApp(session.user)}
  else showLogin();
  sb.auth.onAuthStateChange(async (_event,session)=>{
    if(session) await enterApp(session.user); else showLogin();
  });
}
function showLogin(){currentUser=null;currentProfile=null;document.getElementById("app").classList.add("hidden");document.getElementById("loginScreen").classList.remove("hidden")}
async function enterApp(user){
  currentUser=user;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userLabel").textContent=user.email||"Signed in";
  await loadProfile();
  await loadCoreData();
  home();
}
async function loadProfile(){
  const {data}=await sb.from("profiles").select("full_name,role,status,member_id").eq("id",currentUser.id).maybeSingle();
  currentProfile=data||null;
}
async function loadCoreData(){
  const a=await sb.from("zimele_accounts").select("*").order("created_at",{ascending:true});
  if(a.error) console.error(a.error); else accounts=a.data||[];
  const s=await sb.from("zimele_member_summary").select("*").order("id",{ascending:true});
  if(s.error) console.error(s.error); else summaries=s.data||[];
}
async function login(e){
  e.preventDefault();authMsg("Signing in…","success");
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error)authMsg(error.message,"error");else authMsg("");
}
async function signUp(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  if(!email||password.length<6){authMsg("Enter an email and a password of at least 6 characters.");return}
  const {data,error}=await sb.auth.signUp({email,password});
  if(error){authMsg(error.message);return}
  if(data.user && data.session){
    await sb.from("profiles").upsert({id:data.user.id,full_name:email.split("@")[0],email,role:"Member",status:"Active"});
    authMsg("Account created.","success");
  }else authMsg("Account created. Check your email to confirm the account.","success");
}
async function resetPassword(){
  const email=document.getElementById("email").value.trim();
  if(!email){authMsg("Enter your email first.");return}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
  authMsg(error?error.message:"Password reset email sent.","success");
}
async function logout(){await sb.auth.signOut()}

function home(){
  setMain(`
  <section class="dashboard-main">
    <div style="text-align:center">
      <div style="font-weight:800;font-size:18px;margin-bottom:10px">ZIMELE CHAMA MANAGER</div>
      <div class="muted">Responsive on laptop, tablet and phone.</div>
    </div>
    <div class="dash-icons">
      <div class="dash-icon" onclick="statements()"><div class="icon-box">📑</div><b>Statements</b><div class="small">${accounts.length} account(s)</div></div>
      <div class="dash-icon" onclick="deposit()"><div class="icon-box">🐖</div><b>Deposit</b><div class="small">Top up an account</div></div>
      <div class="dash-icon" onclick="withdrawals()"><div class="icon-box">💵</div><b>Withdrawals</b><div class="small">Account withdrawals</div></div>
      <div class="dash-icon" onclick="members()"><div class="icon-box">👥</div><b>Members</b><div class="small">${summaries.length} summary row(s)</div></div>
    </div>
    <div class="card-grid">
      <div class="module-card"><h3>Accounts</h3><div class="kpi">${accounts.length}</div><p>Connected ZIMELE accounts.</p><button class="btn out" onclick="statements()">Open Statements</button></div>
      <div class="module-card"><h3>Member Summary</h3><div class="kpi">${summaries.length}</div><p>Live rows loaded from Supabase.</p><button class="btn out" onclick="members()">View Members</button></div>
      <div class="module-card"><h3>Loan Application</h3><div class="kpi">→</div><p>Applicant, guarantors and approvals.</p><button class="btn out" onclick="loanApplication()">Open</button></div>
      <div class="module-card"><h3>Connection</h3><div class="kpi">✓</div><p>Supabase database and Auth are connected.</p><span class="status credit">ONLINE</span></div>
    </div>
  </section>`);
}

function financials(){
  setMain(`<section class="dashboard-main"><div class="page-title">Financials</div>
    <div class="card-grid">
      <div class="module-card"><h3>📑 Statements</h3><p>Account and member statements.</p><button class="btn out" onclick="statements()">Open</button></div>
      <div class="module-card"><h3>🐖 Deposit</h3><p>Create a real account transaction in Supabase.</p><button class="btn out" onclick="deposit()">Open</button></div>
      <div class="module-card"><h3>💸 Withdrawals</h3><p>Record and view withdrawals.</p><button class="btn out" onclick="withdrawals()">Open</button></div>
      <div class="module-card"><h3>🔒 Lock-In</h3><p>Account lock status is stored with the account.</p><button class="btn out" onclick="statements()">Manage from account</button></div>
    </div></section>`);
}

function statements(){
  const main = accounts.map(a=>statementCard(a)).join("");
  setMain(`<section><div class="page-title">FAMILY DEVELOPMENT GROUP Accounts</div>
    ${main||'<div class="card empty">No ZIMELE accounts have been created yet.</div>'}
    <div style="text-align:center;margin:15px"><button class="btn p" onclick="addG()">+ Add Goal Account</button></div>
  </section>`,"statements");
}
function statementCard(a){
  const locked=a.locked_until && new Date(a.locked_until)>=new Date();
  return `<div class="statement-card">
    <div style="font-size:30px">📊</div>
    <div style="font-size:13px">A/C Type: <b>Fixed Income Fund (Savings Plan)</b></div>
    <div style="font-size:13px">Member: <b>${esc(a.member_name)}</b></div>
    <div style="font-size:13px">A/C Number: <b>${esc(a.account_no)}</b></div>
    <div style="font-size:13px">Goal: <b>${esc(a.goal_name)}</b></div>
    <div style="font-size:13px">Balance: <b>KES ${money(a.balance)}</b></div>
    <div style="font-size:13px">Target Amount: <b>${a.target_amount?money(a.target_amount):"(Optional)"}</b></div>
    <div style="font-size:13px">Target Period: <b>${esc(a.target_period||"(Optional)")}</b></div>
    ${locked?`<div class="status arrears">🔒 Locked until ${esc(a.locked_until)}</div>`:""}
    <div class="btns-grid">
      <button class="btn out" onclick="openC(${a.id})">Chama Statement</button>
      <button class="btn out" onclick="openB(${a.id})">Member Statement</button>
      <button class="btn out" onclick="topup(${a.id})">Top Up</button>
      <button class="btn out" onclick="openA(${a.id})">Annual Report</button>
      <button class="btn out" onclick="openR(${a.id})">Reminders</button>
      <button class="btn out" onclick="openL(${a.id})">${locked?"🔒 Lock-In Active":"Lock-In"}</button>
    </div>
  </div>`;
}
function addG(){
  modalHTML(`<div class="modal-head"><b>Add Goal Account</b></div><div class="modal-body">
    <div class="field"><label>Member Name</label><input id="gMember" placeholder="Member name" required></div>
    <div class="field"><label>Goal</label><input id="gName" placeholder="GREEN ARROW LOAN 29,000" required></div>
    <div class="field"><label>Opening Balance</label><input id="gBal" type="number" min="0" value="0"></div>
    <div class="field"><label>Target Amount</label><input id="gTarget" type="number" min="0"></div>
    <div class="field"><label>Target Period</label><input id="gPeriod" placeholder="12 Months"></div>
    <div class="actions"><button class="btn l" onclick="closem()">Cancel</button><button class="btn s" onclick="saveGoal()">Create Account</button></div>
  </div>`);
}
async function saveGoal(){
  const member=document.getElementById("gMember").value.trim(),name=document.getElementById("gName").value.trim();
  if(!member||!name)return toast("Member and goal are required.");
  const {data:latest}=await sb.from("zimele_accounts").select("account_no").order("created_at",{ascending:false}).limit(1);
  const accountNo="00001-0001-"+Date.now()+"-002";
  const payload={account_no:accountNo,member_name:member,goal_name:name.toUpperCase(),balance:Number(document.getElementById("gBal").value||0),target_amount:Number(document.getElementById("gTarget").value||0)||null,target_period:document.getElementById("gPeriod").value.trim()||null};
  const {error}=await sb.from("zimele_accounts").insert(payload);
  if(error){toast(error.message);return}
  closem();await loadCoreData();statements();toast("Goal account created in Supabase.");
}
async function openC(id){
  const a=accounts.find(x=>x.id===id);if(!a)return;
  const {data,error}=await sb.from("zimele_transactions").select("*").eq("account_id",id).order("transaction_date",{ascending:true});
  if(error){toast(error.message);return}
  const rows=data||[], dep=rows.reduce((s,x)=>s+Number(x.deposit||0),0), wd=rows.reduce((s,x)=>s+Number(x.withdrawal||0),0), interest=rows.reduce((s,x)=>s+Number(x.interest||0),0);
  modalHTML(`<div class="modal-head"><b>Brief Account Statement - Chama Statement</b><div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(a.account_no)}</b><span>${new Date().toLocaleDateString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</span></div></div>
    <div class="stmt-filters"><div class="field"><label>From</label><input id="cf" type="date" value="2025-09-07"></div><div class="field"><label>To</label><input id="ct" type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="fetch-btn" onclick="openC(${id})">Fetch</button></div>

  <div class="stmt-filters"><div class="field"><label>From</label><input type="date" value="2025-09-07"></div><div class="field"><label>To</label><input type="date" value="${new Date().toISOString().slice(0,10)}"></div><button class="fetch-btn" onclick="openB(${id})">Fetch</button></div>

  ${rows.map(x=>`<tr><td>${esc(x.transaction_date)}</td><td>${esc(x.description)}</td><td>${x.deposit?money(x.deposit):""}</td><td>${x.withdrawal?money(x.withdrawal):""}</td></tr>`).join("")||`<tr><td colspan="4" class="empty">No transactions recorded yet.</td></tr>`}
  </table></div>
  <div class="summary-box"><div class="sum-head"><div>Summary</div><div>Totals</div></div><div class="sum-row"><div>Total Deposits</div><div>${money(dep)}</div></div><div class="sum-row"><div>Total Withdrawals</div><div>${money(wd)}</div></div></div>
  <div class="actions" style="justify-content:center;padding:14px"><button class="btn l" onclick="closem()">Close</button><button class="btn out" onclick="topup(${id})">Top Up</button><button class="btn out" onclick="downloadCSV(${id},'member')">Download CSV</button></div>`);

function memberStatementByName(){/* selector is retained for future member-specific filtering */}
async function downloadCSV(id,type){
  const {data,error}=await sb.from("zimele_transactions").select("*").eq("account_id",id).order("transaction_date",{ascending:true});
  if(error){toast(error.message);return}
  const header="Date,Description,Deposit,Withdrawal,Interest,Reference\n";
  const body=(data||[]).map(x=>[x.transaction_date,x.description,x.deposit||0,x.withdrawal||0,x.interest||0,x.reference_no||""].map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
  const blob=new Blob([header+body],{type:"text/csv"}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=`${type}-statement-${id}.csv`;a.click();URL.revokeObjectURL(url);
}
function topup(id){
  const a=accounts.find(x=>x.id===id);if(!a)return;
  modalHTML(`<div class="modal-head"><b>Top Up Account</b></div><div class="modal-body">
    <div class="config-note">This records the transaction in Supabase. M-Pesa STK Push still requires your M-Pesa/Daraja server integration; this page does not pretend an STK payment was completed.</div>
    <div class="field"><label>Account Number</label><input value="${esc(a.account_no)}" disabled></div>
    <div class="field"><label>Member</label><input value="${esc(a.member_name)}" disabled></div>
    <div class="field"><label>Amount</label><input id="topAmount" type="number" min="1" step="0.01"></div>
    <div class="field"><label>Description</label><input id="topDesc" value="ZIMELE account top up"></div>
    <div class="field"><label>Reference</label><input id="topRef" placeholder="M-Pesa receipt / reference"></div>
    <div class="actions"><button class="btn l" onclick="closem()">Cancel</button><button class="btn s" onclick="saveTransaction(${id},'deposit')">Record Deposit</button></div>
  </div>`);
}
async function saveTransaction(id,type){
  const amount=Number(document.getElementById("topAmount").value||0);if(amount<=0)return toast("Enter a valid amount.");
  const a=accounts.find(x=>x.id===id);
  const payload={account_id:id,member_id:a.member_id||null,transaction_date:new Date().toISOString().slice(0,10),description:document.getElementById("topDesc").value.trim()||"ZIMELE transaction",deposit:type==="deposit"?amount:0,withdrawal:type==="withdrawal"?amount:0,reference_no:document.getElementById("topRef").value.trim()||null};
  const {error}=await sb.from("zimele_transactions").insert(payload);if(error){toast(error.message);return}
  const newBalance=Number(a.balance||0)+(type==="deposit"?amount:-amount);
  const {error:ue}=await sb.from("zimele_accounts").update({balance:newBalance,updated_at:new Date().toISOString()}).eq("id",id);
  if(ue){toast(ue.message);return}
  closem();await loadCoreData();toast("Transaction saved to Supabase.");statements();
}
function deposit(){if(!accounts.length)return toast("Create a ZIMELE account first.");topup(accounts[0].id)}
function withdrawals(){
  setMain(`<section class="card"><div class="page-title">Withdrawals</div><div class="config-note">Withdrawals are recorded in the same Supabase transaction ledger and reduce the account balance. Locked accounts are shown below.</div>
  <div class="card-grid" style="margin-top:14px">${accounts.map(a=>`<div class="module-card"><h3>${esc(a.member_name)}</h3><p>${esc(a.account_no)}</p><div class="kpi">KES ${money(a.balance)}</div><button class="btn d" style="margin-top:10px" onclick="withdraw(${a.id})">Record Withdrawal</button></div>`).join("")||'<div class="empty">No accounts.</div>'}</div></section>`,"financials");
}
function withdraw(id){
  const a=accounts.find(x=>x.id===id);if(!a)return;
  if(a.locked_until && new Date(a.locked_until)>=new Date())return toast("This account is locked until "+a.locked_until);
  modalHTML(`<div class="modal-head"><b>Record Withdrawal</b></div><div class="modal-body">
    <div class="field"><label>Account</label><input value="${esc(a.account_no)}" disabled></div>
    <div class="field"><label>Amount</label><input id="topAmount" type="number" min="1" step="0.01"></div>
    <div class="field"><label>Description</label><input id="topDesc" value="ZIMELE account withdrawal"></div>
    <div class="field"><label>Reference</label><input id="topRef"></div>
    <div class="actions"><button class="btn l" onclick="closem()">Cancel</button><button class="btn d" onclick="saveTransaction(${id},'withdrawal')">Record Withdrawal</button></div>
  </div>`);
}

async function saveLock(id){
  const until=document.getElementById("lockUntil").value||null,amt=Number(document.getElementById("lockAmt").value||0)||null;
  const {error}=await sb.from("zimele_accounts").update({locked_until:until,locked_amount:amt,updated_at:new Date().toISOString()}).eq("id",id);
  if(error){toast(error.message);return}closem();await loadCoreData();statements();toast("Lock-In saved.");
}

    <tr><th colspan="3">TOTAL</th><th>${money(totals.z)}</th><th>${money(totals.m)}</th><th>${money(totals.a)}</th><th></th></tr></table></div>
  </section>`,"members");
}

async function loadLoans(){
  const el=document.getElementById("loanList");if(!el)return;

  if(error){el.innerHTML=`<div class="empty">${esc(error.message)}</div>`;return}

function newLoan(){
  modalHTML(`<div class="modal-head"><b>Loan Application</b></div><div class="modal-body">
    <div class="field"><label>Member ID</label><input id="loanMember" type="number" required></div>
    <div class="field"><label>Amount</label><input id="loanAmount" type="number" min="1" required></div>
    <div class="field"><label>Purpose</label><textarea id="loanPurpose"></textarea></div>
    <div class="field"><label>Period (months)</label><input id="loanPeriod" type="number" min="1" value="12"></div>

async function saveLoan(){
  const member=Number(document.getElementById("loanMember").value),amount=Number(document.getElementById("loanAmount").value);
  if(!member||amount<=0)return toast("Enter member ID and amount.");
  const appNo="LA-"+Date.now();
  const {data,error}=await sb.from("loan_applications").insert({application_no:appNo,member_id:member,amount,purpose:document.getElementById("loanPurpose").value,period_months:Number(document.getElementById("loanPeriod").value||12)}).select().single();
  if(error){toast(error.message);return}
  await sb.from("loan_approvals").insert({application_id:data.id});
  closem();loanApplication();toast("Loan application saved and approval record created.");
}
