<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--maroon:#7a1010;--forest:#1E5631;--border:#d9d2b8;--green:#2e6b28;--crimson:#8B1E22}
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f0f0e0}

.nav-btn{width:100%;display:flex;gap:10px;padding:11px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:left;font-size:13px;align-items:center}
.nav-btn:hover{background:#f6f3e8}.nav-btn.dev{background:var(--forest);color:#fff;font-weight:700;margin-top:10px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(120deg,var(--maroon),#a11a1a);color:#fff;border-radius:16px;padding:22px}
.btn{border:0;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.btn.p{background:var(--maroon);color:#fff}.btn.s{background:var(--forest);color:#fff}.btn.l{background:#eee;color:#333}.btn.d{background:#c0392b;color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.action{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;text-align:center;cursor:pointer}
.arrears-card{background:linear-gradient(135deg,#ffebee,#ffcdd2);border:2px solid #c0392b!important}
.action.member-credit{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border:2px solid #2e6b28!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:10px}.modal.on{display:flex}.box{background:#fff;border-radius:12px;padding:16px;width:min(96%,980px);max-height:92vh;overflow:auto}
table{width:100%;border-collapse:collapse}th{background:#1a1a1a;color:#fff;padding:10px 8px;text-align:left;font-size:11px}td{padding:10px 8px;border-bottom:1px solid #eee;font-size:11px}
input,select,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;background:#fffdf0;font-size:12px;margin-top:6px}
.statement-card{border:1.5px solid #9b2c2c;border-radius:14px;padding:20px 16px;background:#fdfcf0;max-width:520px;margin:0 auto 20px;text-align:center}
.btns-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.btn-outline{border:1.5px solid var(--green);background:#fff;color:var(--green);padding:10px 8px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.status-arrears{background:#f8c6d0;color:#a00;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block}
.status-credit{background:#b8e6c6;color:#0a5a2a;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700;display:inline-block}
.login-wrap{position:fixed;inset:0;background:#f5f5f0;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}

</style></head><body>

<div class="login-wrap" id="loginWrap">
<div class="login-box">
<div style="background:var(--crimson);color:#fff;padding:10px 16px;font-weight:900;text-align:center;border-radius:8px;margin-bottom:16px">🐃 ZIMELE - NO HARD CODE</div>
<div style="text-align:center;margin-bottom:16px"><b>KAUDHA ALUMNI FRATERNITY</b><br><small id="connStatus" style="color:#666">Loading members LIVE from Supabase...</small></div>

<div style="margin-top:8px"><label style="font-size:11px">Password</label><input id="loginPass" type="password" value="1234"></div>

</div>
</div>
</div>

<div id="app" style="display:none">
<div class="top"><div>🐃 ZIMELE - <span id="liveCount">0 Members LIVE</span> - Supabase ocaxorcezbhhheqaeahu</div><div style="display:flex;gap:8px;align-items:center"><b id="currentRoleLabel">Member</b><span style="cursor:pointer" onclick="doLogout()">Logout</span></div></div>
<div class="side"><div style="text-align:center;padding:10px;border-bottom:1px solid var(--border)"><b id="sideName">-</b><br><span id="sideRoleBadge">-</span></div>
<button class="nav-btn" onclick="home()">🏠 Home - Arrears Card LIVE</button>

<button class="nav-btn dev" onclick="settings()">⚙️ Settings - DYNAMIC</button>
</div>
<div class="main" id="main">Loading...</div>

</div>

<script type="module">
import { createClient } from "@supabase/supabase-js";
const supabase = createClient("https://ocaxorcezbhhheqaeahu.supabase.co", "sb_publishable_jRu8TxoQibjDNmmFuXOV2g_25kfGYGd");
window.supabase = supabase;
window.membersData = []; // REAL DYNAMIC - NO HARD CODE

export async function loadLive(){
  document.getElementById('connStatus').innerText = "Connecting to Supabase...";
  try{
    const { data, error } = await supabase.from('members').select('*').order('membership_number');
    if(error) throw error;
    window.membersData = data.map(d=>({
      id:d.id, name:d.full_name, short:d.full_name.split(' ')[0], phone:d.phone, memberNo:d.membership_number, email:d.email,
      zimele:d.zimele||15460, monthly:d.monthly||17650, arrears:d.arrears??(d.zimele-d.monthly), status:d.status||'Arrears', withdrawal:d.withdrawal||'0.00', role:d.role||'Member', joined:d.created_at?.split('T')[0]
    }));
    document.getElementById('connStatus').innerText = `✅ ${window.membersData.length} members LIVE - NO HARD CODE`;
    document.getElementById('loginMember').innerHTML = window.membersData.map(m=>`<option value="${m.short}">${m.name} - ${m.status} ${m.arrears}</option>`).join('') + '<option value="Admin">Super Admin</option><option value="Manager">Manager</option>';
    document.getElementById('liveCount').innerText = `${window.membersData.length} Members LIVE - NO HARD CODE`;
  }catch(e){
    document.getElementById('connStatus').innerText = "❌ "+e.message+" - Run SQL below";
    document.getElementById('connStatus').style.color="red";
  }
}
window.loadLive = loadLive;
loadLive();
</script>

<script>
let currentUser={}, currentRole='Member';
function modalHTML(h){document.getElementById('box').innerHTML=h;document.getElementById('modal').classList.add('on');}
function closem(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closem();};
function doLogin(){
  let m=document.getElementById('loginMember').value;
  if(!window.membersData.length && m!=='Admin' && m!=='Manager') return alert('Wait - Supabase still loading. If 0 members, run SQL to seed.');
  let md=window.membersData.find(x=>x.short===m);
  if(m==='Admin'){currentUser={name:"Super Admin",memberNo:"ADM001",role:"Admin"};currentRole="Admin";}
  else if(m==='Manager'){currentUser={name:"Manager",memberNo:"MGR001",role:"Manager"};currentRole="Manager";}
  else{currentUser={name:md.name,memberNo:md.memberNo,phone:md.phone,email:md.email,role:"Member",arrears:md.arrears};currentRole="Member";}
  localStorage.setItem('KAUDHA_LOGGED','1'); localStorage.setItem('KAUDHA_USER',JSON.stringify(currentUser)); localStorage.setItem('KAUDHA_ROLE',currentRole); showApp();
}
function doLogout(){localStorage.removeItem('KAUDHA_LOGGED');document.getElementById('app').style.display='none';document.getElementById('loginWrap').style.display='flex';}
function showApp(){document.getElementById('loginWrap').style.display='none';document.getElementById('app').style.display='block';document.getElementById('sideName').innerText=currentUser.name;document.getElementById('currentRoleLabel').innerText=currentRole;document.getElementById('sideRoleBadge').innerText=currentRole;home();}

function home(){
  let my=window.membersData.find(m=>currentUser.name.includes(m.short))||window.membersData[0]||{arrears:-2190,status:"Arrears",name:"No Members Yet"};
  let isCredit=my.arrears>=0;
  document.getElementById('main').innerHTML=`
  <div class="hero"><h2>THE KAUDHA ALUMNI FRATERNITY - REAL DYNAMIC - ${window.membersData.length} Members from Supabase</h2>
  <div style="background:rgba(255,255,255,.14);border-radius:10px;padding:12px;margin-top:10px"><div>00001-0001-000059890-002-2</div><div style="font-weight:900;color:#b8ffb8;font-size:28px">KES 14,395.58 - LIVE DB</div></div>
  <div>Welcome <b>${currentUser.name}</b> - ${window.membersData.length} members NO HARD CODE</div></div>
  <div class="grid4" style="margin-top:14px">
    <div class="action" onclick="members()"><div style="font-size:36px">👥</div><b>${window.membersData.length} Members - DYNAMIC</b><br><small>From Supabase table</small></div>
    <div class="action" onclick="statements()"><div style="font-size:36px">📑</div><b>Statements</b><br><small>6 Buttons ACTIVE</small></div>
    <div class="action"><div style="font-size:36px">💳</div><b>Loan - ACTIVE</b></div>
    <div class="action ${isCredit?'member-credit':'arrears-card'}"><div style="font-size:36px">${isCredit?'💰':'⚠️'}</div><b>Arrears Card LIVE</b><br>KES ${my.arrears?.toLocaleString()||0}<br><span class="${isCredit?'status-credit':'status-arrears'}">${my.status}</span></div>
  </div>`;
}

function statements(){
  let card=`<div class="statement-card"><div>A/C: <b>00001-0001-000059890-002-2</b></div><div>Goal: <b>MONTHLY CONTRIBUTION</b></div><div>Balance: <b>14,395.58</b></div><div class="btns-grid">
  <button class="btn-outline" onclick="openC()">Chama Statement</button>
  <button class="btn-outline" onclick="openB()">Member Statement - ${window.membersData.length} LIVE</button>
  <button class="btn-outline" onclick="topup()">Top Up</button>
  <button class="btn-outline" onclick="openA()">Annual Report</button>
  <button class="btn-outline" onclick="openR()">Reminders</button>
  <button class="btn-outline" onclick="openL()">Lock-In</button></div></div>`;
  document.getElementById('main').innerHTML=`<div style="text-align:center;font-weight:900;font-size:20px;margin:10px 0">FAMILY DEVELOPMENT GROUP - ${window.membersData.length} LIVE</div>${card}<div style="text-align:center"><button class="btn l" onclick="home()">Home</button></div>`;
}
function openB(){
  let rows=window.membersData.map((m,i)=>`<tr><td>${i+1}</td><td>${m.short}</td><td>0.00</td><td>${m.withdrawal}</td><td>${m.zimele.toLocaleString()}</td><td>${m.monthly.toLocaleString()}</td><td style="color:${m.arrears<0?'#d00':'#0a5a2a'};font-weight:700">${m.arrears.toLocaleString()}</td><td><span class="${m.status==='Credit'?'status-credit':'status-arrears'}">${m.status}</span></td></tr>`).join('');
  modalHTML(`<div><div style="font-weight:900;text-align:center">Member Statement - LIVE ${window.membersData.length} Members - NO HARD CODE</div><div style="overflow:auto;max-height:50vh"><table><tr><th>No</th><th>Member</th><th>Deposit</th><th>Withdrawal</th><th>Zimele</th><th>Monthly</th><th>Arrears</th><th>Status</th></tr>${rows||'<tr><td colspan=8>No members in Supabase - Add from Members page</td></tr>'}</table></div><div style="text-align:center;padding:10px"><button class="btn l" onclick="closem()">Close</button></div></div>`);
}
function openC(){modalHTML(`<div style="padding:16px"><h3>Chama Statement - LIVE ${window.membersData.length} members</h3><table><tr><th>Date</th><th>Description</th><th>Deposit</th></tr>${window.membersData.map(m=>`<tr><td>2025-09-07</td><td>M-pesa: ${m.phone}, ${m.name}</td><td>${m.zimele.toLocaleString()}</td></tr>`).join('')}</table><button class="btn l" onclick="closem()">Close</button></div>`);}
function topup(){modalHTML(`<div style="padding:16px"><h3>Top Up With Mpesa</h3><p>Paybill 501101 - LIVE ${window.membersData.length} members</p><input placeholder="2547..."><input placeholder="Amount" style="margin-top:6px"><button class="btn p" style="width:100%;margin-top:8px" onclick="alert('STK Push LIVE')">Top Up</button><button class="btn l" style="width:100%;margin-top:6px" onclick="closem()">Close</button></div>`);}
function openA(){modalHTML(`<div style="padding:16px;text-align:center"><h3>Annual Report FY 2025 - LIVE ${window.membersData.length} members</h3><button class="btn l" onclick="closem()">Close</button></div>`);}
function openR(){modalHTML(`<div style="padding:16px"><h3>Reminders - LIVE</h3><button class="btn l" onclick="closem()">Close</button></div>`);}
function openL(){modalHTML(`<div style="padding:16px"><h3>Lock-In - LIVE</h3><button class="btn l" onclick="closem()">Close</button></div>`);}

function members(){
  let rows=window.membersData.map((m,i)=>`<tr><td>${i+1}</td><td><b>${m.name}</b><br><small>${m.memberNo} | ${m.role}</small></td><td>${m.phone}<br><small>${m.email}</small></td><td style="text-align:right">${m.zimele.toLocaleString()}<br><small>Monthly: ${m.monthly.toLocaleString()}</small></td><td style="text-align:right;color:${m.arrears<0?'#c0392b':'#2e6b28'};font-weight:700">${m.arrears.toLocaleString()}<br><span class="${m.status==='Credit'?'status-credit':'status-arrears'}">${m.status}</span></td><td><button class="btn p" style="padding:4px 6px;font-size:9px" onclick="editMember(${i})">Edit</button> <button class="btn d" style="padding:4px 6px;font-size:9px" onclick="deleteMember(${i})">Del</button></td></tr>`).join('');
  document.getElementById('main').innerHTML=`<div class="card"><h2>👥 Members - REAL DYNAMIC - ${window.membersData.length} from Supabase - NO HARD CODE - ocaxorcezbhhheqaeahu</h2><div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn s" onclick="addMember()">+ Add Member to Supabase LIVE</button><button class="btn p" onclick="window.loadLive()">🔄 Reload LIVE</button></div><div style="overflow:auto"><table><tr><th>No</th><th>Member - LIVE</th><th>Phone</th><th>Zimele</th><th>Arrears LIVE</th><th>Actions - LIVE DB</th></tr>${rows||'<tr><td colspan=6 style="text-align:center;padding:20px">No members in Supabase yet<br>Click + Add Member or run SQL to seed 14 members<br>Table: members in project ocaxorcezbhhheqaeahu</td></tr>'}</table></div></div>`;
}

window.addMember=function(){
  modalHTML(`<div style="padding:16px"><h3>Add Member - Saves LIVE to Supabase - NO HARD CODE</h3><input id="newMName" placeholder="Full Name e.g. James Andaro Okingo"><input id="newMPhone" placeholder="2547..."><input id="newMMemberNo" placeholder="000059890"><input id="newMEmail" placeholder="james@kaudha.co.ke"><input id="newMZimele" type="number" placeholder="Zimele e.g. 15460"><input id="newMMonthly" type="number" placeholder="Monthly e.g. 17650"><div style="display:flex;gap:6px;margin-top:10px"><button class="btn l" style="flex:1" onclick="closem()">Cancel</button><button class="btn s" style="flex:1" onclick="saveNewMember()">💾 Save LIVE to Supabase</button></div></div>`);
};
window.saveNewMember=async function(){
  let name=document.getElementById('newMName').value.trim(); let phone=document.getElementById('newMPhone').value.trim(); let memberNo=document.getElementById('newMMemberNo').value.trim(); let email=document.getElementById('newMEmail').value.trim(); let zimele=parseInt(document.getElementById('newMZimele').value)||15460; let monthly=parseInt(document.getElementById('newMMonthly').value)||17650;
  if(!name) return alert('Name required');
  let arrears=zimele-monthly;
  const { data, error } = await window.supabase.from('members').insert({membership_number:memberNo, full_name:name, email:email, phone:phone, zimele:zimele, monthly:monthly, arrears:arrears, status:arrears>=0?'Credit':'Arrears', role:'Member', withdrawal:'0.00'}).select();
  if(error) return alert("Supabase Error: "+error.message);
  alert('✅ Saved LIVE to Supabase: '+name); closem(); await window.loadLive(); members();
};
window.editMember=async function(i){
  let m=window.membersData[i];
  modalHTML(`<div style="padding:16px"><h3>Edit ${m.name} - LIVE Supabase</h3><input id="editMName" value="${m.name}"><input id="editMPhone" value="${m.phone}" style="margin-top:6px"><input id="editMEmail" value="${m.email}" style="margin-top:6px"><input id="editMZimele" type="number" value="${m.zimele}" style="margin-top:6px"><input id="editMMonthly" type="number" value="${m.monthly}" style="margin-top:6px"><div style="display:flex;gap:6px;margin-top:10px"><button class="btn l" style="flex:1" onclick="closem()">Cancel</button><button class="btn s" style="flex:1" onclick="saveEdit(${i})">Save to Supabase</button></div></div>`);
};
window.saveEdit=async function(i){
  let m=window.membersData[i];
  let zimele=parseInt(document.getElementById('editMZimele').value)||0; let monthly=parseInt(document.getElementById('editMMonthly').value)||0;
  let updated={full_name:document.getElementById('editMName').value, phone:document.getElementById('editMPhone').value, email:document.getElementById('editMEmail').value, zimele:zimele, monthly:monthly, arrears:zimele-monthly, status:(zimele-monthly)>=0?'Credit':'Arrears'};
  const { error } = await window.supabase.from('members').update(updated).eq('id', m.id);
  if(error) return alert(error.message);
  closem(); await window.loadLive(); members();
};
window.deleteMember=async function(i){
  if(!confirm('Delete '+window.membersData[i].name+' from Supabase LIVE?')) return;
  const { error } = await window.supabase.from('members').delete().eq('id', window.membersData[i].id);
  if(error) return alert(error.message);
  await window.loadLive(); members();
};
function settings(){document.getElementById('main').innerHTML=`<div class="card"><h2>⚙️ Settings - DYNAMIC - NO HARD CODE</h2><p>Project: ocaxorcezbhhheqaeahu.supabase.co</p><p>Key: sb_publishable_... - Connected via ESM - No NetworkError</p><p>Members: ${window.membersData.length} LIVE from members table</p><p>All features intact: Home Arrears Card LIVE, Members CRUD LIVE, Statements 6 buttons LIVE</p><button class="btn s" onclick="window.loadLive()">Reload LIVE</button> <button class="btn l" onclick="home()">Home</button></div>`;}

if(localStorage.getItem('KAUDHA_LOGGED')==='1'){showApp();}
</script>
