window.membersData = [];

    }));
    document.getElementById('connStatus').innerText = `✅ Connected - ${window.membersData.length} members LIVE`;
    document.getElementById('loginMember').innerHTML = window.membersData.map(m=>`<option value="${m.short}">${m.name} - ${m.status} ${m.arrears}</option>`).join('') + '<option value="Manager">Manager</option><option value="Admin">Super Admin</option>';
  }catch(e){
    document.getElementById('connStatus').innerText = "❌ "+e.message+" - Run SQL: create table members...";
    // Fallback hardcoded so UI still opens
    window.membersData = [
      {name:"James Andaro Okingo",short:"James",phone:"254799458679",memberNo:"000059890",email:"james@kaudha.co.ke",idNo:"12345678",zimele:15460,monthly:17650,arrears:-2190,status:"Arrears",withdrawal:"2,190.00",role:"Member",joined:"2023-01-15",supabase_id:null},

    ];
  }
}
loadMembersLive();
window.loadMembersLive = loadMembersLive;
</script>

}

}
window.membersData[i] = {...m, name:updated.full_name, phone:updated.phone, memberNo:updated.membership_number, email:updated.email, zimele:updated.zimele, monthly:updated.monthly, arrears:updated.arrears, role:updated.role, status:updated.status, short:updated.full_name.split(' ')[0]};
