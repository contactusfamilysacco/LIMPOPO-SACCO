async function saveTopup(id){let amount=Number($('topAmount').value||0);if(amount<=0)return notify('Enter amount');let account=id==='main'?currentAccount:goals.find(x=>String(x.id)===String(id));if(!account)return notify('Account not found');let payload={account_id:account.id||null,transaction_date:new Date().toISOString().slice(0,10),transaction_type:'Deposit',amount,description:'M-Pesa Top Up',reference_no:'STK-'+Date.now()};let {error}=await supabaseClient.from('zimele_transactions').insert(payload);if(error)return notify(error.message);try{if(account.id)await supabaseClient.from('zimele_accounts').update({balance:Number(account.balance||0)+amount}).eq('id',account.id)}catch(e){}account.balance=Number(account.balance||0)+amount;closem();statements();notify('Deposit recorded. Production STK callback should confirm payment server-side.')}

function openL(id){let a=id==='main'?currentAccount:goals.find(x=>String(x.id)===String(id));modal(`<div class="stmt-header">LOCK-IN</div><div class="topup-body"><div class="topup-field"><label>Amount</label><input id="lockAmt" type="number" value="${Number(a?.balance||0)}"></div><div class="topup-field"><label>Until</label><input id="lockUntil" type="date"></div><div class="topup-field"><label>Period / Interest</label><select id="lockPeriod"><option>3 Months – 8%</option><option>6 Months – 10%</option><option>12 Months – 12%</option><option>Custom</option></select></div><div class="topup-field"><label>Reason</label><textarea id="lockReason"></textarea></div><div style="background:#fff3cd;padding:10px;border-radius:8px;font-size:11px">Early withdrawal warning: unlocking before maturity may attract a 10% penalty.</div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="activateLock('${esc(id)}')">Activate Lock-In</button><button class="btn d" onclick="unlockAccount('${esc(id)}')">Unlock</button></div>`)}

async function saveWithdrawal(){let amount=Number($('wdAmount').value||0);if(amount<=0)return notify('Enter amount');if(Number(currentAccount?.balance||0)<amount)return notify('Insufficient balance');if(currentAccount.locked_until&&new Date(currentAccount.locked_until)>new Date())return notify('Account is locked until '+currentAccount.locked_until);let {error}=await supabaseClient.from('zimele_transactions').insert({account_id:currentAccount.id||null,transaction_date:new Date().toISOString().slice(0,10),transaction_type:'Withdrawal',amount,description:$('wdDesc').value,reference_no:'WD-'+Date.now()});if(error)return notify(error.message);if(currentAccount.id)await supabaseClient.from('zimele_accounts').update({balance:Number(currentAccount.balance)-amount}).eq('id',currentAccount.id);currentAccount.balance-=amount;closem();home();notify('Withdrawal recorded')}

async function saveTransfer(){let to=$('toAcct').value.trim(),amount=Number($('trAmt').value||0);if(!to||amount<=0)return notify('Destination and amount required');if(amount>Number(currentAccount?.balance||0))return notify('Insufficient balance');let {data:dest}=await supabaseClient.from('zimele_accounts').select('*').eq('account_no',to).maybeSingle();if(!dest)return notify('Destination account not found');let date=new Date().toISOString().slice(0,10);let a=await supabaseClient.from('zimele_transactions').insert({account_id:currentAccount.id,transaction_date:date,transaction_type:'Withdrawal',amount,description:$('trDesc').value+' to '+to,reference_no:'TR-'+Date.now()});if(a.error)return notify(a.error.message);let b=await supabaseClient.from('zimele_transactions').insert({account_id:dest.id,transaction_date:date,transaction_type:'Deposit',amount,description:'Transfer from '+currentAccount.account_no,reference_no:'TR-'+Date.now()});if(b.error)return notify(b.error.message);await supabaseClient.from('zimele_accounts').update({balance:Number(currentAccount.balance)-amount}).eq('id',currentAccount.id);await supabaseClient.from('zimele_accounts').update({balance:Number(dest.balance||0)+amount}).eq('id',dest.id);currentAccount.balance-=amount;closem();home();notify('Transfer completed')}
async function getMembers(){let q=await supabaseClient.from('members').select('*').order('full_name');if(!q.error&&q.data?.length){membersCache=q.data;return q.data}return sampleMembers.map(x=>({full_name:x[0],short_name:x[1],phone:x[2],member_no:x[3],email:x[4],national_id:x[5],zimele_balance:x[6],monthly_increment:x[7],arrears:x[8],status:x[9],withdrawal:x[10],role:x[11],registration_date:x[12]}))}

function projectForm(p=null){modal(`<div class="stmt-header">${p?'Edit':'Add'} Project</div><div class="topup-body"><label>Name</label><input id="pName" value="${esc(p?.project_name)}"><label>Description</label><textarea id="pDesc">${esc(p?.description)}</textarea><div class="row"><div><label>Start Date</label><input id="pDate" type="date" value="${esc(p?.start_date)}"></div><div><label>Budget</label><input id="pBudget" type="number" value="${p?.budget||0}"></div><div><label>Amount Spent</label><input id="pSpent" type="number" value="${p?.amount_spent||0}"></div><div><label>Status</label><select id="pStatus"><option>Active</option><option>Completed</option><option>Pending</option></select></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick='saveProject(${p?JSON.stringify(p.id):'null'})'>Save</button></div>`)}async function saveProject(id){let p={project_name:$('pName').value,description:$('pDesc').value,start_date:$('pDate').value,budget:Number($('pBudget').value||0),amount_spent:Number($('pSpent').value||0),status:$('pStatus').value};let q=id?await supabaseClient.from('projects').update(p).eq('project_id',id):await supabaseClient.from('projects').insert(p);if(q.error)return notify(q.error.message);closem();projects()}
async function loanApplications(){toggleSide();let q=await supabaseClient.from('loan_applications').select('*').order('created_at',{ascending:false});let rows=q.data||[];$('main').innerHTML=`<div class="card"><h2>Loan Application</h2><p class="muted">Applicant approval → Guarantor requests → Secretary/Treasurer/Chairman → Final Approval</p><button class="btn p" onclick="newLoan()">＋ New Loan Application</button></div><div class="card table-wrap"><table><thead><tr><th>Application</th><th>Applicant</th><th>Amount</th><th>Status</th><th>Guarantors</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map((l,i)=>`<tr><td>${esc(l.application_no||l.id)}</td><td>${esc(l.member_id||'')}</td><td>KSh ${money(l.amount)}</td><td><span class="badge ${l.status==='Approved'?'ok':l.status==='Rejected'?'no':'pending'}">${esc(l.status||'Pending')}</span></td><td>${Number(l.guarantor_count||2)}</td><td><button class="btn l" onclick="viewLoan('${l.id}')">View Workflow</button></td></tr>`).join(''):`<tr><td colspan="6">No loan applications found.</td></tr>`}</tbody></table></div>`}
function newLoan(){modal(`<div class="stmt-header">LOAN APPLICATION</div><div class="topup-body"><div class="row"><div><label>Amount</label><input id="loanAmt" type="number"></div><div><label>Purpose</label><input id="loanPurpose"></div><div><label>Guarantor 1 Member ID</label><input id="g1"></div><div><label>Guarantor 2 Member ID</label><input id="g2"></div></div><div class="flow" style="margin-top:14px"><div class="flow-step">1. Applicant approval — application submitted by member.</div><div class="flow-arrow">▼</div><div class="flow-step">2. Guarantor requests — Guarantor 1 and Guarantor 2 Accept / Reject.</div><div class="flow-arrow">▼</div><div class="flow-step">3. Loan Approvals — Secretary, Treasurer and Chairman.</div><div class="flow-arrow">▼</div><div class="flow-step"><b>4. Final Approval</b> — disbursement after all required approvals.</div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveLoan()">Submit Application</button></div>`)}
async function saveLoan(){if(!currentMember?.id)return notify('Real authenticated member required');let amt=Number($('loanAmt').value||0);if(amt<=0)return notify('Enter loan amount');let applicationNo='LA-'+Date.now();let q=await supabaseClient.from('loan_applications').insert({application_no:applicationNo,member_id:currentMember.id,amount:amt,purpose:$('loanPurpose').value,status:'Applicant Pending',guarantor_count:2}).select().single();if(q.error)return notify(q.error.message);let l=q.data;let gs=[$('g1').value,$('g2').value].filter(Boolean);if(gs.length){let rows=gs.map((m,i)=>({loan_application_id:l.id,guarantor_id:m,guarantor_no:i+1,status:'Pending'}));await supabaseClient.from('guarantor_requests').insert(rows)}await supabaseClient.from('loan_approvals').insert([{loan_application_id:l.id,approval_role:'Secretary',status:'Pending'},{loan_application_id:l.id,approval_role:'Treasurer',status:'Pending'},{loan_application_id:l.id,approval_role:'Chairman',status:'Pending'}]);closem();loanApplications();notify('Loan application submitted')}
async function viewLoan(id){let l=(await supabaseClient.from('loan_applications').select('*').eq('id',id).single()).data;let gs=(await supabaseClient.from('guarantor_requests').select('*').eq('loan_application_id',id)).data||[];let ap=(await supabaseClient.from('loan_approvals').select('*').eq('loan_application_id',id)).data||[];modal(`<div class="stmt-header">LOAN APPLICATION WORKFLOW</div><div class="topup-body"><div class="flow"><div class="flow-step"><b>Applicant approval</b><br>Applicant: ${esc(l?.member_id)}<br>Amount: KSh ${money(l?.amount)}<br>Status: <span class="badge">${esc(l?.status)}</span></div><div class="flow-arrow">▼</div><div class="flow-step"><b>Guarantor requests</b>${gs.length?gs.map(g=>`<div class="card"><b>Guarantor ${g.guarantor_no}</b> — ${esc(g.guarantor_id)}<br>Status: <span class="badge ${g.status==='Accepted'?'ok':g.status==='Rejected'?'no':'pending'}">${esc(g.status)}</span><div class="actions"><button class="btn s" onclick="guarantorDecision('${g.id}','Accepted','${id}')">Accept</button><button class="btn d" onclick="guarantorDecision('${g.id}','Rejected','${id}')">Reject</button></div></div>`).join(''):'<small>No guarantor requests found.</small>'}</div><div class="flow-arrow">▼</div><div class="flow-step"><b>Loan Approvals</b><div class="approval-grid">${['Secretary','Treasurer','Chairman'].map(r=>{let x=ap.find(a=>a.approval_role===r);return `<div class="card"><b>${r}</b><br><span class="badge ${x?.status==='Approved'?'ok':x?.status==='Rejected'?'no':'pending'}">${esc(x?.status||'Pending')}</span><br><button class="btn s" onclick="approveLoan('${x?.id}','Approved','${id}')">Approve</button><button class="btn d" onclick="approveLoan('${x?.id}','Rejected','${id}')">Reject</button></div>`}).join('')}</div></div><div class="flow-arrow">▼</div><div class="flow-step"><b>Final Approval</b><br><button class="btn p" onclick="finalApprove('${id}')">Final Approval / Disburse</button></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button></div>`)}
async function guarantorDecision(id,status,loan){let q=await supabaseClient.from('guarantor_requests').update({status,response_at:new Date().toISOString()}).eq('id',id);if(q.error)return notify(q.error.message);viewLoan(loan)}async function approveLoan(id,status,loan){if(!id)return notify('Approval row not found');let q=await supabaseClient.from('loan_approvals').update({status,approved_at:new Date().toISOString(),approved_by:currentUser?.id||null}).eq('id',id);if(q.error)return notify(q.error.message);viewLoan(loan)}async function finalApprove(id){let ap=(await supabaseClient.from('loan_approvals').select('*').eq('loan_application_id',id)).data||[];if(ap.length<3||ap.some(x=>x.status!=='Approved'))return notify('Secretary, Treasurer and Chairman must approve first');let q=await supabaseClient.from('loan_applications').update({status:'Approved',final_approved_at:new Date().toISOString()}).eq('id',id);if(q.error)return notify(q.error.message);closem();loanApplications();notify('Final approval completed. Disbursement can now be processed.')}
const settingNames=['General','Themes 28','Roles','Permissions','Sub-Accounts','Audit Log','Dev Backup JSON','Mpesa Config','Interest Rates','Notifications','Member Settings','Security','Reports Config','API Keys','About','Management Control'];let settingTab=0;

if(settingTab===3)return `<h3>Permissions Matrix</h3><div class="table-wrap"><table><thead><tr><th>Module</th><th>Member</th><th>Manager</th><th>Secretary</th><th>Treasurer</th><th>Chairman</th><th>Admin</th></tr></thead><tbody>${['Home','Financials','Members','Documents','Projects','Loan Application','Loan Approvals','Reports','Settings','Database Manager','Button Manager','Management Control'].map(x=>`<tr><td>${x}</td>${['Member','Manager','Secretary','Treasurer','Chairman','Admin'].map(r=>{const k=r+'|'+x;return `<td><input type="checkbox" ${settingsCache[k]==='true'?'checked':''} onchange="savePermission('${esc(r)}','${esc(x)}',this.checked)"></td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
if(settingTab===5)return `<h3>Audit Log</h3><button class="btn s" onclick="loadAudit()">Refresh Audit Log</button><div id="auditArea"></div>`;

}

function settingKV(k,label){return `<h3>${label}</h3><div class="row"><div><label>Setting Key</label><input id="setKey" value="${esc(k)}"></div><div><label>Value</label><input id="setValue" value="${esc(settingsCache[k]||'')}"></div></div><button class="btn p" onclick="saveSetting()">Save Setting</button>`}
async function saveSetting(){const key=$('setKey').value.trim(),value=$('setValue').value;if(!key)return notify('Setting key required');const q=await supabaseClient.from(DB.settings).upsert({setting_key:key,setting_value:value,description:'ZIMELE application setting',updated_at:new Date().toISOString()},{onConflict:'setting_key'}).select().single();if(dbErr(q.error))return;notify('Setting saved to Supabase');renderSettings()}
async function savePermission(role,module,allowed){const key=role+'|'+module;const q=await supabaseClient.from(DB.permissions).upsert({role,module,allowed,updated_at:new Date().toISOString()},{onConflict:'role,module'});if(dbErr(q.error))return;notify('Permission saved')}
async function loadAudit(){const q=await supabaseClient.from(DB.audit).select('*').order('created_at',{ascending:false}).limit(100);if(dbErr(q.error))return;$('auditArea').innerHTML='<div class="table-wrap"><table><thead><tr><th>Date</th><th>Action</th><th>Module</th><th>Description</th></tr></thead><tbody>'+((q.data||[]).map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.module)}</td><td>${esc(x.description)}</td></tr>`).join('')||'<tr><td colspan="4">No audit records.</td></tr>')+'</tbody></table></div>'}
function backupJSON(){downloadBlob(JSON.stringify({project:'ZIMELE',user:currentUser?.email,member:currentMember,account:currentAccount,goals,settings:settingsCache},null,2),'zimele-backup.json','application/json')}
function applyTheme(c){document.documentElement.style.setProperty('--maroon',c);notify('Theme applied')}

 system_status:'Operational',maintenance_mode:'false',allow_new_members:'true',allow_member_edits:'true',allow_financial_edits:'true',allow_statement_edits:'true',allow_withdrawals:'true',allow_transfers:'true',allow_loan_applications:'true',allow_loan_approvals:'true',require_two_person_finance:'false',require_approval_before_posting:'false',auto_audit:'true',audit_retention_days:'3650',session_timeout_minutes:'60',max_login_attempts:'5',document_max_file_gb:'5',allow_any_file_type:'true',allow_video_uploads:'true',allow_image_uploads:'true',allow_project_files:'true',allow_profile_photo:'true',email_notifications:'true',sms_notifications:'false',mpesa_enabled:'false',paybill:'501101',freeze_financials:'false',freeze_members:'false',freeze_documents:'false',freeze_projects:'false',freeze_loans:'false'

async function loadManagementControls(){const q=await supabaseClient.from('management_controls').select('*').order('control_key');if(!q.error)(q.data||[]).forEach(x=>settingsCache['mc_'+x.control_key]=x.control_value)}
function mc(key){const v=settingsCache['mc_'+key];return v===undefined?managementDefaults[key]||'':v}
function isTrue(key){return String(mc(key)).toLowerCase()==='true'}
function mcToggle(key,label,desc){return `<div class="card" style="margin:0"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>${esc(label)}</b><div class="muted" style="font-size:11px">${esc(desc)}</div></div><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" ${isTrue(key)?'checked':''} onchange="saveManagementControl('${key}',this.checked?'true':'false')"> ${isTrue(key)?'ON':'OFF'}</label></div></div>`}
function managementPanelHTML(){

if(managementTab==='overview')body=`<div class="grid4"><div class="card"><b>System</b><h2>${esc(mc('system_status'))}</h2></div><div class="card"><b>Maintenance</b><h2>${isTrue('maintenance_mode')?'ON':'OFF'}</h2></div><div class="card"><b>Financial Freeze</b><h2>${isTrue('freeze_financials')?'ON':'OFF'}</h2></div><div class="card"><b>Audit</b><h2>${isTrue('auto_audit')?'ACTIVE':'OFF'}</h2></div></div><div class="card"><h3>Management Control Centre</h3><p class="muted">Central administrator controls for system availability, permissions, financial posting, approvals, documents, media, security, notifications and operational freezes. Every change is stored in Supabase.</p><div class="grid4"><div class="action" onclick="managementTab='access';renderManagementControl()">👥<h3>Access</h3></div><div class="action" onclick="managementTab='finance';renderManagementControl()">💰<h3>Finance</h3></div><div class="action" onclick="managementTab='workflow';renderManagementControl()">🔄<h3>Workflows</h3></div><div class="action" onclick="managementTab='documents';renderManagementControl()">📁<h3>Media</h3></div></div></div>`;
if(managementTab==='access')body=`<h3>Access & Role Controls</h3><div class="grid4">${mcToggle('allow_new_members','Allow New Members','Enable or disable member registration.')}${mcToggle('allow_member_edits','Allow Member Profile Edits','Allow authorized staff to update member records.')}${mcToggle('allow_financial_edits','Allow Financial Record Edits','Controls edits to financial records.')}${mcToggle('allow_statement_edits','Allow Statement Edits','Controls Treasurer/Secretary statement entry and correction.')}</div><div class="card"><h4>Role Responsibilities</h4><table><thead><tr><th>Role</th><th>Members</th><th>Finance</th><th>Loans</th><th>Documents</th><th>Settings</th></tr></thead><tbody>${[['Member','View','View own','Apply','Own/view','Own profile'],['Secretary','Manage','Enter/Edit','Review','Manage','Limited'],['Treasurer','Manage','Enter/Edit','Review/Approve','Manage','Limited'],['Chairman','View','Approve','Final/Approve','Manage','Limited'],['Manager','Manage','Manage','Manage','Manage','Manage'],['Admin','Full','Full','Full','Full','Full']].map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
if(managementTab==='finance')body=`<h3>Financial Controls</h3><div class="grid4">${mcToggle('allow_financial_edits','Financial Edits','Permit corrections to ledger records.')}${mcToggle('allow_statement_edits','Statement Entry','Permit Treasurer/Secretary contribution entry.')}${mcToggle('allow_withdrawals','Withdrawals','Enable withdrawal processing.')}${mcToggle('allow_transfers','Transfers','Enable account-to-account transfers.')}${mcToggle('require_two_person_finance','Two-Person Financial Control','Require a second authorized officer for sensitive financial actions.')}${mcToggle('require_approval_before_posting','Approval Before Posting','Require approval before a financial entry becomes final.')}${mcToggle('freeze_financials','Freeze Financials','Temporarily prevent financial writes while retaining viewing.')}</div><div class="card"><h4>Financial Protection</h4><p>Use this area to control posting, corrections, withdrawals, transfers, approval requirements and temporary financial freezes.</p><button class="btn p" onclick="managementAction('Financial controls reviewed')">Record Control Review</button></div>`;

if(managementTab==='documents')body=`<h3>Documents & Media Controls</h3><div class="grid4">${mcToggle('allow_any_file_type','Any File Type','Do not restrict uploads by MIME type.')}${mcToggle('allow_video_uploads','Video Uploads','Allow video files.')}${mcToggle('allow_image_uploads','Image Uploads','Allow photographs and images.')}${mcToggle('allow_project_files','Project Attachments','Allow files to be attached to projects.')}${mcToggle('allow_profile_photo','Profile Photos','Allow members to upload/change profile photographs.')}${mcToggle('freeze_documents','Freeze Documents','Temporarily prevent document changes.')}</div><div class="card"><h4>Storage Policy</h4><p>Application limit: <b>${esc(mc('document_max_file_gb'))} GB per file</b>. MIME restriction: <b>${isTrue('allow_any_file_type')?'None':'Configured'}</b>.</p><button class="btn s" onclick="documentsFromManagement()">Open Documents</button></div>`;
if(managementTab==='security')body=`<h3>Security Controls</h3><div class="grid4">${mcToggle('maintenance_mode','Maintenance Mode','Show the system as under maintenance while retaining administrator access.')}${mcToggle('auto_audit','Automatic Audit Trail','Record management changes in audit_logs.')}</div><div class="row"><div class="card"><label>Session Timeout (minutes)</label><input id="mc_session" type="number" value="${esc(mc('session_timeout_minutes'))}"><button class="btn p" onclick="saveManagementControl('session_timeout_minutes',$('mc_session').value)">Save</button></div><div class="card"><label>Maximum Login Attempts</label><input id="mc_attempts" type="number" value="${esc(mc('max_login_attempts'))}"><button class="btn p" onclick="saveManagementControl('max_login_attempts',$('mc_attempts').value)">Save</button></div><div class="card"><label>Audit Retention (days)</label><input id="mc_retention" type="number" value="${esc(mc('audit_retention_days'))}"><button class="btn p" onclick="saveManagementControl('audit_retention_days',$('mc_retention').value)">Save</button></div></div>`;
if(managementTab==='notifications')body=`<h3>Notifications</h3><div class="grid4">${mcToggle('email_notifications','Email Notifications','Enable email notices.')}${mcToggle('sms_notifications','SMS Notifications','Enable SMS notices when provider is configured.')}</div><div class="card"><h4>Notification Events</h4><p>Configure alerts for contributions, withdrawals, loan applications, guarantor requests, approvals, reminders, documents and account changes.</p><button class="btn s" onclick="managementAction('Notification configuration reviewed')">Save Review</button></div>`;

async function renderManagementControl(){await loadManagementControls();$('main').innerHTML=`<div class="statements-title">MANAGEMENT CONTROL CENTRE</div>${managementPanelHTML()}`}
async function saveManagementControl(key,value){const q=await supabaseClient.from('management_controls').upsert({control_key:key,control_value:String(value),updated_by:currentUser?.id||null,updated_at:new Date().toISOString()},{onConflict:'control_key'}).select().single();if(dbErr(q.error))return;settingsCache['mc_'+key]=String(value);if(mc('auto_audit')==='true')await addAudit('UPDATE','Management control changed: '+key,'Management Control',q.data?.id||null);notify('Management control saved');await renderManagementControl()}
async function managementAction(description){await addAudit('CONTROL',description,'Management Control',null);notify('Control action recorded')}

function openProfile(){modal(`<div class="stmt-header">PROFILE</div><div class="topup-body"><div class="profile-avatar">👤</div><div class="row"><div><label>Name</label><input id="prName" value="${esc(currentMember?.full_name)}"></div><div><label>Phone</label><input id="prPhone" value="${esc(currentMember?.phone)}"></div><div><label>Email</label><input id="prEmail" value="${esc(currentMember?.email||currentUser?.email)}"></div><div><label>Member No</label><input disabled value="${esc(currentMember?.member_no)}"></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Close</button><button class="btn p" onclick="saveProfile()">Save</button></div>`)}

function roleGate(){if(!financeEditor()){notify('Only Treasurer, Secretary, Manager, Chairman or Admin can edit financial records.');return false}return true;}

async function memberTransactions(memberId){
  const q=await supabaseClient.from(DB.tx).select('id,account_id,member_id,transaction_date,description,deposit,withdrawal,interest,reference_no').eq('member_id',memberId).order('transaction_date',{ascending:false}).order('created_at',{ascending:false});

  return q.data||[];
}
function contributionForm(memberId,txId=null){
  if(!roleGate()) return;
  const tx=txId?(window._memberTx||[]).find(x=>String(x.id)===String(txId)):null;
  const accounts=(window._allAccounts||[]).filter(a=>String(a.member_id)===String(memberId));
  modal(`<div class="stmt-header">${tx?'EDIT':'INSERT'} CONTRIBUTION / FINANCIAL RECORD</div><div class="topup-body">
  <label>Account</label><select id="ctAccount">${accounts.map(a=>`<option value="${a.id}" ${String(a.id)===String(tx?.account_id)?'selected':''}>${esc(a.account_no)} — ${esc(a.goal_name||'Account')}</option>`).join('')}</select>

async function saveContribution(memberId,txId=null){
  if(!roleGate())return;
  const accountId=Number($('ctAccount').value), dep=Number($('ctDeposit').value||0), wd=Number($('ctWithdrawal').value||0), interest=Number($('ctInterest').value||0);
  if(!accountId)return notify('Select an account'); if(dep<0||wd<0||interest<0)return notify('Amounts cannot be negative');
  const payload={account_id:accountId,member_id:Number(memberId),transaction_date:$('ctDate').value||today(),description:$('ctDesc').value.trim()||'Contribution',deposit:dep,withdrawal:wd,interest:interest,reference_no:$('ctRef').value.trim()||null};
  const q=txId?await supabaseClient.from(DB.tx).update(payload).eq('id',txId).select().single():await supabaseClient.from(DB.tx).insert(payload).select().single();
  if(dbErr(q.error))return;
  await recalcAccountBalance(accountId);
  closem(); await addAudit(txId?'UPDATE':'CREATE',txId?'Financial record edited':'Contribution inserted','Member Statement',q.data?.id); openB(); notify(txId?'Financial record updated':'Contribution recorded');
}
async function recalcAccountBalance(accountId){
  const q=await supabaseClient.from(DB.tx).select('deposit,withdrawal,interest').eq('account_id',accountId); if(q.error)return;
  const bal=(q.data||[]).reduce((s,x)=>s+Number(x.deposit||0)-Number(x.withdrawal||0)+Number(x.interest||0),0);
  await supabaseClient.from(DB.accounts).update({balance:bal,updated_at:new Date().toISOString()}).eq('id',accountId);
}
async function memberStatementRecords(memberId){

async function getDocRecord(id){
  const byDoc=await supabaseClient.from(DB.docs).select('*').eq('document_id',id).maybeSingle();
  if(!byDoc.error&&byDoc.data)return byDoc.data;
  const byId=await supabaseClient.from(DB.docs).select('*').eq('id',id).maybeSingle();
  return byId.data||null;
}
async function viewDoc(id){
  const d=await getDocRecord(id); if(!d)return notify('File record not found');
  if(!d.file_url)return notify('This record has no uploaded file');
  const url=/^https?:\/\//i.test(d.file_url)?d.file_url:(await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrl(d.file_url,3600)).data?.signedUrl;
  if(!url)return notify('Unable to create secure file link');
  if((d.mime_type||'').startsWith('image/')||(d.mime_type||'').startsWith('video/')||(d.mime_type||'').startsWith('audio/')){
    const media=(d.mime_type||'').startsWith('image/')?`<img src="${esc(url)}" style="max-width:100%;max-height:70vh">`:(d.mime_type||'').startsWith('video/')?`<video src="${esc(url)}" controls style="max-width:100%;max-height:70vh"></video>`:`<audio src="${esc(url)}" controls style="width:100%"></audio>`;
    modal(`<div class="stmt-header">${esc(d.file_name||d.title||'File')}</div><div style="padding:16px;text-align:center">${media}</div><div class="topup-footer"><button class="btn s" onclick="downloadDoc('${esc(d.document_id||d.id)}')">⬇ Download</button><button class="btn l" onclick="closem()">Close</button></div>`);
  }else window.open(url,'_blank','noopener,noreferrer');
}
async function downloadDoc(id){
  const d=await getDocRecord(id); if(!d||!d.file_url)return notify('File not found');
  let url=d.file_url;
  if(!/^https?:\/\//i.test(url)){const q=await supabaseClient.storage.from(MEDIA_BUCKET).createSignedUrl(url,3600,{download:d.file_name||true});if(q.error)return notify(q.error.message);url=q.data?.signedUrl;}
  if(!url)return notify('Download link unavailable');
  const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=d.file_name||d.title||'download';document.body.appendChild(a);a.click();a.remove();
  await addAudit('DOWNLOAD','File downloaded','Documents',d.id||null);
}
async function deleteDoc(id){
  const d=await getDocRecord(id);if(!d)return notify('File not found');if(!confirm('Delete this file and its database record?'))return;
  if(d.file_url&&!/^https?:\/\//i.test(d.file_url))await supabaseClient.storage.from(MEDIA_BUCKET).remove([d.file_url]);
  const key=d.document_id?'document_id':'id';const q=await supabaseClient.from(DB.docs).delete().eq(key,d.document_id||d.id);if(dbErr(q.error))return;await addAudit('DELETE','File deleted','Documents',d.id||null);docs();
}
async function saveFolder(){
  const n=$('folderName')?.value.trim().replace(/[^a-zA-Z0-9 _-]/g,'');if(!n)return notify('Enter a folder name');
  const path=n.replace(/\s+/g,'_');
  const q=await supabaseClient.from('document_folders').insert({folder_name:n,folder_path:path,created_by:currentUser?.id||null}).select().single();
  if(dbErr(q.error))return;
  closem();await addAudit('CREATE','Document folder created: '+n,'Documents',q.data?.id||null);docs();notify('Folder created successfully');
}
async function loadDocumentFolders(){const q=await supabaseClient.from('document_folders').select('*').order('folder_name');return q.error?[]:(q.data||[]);}
async function consolidatedDocs(){
  toggleSide();
  const [dq,fq]=await Promise.all([supabaseClient.from(DB.docs).select('*').order('date',{ascending:false}).order('created_at',{ascending:false}),loadDocumentFolders()]);
  if(dbErr(dq.error))return;const rows=dq.data||[],folders=fq;
  window._documents=rows;window._documentFolders=folders;
  $('main').innerHTML=`<div class="card"><h2>Documents & Media Management</h2><p class="muted">Secure Supabase Storage for documents, images, videos, audio and other files.</p><div class="actions"><button class="btn p" onclick="documentForm()">⬆ Upload File</button><button class="btn s" onclick="createFolder()">📁 Create Folder</button></div><div style="margin-top:12px"><b>Folders:</b> ${folders.length?folders.map(f=>`<span class="badge">📁 ${esc(f.folder_name)}</span>`).join(' '):'<span class="muted">No folders created.</span>'}</div></div><div class="card table-wrap"><table><thead><tr><th>File</th><th>Folder</th><th>Type</th><th>Size</th><th>Uploaded</th><th>Actions</th></tr></thead><tbody>${rows.length?rows.map(d=>{const k=d.document_id||d.id;return `<tr><td><b>${esc(d.file_name||d.title||'File')}</b><br><small>${esc(d.title||'')}</small></td><td>${esc(d.folder_path||'/')}</td><td>${esc(d.mime_type||d.category||'Unknown')}</td><td>${formatBytes(d.file_size)}</td><td>${esc(d.date||'')}</td><td class="actions"><button class="btn l" onclick="viewDoc('${esc(k)}')">👁 View</button><button class="btn s" onclick="downloadDoc('${esc(k)}')">⬇ Download</button><button class="btn p" onclick="documentForm('${esc(k)}')">✏ Edit</button><button class="btn d" onclick="deleteDoc('${esc(k)}')">🗑 Delete</button></td></tr>`}).join(''):'<tr><td colspan="6">No files found.</td></tr>'}</tbody></table></div>`;
}
docs=consolidatedDocs;
async function consolidatedProjects(){
  toggleSide();const q=await supabaseClient.from(DB.projects).select('*').order('start_date',{ascending:false});if(dbErr(q.error))return;const rows=q.data||[];window._projects=rows;
  $('main').innerHTML=`<div class="card"><h2>Projects</h2><button class="btn p" onclick="projectForm()">＋ Add Project</button></div><div class="grid4">${rows.length?rows.map(p=>`<div class="card"><h3>${esc(p.project_name)}</h3><p>${esc(p.description||'')}</p><b>Budget: KSh ${money(p.budget)}</b><br>Spent: KSh ${money(p.amount_spent)}<br><span class="badge">${esc(p.status||'')}</span><div class="actions" style="margin-top:10px"><button class="btn l" onclick="projectForm(${p.id})">✏ Edit</button><button class="btn p" onclick="projectMedia(${p.id})">📁 Upload / View / Download</button></div></div>`).join(''):'<div class="card">No projects found.</div>'}</div>`;
}
projects=consolidatedProjects;
async function projectFormFixed(p=null){modal(`<div class="stmt-header">${p?'Edit':'Add'} Project</div><div class="topup-body"><label>Name</label><input id="pName" value="${esc(p?.project_name||'')}"><label>Description</label><textarea id="pDesc">${esc(p?.description||'')}</textarea><div class="row"><div><label>Start Date</label><input id="pDate" type="date" value="${esc(p?.start_date||'')}" ></div><div><label>Budget</label><input id="pBudget" type="number" step="0.01" value="${p?.budget||0}"></div><div><label>Amount Spent</label><input id="pSpent" type="number" step="0.01" value="${p?.amount_spent||0}"></div><div><label>Status</label><select id="pStatus"><option ${p?.status==='Active'?'selected':''}>Active</option><option ${p?.status==='Completed'?'selected':''}>Completed</option><option ${p?.status==='Pending'?'selected':''}>Pending</option></select></div></div></div><div class="topup-footer"><button class="btn l" onclick="closem()">Cancel</button><button class="btn p" onclick="saveProjectFixed(${p?Number(p.id):'null'})">Save</button></div>`)}
async function saveProjectFixed(id){const payload={project_name:$('pName').value.trim(),description:$('pDesc').value.trim(),start_date:$('pDate').value||null,budget:Number($('pBudget').value||0),amount_spent:Number($('pSpent').value||0),status:$('pStatus').value};if(!payload.project_name)return notify('Project name required');const q=id?await supabaseClient.from(DB.projects).update(payload).eq('id',id).select().single():await supabaseClient.from(DB.projects).insert(payload).select().single();if(dbErr(q.error))return;closem();projects();notify('Project saved to Supabase')}
projectForm=projectFormFixed;

init();
</script>
</body></html>
