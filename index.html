<body>
<div id="loginPage"><div class="login-box"><div class="login-logo">FD</div><h1>Family Development</h1><div class="login-subtitle">Management Information System</div><div class="form-group"><label>Email</label><input id="loginEmail" type="email" placeholder="Enter email" autocomplete="email"></div><div class="form-group"><label>Password</label><input id="loginPassword" type="password" placeholder="Enter password" autocomplete="current-password"></div><button class="btn full" onclick="login()">Login</button><button class="btn gray full" onclick="forgotPassword()">Forgot Password?</button><div id="loginMessage" style="margin-top:12px;text-align:center"></div></div></div>
<div id="app" class="hidden"><header class="topbar"><div class="left-top"><button class="menu-btn" onclick="toggleSidebar()">☰</button><div class="logo">FAMILY DEVELOPMENT</div><div class="group-title">FAMILY DEVELOPMENT GROUP</div></div><div class="user-area"><span id="userName" class="user-name">System User</span><span id="userRole" class="user-role">Member</span><button class="btn red small" onclick="logout()">Logout</button></div></header><div class="layout"><aside id="sidebar" class="sidebar"><div class="sidebar-card"><div class="profile-circle"><img id="profileImage" style="display:none" alt="Profile"><span id="profileInitial">FD</span></div><nav id="nav" class="nav"></nav></div></aside><main id="main" class="main"></main></div></div>
<div id="modal" class="modal"><div id="modalBox" class="modal-box"></div></div><div id="loading" class="loading"><div class="loader"></div></div>
<script>
const SUPABASE_URL="https://lodjqbszdrpimldtdfev.supabase.co";
const SUPABASE_KEY="sb_publishable_ewOzpBWF_G6MPhceYJKWNA_NYZkMcYR";
const ADMIN_FUNCTION_URL=SUPABASE_URL+"/functions/v1/admin-db-manager";
const FDG_FUNCTION_URL=SUPABASE_URL+"/functions/v1/fdg-admin";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,currentSheet="",currentData=[],currentSchema=[],dynamicModules=[];
const BUILTIN_MODULES=[
{module:"Home",icon:"🏠",title:"Home",action:"renderHome()"},{module:"Members",icon:"👥",title:"Members",action:"openModule('members')"},{module:"Statements",icon:"📄",title:"Statements",action:"openStatements()"},{module:"Contributions",icon:"💰",title:"Contributions",action:"openModule('contributions')"},{module:"Shares",icon:"📊",title:"Shares",action:"openModule('shares')"},{module:"Loans",icon:"💳",title:"Loans",action:"openLoans()"},{module:"Loan Approvals",icon:"✅",title:"Loan Approvals",action:"openModule('loan_approvals')"},{module:"Repayments",icon:"💵",title:"Repayments",action:"openModule('repayments')"},{module:"Welfare",icon:"❤️",title:"Welfare",action:"openModule('welfare')"},{module:"Projects",icon:"💡",title:"Projects",action:"openModule('projects')"},{module:"Documents",icon:"📁",title:"Documents",action:"openModule('documents')"},{module:"Financials",icon:"📚",title:"Financials",action:"openFinancials()"},{module:"Users",icon:"👤",title:"Users & Roles",action:"openUsers()"},{module:"Permissions",icon:"🔐",title:"Permissions",action:"openPermissionManager()"},{module:"Database Manager",icon:"🗄️",title:"Database Manager",action:"openDatabaseManager()",admin:true},{module:"Button Manager",icon:"🔘",title:"Dashboard Buttons",action:"openButtonManager()",admin:true},{module:'My Account',icon:'🏠',title:'My Account',action:'openProfile()'},{module:'Facilities',icon:'🧩',title:'Facilities / Products',action:'openFacilities()'},{module:'Notifications',icon:'🔔',title:'Notifications',action:'openNotifications()'},{module:'Administration',icon:'⚙️',title:'Administration',action:'openAdministration()',admin:true}];
const TABLE_SCHEMAS={
members:[['member_no','text',1],['full_name','text',1],['phone','tel'],['email','email'],['national_id','text'],['next_of_kin','text'],['next_of_kin_phone','tel'],['address','text'],['registration_date','date'],['status','select',['Active','Inactive']],['profile_photo','url']],
contributions:[['member_id','text',1],['date','date',1],['amount','number',1]],shares:[['member_id','text'],['transaction_date','date'],['amount','number'],['shares_units','number'],['transaction_type','text'],['reference_no','text'],['description','textarea']],
welfare:[['member_id','text'],['transaction_date','date'],['amount','number'],['transaction_type','text'],['beneficiary','text'],['description','textarea'],['reference_no','text']],projects:[['project_id','text'],['project_name','text',1],['description','textarea'],['start_date','date'],['budget','number'],['amount_spent','number'],['status','text']],
documents:[['document_id','text'],['title','text',1],['category','text'],['description','textarea'],['date','date'],['file_url','url']],income:[['income_date','date',1],['category','text'],['amount','number',1],['reference_no','text'],['description','textarea']],expenses:[['expense_date','date',1],['category','text'],['amount','number',1],['reference_no','text'],['description','textarea']],
repayments:[['loan_id','text'],['member_id','text'],['repayment_date','date',1],['amount','number',1],['reference_no','text'],['payment_method','text'],['description','textarea']],loans:[['loan_no','text',1],['application_id','text'],['member_id','text',1],['principal_amount','number',1],['interest_rate','number'],['period_months','number'],['date_issued','date'],['maturity_date','date'],['status','text'],['loan_type','text'],['purpose','textarea']],
users:[['email','email',1],['full_name','text',1],['role','select',['Chairman','Treasurer','Secretary','Member']],['status','select',['Active','Inactive']],['phone','tel'],['member_no','text'],['profile_photo','url']],permissions:[['role','text',1],['module','text',1],['allowed','checkbox']],cashbook:[['transaction_date','date'],['description','textarea'],['reference_no','text'],['debit','number'],['credit','number']],loan_approvals:[['application_id','text'],['chairman_approved','checkbox'],['treasurer_approved','checkbox'],['secretary_approved','checkbox'],['status','text']]};
function isChairman(){return ['chairman','admin','administrator'].includes(String(currentProfile?.role||'').toLowerCase())}
window.addEventListener('DOMContentLoaded',initializeApp);
async function initializeApp(){showLoading(true);try{const{data,error}=await sb.auth.getSession();if(error)throw error;if(data?.session)await loadCurrentUser();else showLogin()}catch(e){console.error(e);showLogin()}finally{showLoading(false)}}
async function login(){const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;if(!email)return setLoginMessage('Enter your email.',true);if(!password)return setLoginMessage('Enter your password.',true);showLoading(true);try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.user)throw Error('Login failed.');await loadCurrentUser();setLoginMessage('')}catch(e){setLoginMessage(e.message||'Unable to login.',true)}finally{showLoading(false)}}
async function loadCurrentUser(){const{data,error}=await sb.auth.getUser();if(error)throw error;if(!data?.user){showLogin();return}currentUser=data.user;const{data:profile,error:pe}=await sb.from('users').select('id,email,full_name,role,status,phone,member_no,profile_photo').eq('email',data.user.email).maybeSingle();if(pe)console.error(pe);if(!profile){showLogin();alert('Your login exists, but no matching user profile was found in the users table.');return}if(String(profile.status||'').toLowerCase()!=='active'){await sb.auth.signOut();showLogin();alert('Your account is inactive.');return}currentProfile=profile;showApplication()}
function showLogin(){document.getElementById('loginPage').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
function showApplication(){document.getElementById('loginPage').classList.add('hidden');document.getElementById('app').classList.remove('hidden');updateUser(currentProfile);buildNavigation();renderHome()}
async function logout(){if(!confirm('Logout from the system?'))return;showLoading(true);try{await sb.auth.signOut();currentUser=null;currentProfile=null;showLogin()}finally{showLoading(false)}}
function updateUser(u){document.getElementById('userName').textContent=u.full_name||'System User';document.getElementById('userRole').textContent=u.role||'Member';const i=document.getElementById('profileImage'),n=document.getElementById('profileInitial');if(u.profile_photo){i.src=u.profile_photo;i.style.display='block';n.style.display='none';i.onerror=()=>{i.style.display='none';n.style.display='block'}}else{i.style.display='none';n.style.display='block';n.textContent=(u.full_name||'Family Development').slice(0,2).toUpperCase()}}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('collapsed')}
function closeSidebar(){if(innerWidth<=900)document.getElementById('sidebar').classList.add('collapsed')}
async function checkPermission(module){if(!currentProfile)return false;if(isChairman())return true;try{const{data,error}=await sb.from('permissions').select('allowed').eq('role',currentProfile.role).eq('module',module).maybeSingle();return !error&&!!data?.allowed}catch(e){return false}}
async function canOpen(m){return isChairman()||await checkPermission(m)}
async function buildNavigation(){const nav=document.getElementById('nav');let h='';for(const x of BUILTIN_MODULES){if(x.admin&&!isChairman())continue;if(x.module!=='Home'&&!x.admin&&!(await canOpen(x.module)))continue;h+=`<button onclick="${x.action}"><span class="icon">${x.icon}</span>${escapeHtml(x.title)}</button>`}try{const{data}=await sb.from('dashboard_modules').select('*').eq('active',true).order('sort_order',{ascending:true});dynamicModules=data||[];for(const x of dynamicModules){const role=String(x.permission_role||'').trim();if(role&&!isChairman()&&role.toLowerCase()!==String(currentProfile?.role||'').toLowerCase())continue;h+=`<button onclick="openDynamicTable('${escapeAttr(x.table_name)}')"><span class="icon">${escapeHtml(x.icon||'📋')}</span>${escapeHtml(x.name||x.table_name)}</button>`}}catch(e){}nav.innerHTML=h}
async function renderHome(){closeSidebar();document.getElementById('main').innerHTML=`<section class="panel"><div class="welcome"><h1>Good Day, ${escapeHtml(currentProfile?.full_name||'User')}</h1><p>Welcome to <b>FAMILY DEVELOPMENT GROUP</b> Management Information System.</p></div><div class="cards"><div class="card"><div class="card-title">Members</div><div id="statMembers" class="card-value">...</div></div><div class="card"><div class="card-title">Contributions</div><div id="statContributions" class="card-value">...</div></div><div class="card"><div class="card-title">Shares</div><div id="statShares" class="card-value">...</div></div><div class="card"><div class="card-title">Loans</div><div id="statLoans" class="card-value">...</div></div></div></section><section class="panel"><div class="page-title"><h2>Quick Actions</h2></div><div class="quick-actions"><div class="quick" onclick="openStatements()"><div class="qicon">📄</div>Statements</div><div class="quick" onclick="openModule('contributions')"><div class="qicon">💰</div>Contributions</div><div class="quick" onclick="openModule('repayments')"><div class="qicon">💵</div>Repayments</div><div class="quick" onclick="openLoans()"><div class="qicon">💳</div>Loans</div><div class="quick" onclick="loanCalculator()"><div class="qicon">🧮</div>Loan Calculator</div>${isChairman()?'<div class="quick" onclick="openDatabaseManager()"><div class="qicon">🗄️</div>Database Manager</div><div class="quick" onclick="openButtonManager()"><div class="qicon">🔘</div>Dashboard Buttons</div>':''}</div></section><section class="panel"><div class="page-title"><h2>Live Dashboard Buttons</h2><button class="btn gray" onclick="loadLiveDashboardButtons()">Refresh</button></div><div id="liveDashboardButtons" class="dynamic-grid"><div class="empty">Loading...</div></div></section>`;await loadHomeStats();await loadLiveDashboardButtons()}
async function loadHomeStats(){for(const [t,id,kind] of [['members','statMembers','count'],['contributions','statContributions','sum'],['shares','statShares','sum'],['loans','statLoans','count']]){try{if(kind==='count'){const{count,error}=await sb.from(t).select('*',{count:'exact',head:true});if(error)throw error;document.getElementById(id).textContent=count||0}else{const{data,error}=await sb.from(t).select('amount');if(error)throw error;document.getElementById(id).textContent=money((data||[]).reduce((a,x)=>a+(Number(x.amount)||0),0))}}catch(e){document.getElementById(id).textContent='—'}}}
async function loadLiveDashboardButtons(){const b=document.getElementById('liveDashboardButtons');if(!b)return;try{const{data,error}=await sb.from('dashboard_modules').select('*').eq('active',true).order('sort_order',{ascending:true});if(error)throw error;dynamicModules=data||[];const v=dynamicModules.filter(x=>!x.permission_role||isChairman()||String(x.permission_role).toLowerCase()===String(currentProfile?.role||'').toLowerCase());b.innerHTML=v.length?v.map(x=>`<button class="dynamic-button" onclick="openDynamicTable('${escapeAttr(x.table_name)}')"><div class="dynamic-icon">${escapeHtml(x.icon||'📋')}</div><div>${escapeHtml(x.name||x.table_name)}</div><div class="small-muted">${escapeHtml(x.display_type||'button')}</div></button>`).join(''):'<div class="empty">No live dashboard buttons have been created yet.</div>'}catch(e){b.innerHTML='<div class="empty">Create the dashboard_modules table first.</div>'}}
async function openModule(table){if(!(await canOpen(table))){alert('You do not have permission to access this module.');return}closeSidebar();showLoading(true);try{const{data,error}=await sb.from(table).select('*').limit(500);if(error)throw error;currentSheet=table;currentData=data||[];currentSchema=TABLE_SCHEMAS[table]||inferSchema(currentData);renderTable(table,currentData,false)}catch(e){alert('Unable to open '+table+'\n\n'+e.message)}finally{showLoading(false)}}
async function openDynamicTable(table){const m=dynamicModules.find(x=>x.table_name===table);if(m?.permission_role&&!isChairman()&&String(m.permission_role).toLowerCase()!==String(currentProfile?.role||'').toLowerCase()){alert('You do not have permission to access this dashboard button.');return}showLoading(true);try{const r=await adminApi('list_records',{table_name:table,limit:500});currentSheet=table;currentData=r.data||[];currentSchema=r.columns||inferSchema(currentData);renderTable(table,currentData,true)}catch(e){alert('Unable to open dynamic table.\n\n'+e.message)}finally{showLoading(false)}}
function inferSchema(d){return d?.length?Object.keys(d[0]).map(n=>({name:n,type:inferType(d[0][n])})):[]}
function inferType(v){if(typeof v==='boolean')return'checkbox';if(typeof v==='number')return'number';return'text'}
function fieldDef(n,t='text',req=false,opts=[]){let s=`<div class="form-group"><label>${escapeHtml(formatName(n))}${req?' *':''}</label>`,id='field_'+n;if(t==='textarea')s+=`<textarea id="${escapeAttr(id)}"></textarea>`;else if(t==='select')s+=`<select id="${escapeAttr(id)}"><option value="">Select...</option>${opts.map(o=>`<option>${escapeHtml(o)}</option>`).join('')}</select>`;else if(t==='checkbox')s+=`<label><input id="${escapeAttr(id)}" type="checkbox"> Yes</label>`;else s+=`<input id="${escapeAttr(id)}" type="${['email','url','date','tel','number'].includes(t)?t:'text'}" ${req?'required':''}>`;return s+'</div>'}
function normalizeSchema(table){const s=TABLE_SCHEMAS[table]||[];return s.map(x=>({name:x[0],type:x[1],required:!!x[2]&&!Array.isArray(x[2]),options:Array.isArray(x[2])?x[2]:[]}))}
function renderTable(table,data,dynamic){const headers=currentSchema.length?currentSchema.map(x=>x.name):data.length?Object.keys(data[0]):[];const set=getTableSettings(table,headers),vis=set.order.filter(x=>!set.hidden.includes(x));document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>${escapeHtml(dynamic?(dynamicModules.find(x=>x.table_name===table)?.name||formatName(table)):formatName(table))}</h2><div><button class="btn gray" onclick="renderHome()">← Home</button>${isChairman()?`<button class="btn blue" onclick="openTableSettings('${escapeAttr(table)}')">⚙ Columns</button>`:''}</div></div><div class="table-actions"><div class="search-box"><input id="tableSearch" placeholder="Search this table..." oninput="filterRenderedTable()"></div><button class="btn" onclick="${dynamic?`addDynamicRecord('${escapeAttr(table)}')`:`addSupabaseRecord('${escapeAttr(table)}')`}">＋ Add Record</button><button class="btn gray" onclick="${dynamic?`openDynamicTable('${escapeAttr(table)}')`:`openModule('${escapeAttr(table)}')`}">↻ Refresh</button></div><div class="notice">${dynamic?'Dynamic dashboard-managed table.':'Live Supabase table.'} ${data.length} record(s).</div><div id="renderedTableBox" class="table-wrap">${buildTableHtml(table,data,vis,dynamic)}</div></section>`}
function buildTableHtml(table,data,vis,dyn){if(!vis.length)return'<div class="empty">No columns found.</div>';let h='<table><thead><tr>'+vis.map(x=>`<th>${escapeHtml(tableLabel(table,x))}</th>`).join('')+'<th>Actions</th></tr></thead><tbody>';if(!data.length)h+=`<tr><td colspan="${vis.length+1}" class="empty">No records found.</td></tr>`;else data.forEach(r=>{const e=encodeURIComponent(JSON.stringify(r));h+='<tr>'+vis.map(x=>`<td>${formatCell(r[x])}</td>`).join('')+`<td class="action-cell"><button class="btn small blue" onclick="viewRecordEncoded('${e}')">View</button><button class="btn small" onclick="${dyn?`editDynamicRecord('${escapeAttr(table)}','${e}')`:`editSupabaseRecordEncoded('${escapeAttr(table)}','${e}')`}">Edit</button><button class="btn small red" onclick="${dyn?`deleteDynamicRecord('${escapeAttr(table)}','${e}')`:`deleteSupabaseRecordEncoded('${escapeAttr(table)}','${e}')`}">Delete</button></td></tr>`});return h+'</tbody></table>'}
function filterRenderedTable(){const q=(document.getElementById('tableSearch')?.value||'').toLowerCase();document.querySelectorAll('#renderedTableBox tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function formatCell(v){if(v==null||v==='')return'';if(typeof v==='boolean')return v?'✓':'';if(typeof v==='object')return escapeHtml(JSON.stringify(v));return escapeHtml(String(v))}
function viewRecordEncoded(e){let r={};try{r=JSON.parse(decodeURIComponent(e))}catch(_){}openModal(`<div class="modal-header"><h2>Record Details</h2><span class="close" onclick="closeModal()">×</span></div>${Object.entries(r).map(([k,v])=>`<div class="kv"><b>${escapeHtml(formatName(k))}</b><span>${formatCell(v)}</span></div>`).join('')}`)}
function getPK(r){for(const k of ['id','member_id','loan_id','application_id','document_id','project_id','member_no','loan_no','email'])if(r?.[k]!=null&&r[k]!=='')return{column:k,value:r[k]};return null}
async function addSupabaseRecord(t){showSupabaseForm(t,null,normalizeSchema(t).length?normalizeSchema(t):inferSchema(currentData))}
function editSupabaseRecordEncoded(t,e){let r={};try{r=JSON.parse(decodeURIComponent(e))}catch(_){}showSupabaseForm(t,r,normalizeSchema(t).length?normalizeSchema(t):inferSchema([r]))}
function showSupabaseForm(t,row,schema){openModal(`<div class="modal-header"><h2>${row?'Edit':'Add'} ${escapeHtml(formatName(t))}</h2><span class="close" onclick="closeModal()">×</span></div><form onsubmit="event.preventDefault();saveSupabaseRecord('${escapeAttr(t)}',${row?JSON.stringify(row):'null'})"><div class="form-grid">${schema.map(f=>fieldDef(f.name,f.type,f.required,f.options)).join('')}</div><br><button class="btn" type="submit">Save Record</button><button class="btn gray" type="button" onclick="closeModal()">Cancel</button></form>`);schema.forEach(f=>{const e=document.getElementById('field_'+f.name);if(e&&row&&row[f.name]!==undefined)e.type==='checkbox'?e.checked=!!row[f.name]:e.value=row[f.name]??''})}
async function saveSupabaseRecord(t,row){const schema=normalizeSchema(t).length?normalizeSchema(t):currentSchema,p={};schema.forEach(f=>{const e=document.getElementById('field_'+f.name);if(!e)return;let v=e.type==='checkbox'?e.checked:e.value;if(v===''&&e.type!=='checkbox')v=null;if(f.type==='number'&&v!==null)v=Number(v);p[f.name]=v});for(const f of schema)if(f.required&&(p[f.name]==null||p[f.name]===''))return alert('Enter '+formatName(f.name)+'.');showLoading(true);try{const pk=getPK(row);const r=pk?await sb.from(t).update(p).eq(pk.column,pk.value):await sb.from(t).insert(p);if(r.error)throw r.error;closeModal();await openModule(t);alert('Record saved successfully.')}catch(e){alert('Save failed.\n\n'+e.message)}finally{showLoading(false)}}
async function deleteSupabaseRecordEncoded(t,e){let r={};try{r=JSON.parse(decodeURIComponent(e))}catch(_){}const pk=getPK(r);if(!pk)return alert('No primary key/id was detected.');if(!confirm('Delete this record?'))return;showLoading(true);try{const{error}=await sb.from(t).delete().eq(pk.column,pk.value);if(error)throw error;await openModule(t);alert('Record deleted successfully.')}catch(e){alert('Delete failed.\n\n'+e.message)}finally{showLoading(false)}}
/* DATABASE MANAGER */
async function adminApi(action,payload={}){if(!currentUser)throw Error('You are not logged in.');if(!isChairman())throw Error('Only the Chairman can perform this operation.');const{data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw Error('Session expired.');const r=await fetch(ADMIN_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});let b={};try{b=await r.json()}catch(_){}if(!r.ok)throw Error(b.error||b.message||`Server error ${r.status}`);return b}
async function openDatabaseManager(){if(!isChairman())return alert('Only the Chairman can manage database structure.');closeSidebar();showLoading(true);document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>🗄️ Database Manager</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="notice"><b>Live Database Structure</b><br>Create tables, add/edit/rename columns and delete tables/columns.</div><div class="table-actions"><button class="btn" onclick="openCreateTableModal()">＋ Create Table</button><button class="btn gray" onclick="loadDatabaseTables()">↻ Refresh</button></div><div id="databaseTablesContainer"><div class="empty">Loading...</div></div></section>`;try{await loadDatabaseTables()}catch(e){document.getElementById('databaseTablesContainer').innerHTML=`<div class="notice">${escapeHtml(e.message)}</div>`}finally{showLoading(false)}}
async function loadDatabaseTables(){const b=document.getElementById('databaseTablesContainer');if(!b)return;const r=await adminApi('list_schema',{}),t=r.tables||[];b.innerHTML=t.length?`<div class="table-wrap"><table><thead><tr><th>Table</th><th>Columns</th><th>Actions</th></tr></thead><tbody>${t.map(x=>`<tr><td><b>${escapeHtml(x.table_name)}</b></td><td>${x.column_count||0}</td><td><button class="btn small blue" onclick="openDatabaseTable('${escapeAttr(x.table_name)}')">Columns</button><button class="btn small" onclick="openDynamicTable('${escapeAttr(x.table_name)}')">Open Data</button><button class="btn small red" onclick="deleteDatabaseTable('${escapeAttr(x.table_name)}')">Delete Table</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No tables returned.</div>'}
async function openDatabaseTable(t){showLoading(true);try{const r=await adminApi('list_schema',{table_name:t}),c=r.columns||[];openModal(`<div class="modal-header"><h2>🧱 ${escapeHtml(t)}</h2><span class="close" onclick="closeModal()">×</span></div><div class="table-actions"><button class="btn" onclick="openAddColumnModal('${escapeAttr(t)}')">＋ Add Column</button></div><div class="table-wrap"><table><thead><tr><th>Column</th><th>Type</th><th>Nullable</th><th>Default</th><th>Actions</th></tr></thead><tbody>${c.map(x=>`<tr><td>${escapeHtml(x.column_name)}</td><td>${escapeHtml(x.data_type||'')}</td><td>${x.is_nullable==='YES'?'Yes':'No'}</td><td>${escapeHtml(x.column_default||'')}</td><td><button class="btn small blue" onclick="openEditColumnModal('${escapeAttr(t)}','${escapeAttr(x.column_name)}','${escapeAttr(x.data_type||'')}','${escapeAttr(x.is_nullable||'YES')}')">Edit</button><button class="btn small red" onclick="deleteDatabaseColumn('${escapeAttr(t)}','${escapeAttr(x.column_name)}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`)}catch(e){alert(e.message)}finally{showLoading(false)}}
function sqlTypes(sel){return['text','varchar','integer','bigint','numeric','boolean','date','timestamp with time zone','uuid','jsonb'].map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('')}
function openCreateTableModal(){openModal(`<div class="modal-header"><h2>＋ Create Database Table</h2><span class="close" onclick="closeModal()">×</span></div><div class="notice">Use lowercase letters, numbers and underscores. The first column may be an automatically generated UUID primary key.</div><div class="form-group"><label>Table Name</label><input id="newTableName" placeholder="example_table"></div><div class="form-group"><label>First Column</label><input id="newTableFirstColumn" value="id"></div><div class="form-group"><label>Type</label><select id="newTableFirstType"><option>uuid</option><option>text</option><option>bigint</option></select></div><label><input id="newTablePrimary" type="checkbox" checked> Primary key</label><br><br><button class="btn" onclick="createDatabaseTable()">Create Table</button><button class="btn gray" onclick="closeModal()">Cancel</button>`)}
async function createDatabaseTable(){const t=document.getElementById('newTableName').value.trim(),c=document.getElementById('newTableFirstColumn').value.trim(),type=document.getElementById('newTableFirstType').value;if(!t||!c)return alert('Enter table and column names.');showLoading(true);try{await adminApi('create_table',{table_name:t,columns:[{name:c,type,primary_key:document.getElementById('newTablePrimary').checked,nullable:false}]});closeModal();await loadDatabaseTables();alert('Table created successfully.')}catch(e){alert('Create table failed.\n\n'+e.message)}finally{showLoading(false)}}
function openAddColumnModal(t){openModal(`<div class="modal-header"><h2>＋ Add Column</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-group"><label>Column Name</label><input id="addColumnName" placeholder="column_name"></div><div class="form-group"><label>Data Type</label><select id="addColumnType">${sqlTypes()}</select></div><label><input id="addColumnNullable" type="checkbox" checked> Allow NULL</label><br><br><button class="btn" onclick="addDatabaseColumn('${escapeAttr(t)}')">Add Column</button><button class="btn gray" onclick="closeModal()">Cancel</button>`)}
async function addDatabaseColumn(t){const c=document.getElementById('addColumnName').value.trim(),type=document.getElementById('addColumnType').value;if(!c)return alert('Enter a column name.');showLoading(true);try{await adminApi('add_column',{table_name:t,column_name:c,data_type:type,nullable:document.getElementById('addColumnNullable').checked});closeModal();await openDatabaseTable(t);alert('Column added successfully.')}catch(e){alert('Add column failed.\n\n'+e.message)}finally{showLoading(false)}}
function openEditColumnModal(t,c,type,n){openModal(`<div class="modal-header"><h2>✏ Edit Column</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-group"><label>New Column Name</label><input id="editNewColumn" value="${escapeAttr(c)}"></div><div class="form-group"><label>Data Type</label><select id="editColumnType">${sqlTypes(type)}</select></div><label><input id="editColumnNullable" type="checkbox" ${n==='YES'?'checked':''}> Allow NULL</label><br><br><button class="btn" onclick="editDatabaseColumn('${escapeAttr(t)}','${escapeAttr(c)}')">Save Column</button><button class="btn gray" onclick="closeModal()">Cancel</button>`)}
async function editDatabaseColumn(t,c){const n=document.getElementById('editNewColumn').value.trim(),type=document.getElementById('editColumnType').value;showLoading(true);try{await adminApi('alter_column',{table_name:t,column_name:c,new_column_name:n,data_type:type,nullable:document.getElementById('editColumnNullable').checked});closeModal();await openDatabaseTable(t);alert('Column updated successfully.')}catch(e){alert('Column update failed.\n\n'+e.message)}finally{showLoading(false)}}
async function deleteDatabaseColumn(t,c){if(!confirm(`Delete column "${c}" from "${t}"?`))return;showLoading(true);try{await adminApi('drop_column',{table_name:t,column_name:c});await openDatabaseTable(t);alert('Column deleted successfully.')}catch(e){alert('Delete column failed.\n\n'+e.message)}finally{showLoading(false)}}
async function deleteDatabaseTable(t){if(!confirm(`Delete table "${t}" and all its data?`))return;showLoading(true);try{await adminApi('drop_table',{table_name:t});await loadDatabaseTables();alert('Table deleted successfully.')}catch(e){alert('Delete table failed.\n\n'+e.message)}finally{showLoading(false)}}
async function addDynamicRecord(t){try{const r=await adminApi('list_schema',{table_name:t}),s=(r.columns||[]).map(c=>({name:c.column_name,type:dbType(c.data_type),required:c.is_nullable==='NO'&&!c.column_default,options:[]}));openDynamicForm(t,null,s)}catch(e){alert(e.message)}}
function dbType(t){t=String(t||'').toLowerCase();if(t.includes('bool'))return'checkbox';if(t==='date')return'date';if(t.includes('int')||t.includes('numeric')||t.includes('decimal')||t.includes('real')||t.includes('double'))return'number';if(t.includes('json'))return'textarea';return'text'}
function openDynamicForm(t,row,schema){openModal(`<div class="modal-header"><h2>${row?'Edit':'Add'} ${escapeHtml(formatName(t))}</h2><span class="close" onclick="closeModal()">×</span></div><form onsubmit="event.preventDefault();saveDynamicRecord('${escapeAttr(t)}',${row?JSON.stringify(row):'null'},${JSON.stringify(schema)})"><div class="form-grid">${schema.map(f=>fieldDef(f.name,f.type,f.required,f.options)).join('')}</div><br><button class="btn" type="submit">Save Record</button><button class="btn gray" type="button" onclick="closeModal()">Cancel</button></form>`);schema.forEach(f=>{const e=document.getElementById('field_'+f.name);if(e&&row&&row[f.name]!==undefined)e.type==='checkbox'?e.checked=!!row[f.name]:e.value=row[f.name]??''})}
function editDynamicRecord(t,e){let r={};try{r=JSON.parse(decodeURIComponent(e))}catch(_){}openDynamicForm(t,r,inferSchema([r]))}
async function saveDynamicRecord(t,row,schema){const p={};schema.forEach(f=>{const e=document.getElementById('field_'+f.name);if(!e)return;let v=e.type==='checkbox'?e.checked:e.value;if(v===''&&e.type!=='checkbox')v=null;if(f.type==='number'&&v!==null)v=Number(v);p[f.name]=v});showLoading(true);try{const pk=getPK(row);await adminApi(pk?'update_record':'insert_record',{table_name:t,record:p,primary_key:pk?.column,primary_value:pk?.value});closeModal();await openDynamicTable(t);alert('Record saved successfully.')}catch(e){alert('Save failed.\n\n'+e.message)}finally{showLoading(false)}}
async function deleteDynamicRecord(t,e){let r={};try{r=JSON.parse(decodeURIComponent(e))}catch(_){}const pk=getPK(r);if(!pk)return alert('No primary key was detected.');if(!confirm('Delete this record?'))return;showLoading(true);try{await adminApi('delete_record',{table_name:t,primary_key:pk.column,primary_value:pk.value});await openDynamicTable(t);alert('Record deleted successfully.')}catch(e){alert('Delete failed.\n\n'+e.message)}finally{showLoading(false)}}
/* BUTTON MANAGER */
async function openButtonManager(){if(!isChairman())return alert('Only the Chairman can manage dashboard buttons.');closeSidebar();document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>🔘 Dashboard Button Manager</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="notice">Create live buttons connected to database tables. New active buttons appear on the dashboard.</div><div class="table-actions"><button class="btn" onclick="openButtonModal()">＋ New Dashboard Button</button><button class="btn gray" onclick="loadButtonManager()">↻ Refresh</button></div><div id="buttonManagerBox"><div class="empty">Loading...</div></div></section>`;await loadButtonManager()}
async function loadButtonManager(){const b=document.getElementById('buttonManagerBox');try{const{data,error}=await sb.from('dashboard_modules').select('*').order('sort_order',{ascending:true});if(error)throw error;b.innerHTML=data?.length?`<div class="table-wrap"><table><thead><tr><th>Icon</th><th>Name</th><th>Table</th><th>Display</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead><tbody>${data.map(x=>`<tr><td>${escapeHtml(x.icon||'📋')}</td><td>${escapeHtml(x.name||'')}</td><td>${escapeHtml(x.table_name||'')}</td><td>${escapeHtml(x.display_type||'button')}</td><td>${escapeHtml(x.permission_role||'All')}</td><td>${x.active?'Yes':'No'}</td><td><button class="btn small blue" onclick="editDashboardButton('${escapeAttr(x.id)}')">Edit</button><button class="btn small red" onclick="deleteDashboardButton('${escapeAttr(x.id)}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No dashboard buttons yet.</div>'}catch(e){b.innerHTML=`<div class="notice">dashboard_modules is unavailable.\n${escapeHtml(e.message)}</div>`}}
function openButtonModal(row=null){openModal(`<div class="modal-header"><h2>${row?'Edit':'Create'} Dashboard Button</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-grid"><div class="form-group"><label>Button Name</label><input id="dmName" value="${escapeAttr(row?.name||'')}"></div><div class="form-group"><label>Icon</label><input id="dmIcon" value="${escapeAttr(row?.icon||'📋')}"></div><div class="form-group"><label>Database Table</label><input id="dmTable" value="${escapeAttr(row?.table_name||'')}"></div><div class="form-group"><label>Display Type</label><select id="dmType">${['button','table','statistic','chart','quick_action','report','module'].map(x=>`<option ${row?.display_type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Position</label><select id="dmPosition"><option ${!row||row.position==='main'?'selected':''}>main</option><option ${row?.position==='sidebar'?'selected':''}>sidebar</option><option ${row?.position==='quick'?'selected':''}>quick</option></select></div><div class="form-group"><label>Permission Role</label><select id="dmRole"><option ${!row?.permission_role?'selected':''}>All</option>${['Chairman','Treasurer','Secretary','Member'].map(x=>`<option ${row?.permission_role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Sort Order</label><input id="dmSort" type="number" value="${row?.sort_order??0}"></div><div class="form-group"><label>Status</label><select id="dmActive"><option value="true" ${row?.active!==false?'selected':''}>Active</option><option value="false" ${row?.active===false?'selected':''}>Inactive</option></select></div></div><button class="btn" onclick="saveDashboardButton(${row?JSON.stringify(row):'null'})">Save Button</button><button class="btn gray" onclick="closeModal()">Cancel</button>`)}
async function saveDashboardButton(row){const p={name:document.getElementById('dmName').value.trim(),icon:document.getElementById('dmIcon').value.trim()||'📋',table_name:document.getElementById('dmTable').value.trim(),display_type:document.getElementById('dmType').value,position:document.getElementById('dmPosition').value,permission_role:document.getElementById('dmRole').value==='All'?null:document.getElementById('dmRole').value,sort_order:Number(document.getElementById('dmSort').value)||0,active:document.getElementById('dmActive').value==='true'};if(!p.name||!p.table_name)return alert('Enter button name and database table.');showLoading(true);try{const r=row?.id?await sb.from('dashboard_modules').update(p).eq('id',row.id):await sb.from('dashboard_modules').insert(p);if(r.error)throw r.error;closeModal();await loadButtonManager();await buildNavigation();alert('Dashboard button saved successfully.')}catch(e){alert('Save button failed.\n\n'+e.message)}finally{showLoading(false)}}
async function editDashboardButton(id){showLoading(true);try{const{data,error}=await sb.from('dashboard_modules').select('*').eq('id',id).single();if(error)throw error;openButtonModal(data)}catch(e){alert(e.message)}finally{showLoading(false)}}
async function deleteDashboardButton(id){if(!confirm('Delete this dashboard button?'))return;showLoading(true);try{const{error}=await sb.from('dashboard_modules').delete().eq('id',id);if(error)throw error;await loadButtonManager();await buildNavigation()}catch(e){alert(e.message)}finally{showLoading(false)}}
/* DISPLAY SETTINGS */
function getTableSettings(t,h){let s={};try{s=JSON.parse(localStorage.getItem('fdg_table_settings_'+t)||'{}')}catch(_){}const o=Array.isArray(s.order)?s.order:[],order=o.filter(x=>h.includes(x)).concat(h.filter(x=>!o.includes(x)));return{order,hidden:Array.isArray(s.hidden)?s.hidden.filter(x=>h.includes(x)):[],labels:s.labels||{}}}
function tableLabel(t,h){return getTableSettings(t,[h]).labels[h]||formatName(h)}
function openTableSettings(t){if(!isChairman())return alert('Only the Chairman can change display settings.');const h=currentSchema.map(x=>x.name);const s=getTableSettings(t,h);openModal(`<div class="modal-header"><h2>⚙ Table Display Settings</h2><span class="close" onclick="closeModal()">×</span></div><div class="notice">Rename display labels, hide/show columns and change display order. Actual database column names are not changed.</div><div id="columnSettingsList" class="settings-list">${s.order.map((x,i)=>`<div class="settings-row" data-header="${escapeAttr(x)}"><span>${i+1}</span><input data-label value="${escapeAttr(s.labels[x]||formatName(x))}"><label><input data-visible type="checkbox" ${s.hidden.includes(x)?'':'checked'}> Show</label><div><button class="icon-btn" onclick="moveColumn('${escapeAttr(t)}','${escapeAttr(x)}',-1)">↑</button><button class="icon-btn" onclick="moveColumn('${escapeAttr(t)}','${escapeAttr(x)}',1)">↓</button></div></div>`).join('')}</div><br><button class="btn" onclick="saveCurrentTableSettings('${escapeAttr(t)}')">Save Settings</button>`)}
function moveColumn(t,h,d){const a=currentSchema.map(x=>x.name),s=getTableSettings(t,a),i=s.order.indexOf(h),j=i+d;if(j<0||j>=s.order.length)return;[s.order[i],s.order[j]]=[s.order[j],s.order[i]];localStorage.setItem('fdg_table_settings_'+t,JSON.stringify(s));openTableSettings(t)}
function saveCurrentTableSettings(t){const a=currentSchema.map(x=>x.name),s=getTableSettings(t,a);document.querySelectorAll('#columnSettingsList .settings-row').forEach(r=>{const h=r.dataset.header;s.labels[h]=r.querySelector('[data-label]').value.trim()||formatName(h);s.hidden=s.hidden.filter(x=>x!==h);if(!r.querySelector('[data-visible]').checked)s.hidden.push(h)});localStorage.setItem('fdg_table_settings_'+t,JSON.stringify(s));closeModal();renderTable(t,currentData,false)}
/* USERS / PERMISSIONS */
async function openUsers(){if(!(await canOpen('Users')))return alert('You do not have permission to manage users.');showLoading(true);try{const{data,error}=await sb.from('users').select('*').order('full_name');if(error)throw error;document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Users & Roles</h2><div><button class="btn" onclick="showUserForm(null)">＋ Add User</button><button class="btn gray" onclick="renderHome()">← Home</button></div></div><div class="table-actions"><div class="search-box"><input placeholder="Search users..." oninput="filterSimpleTable('userTable',this.value)"></div></div><div id="userTable" class="table-wrap">${data?.length?`<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Phone</th><th>Member No</th><th>Actions</th></tr></thead><tbody>${data.map(r=>`<tr><td>${escapeHtml(r.full_name||'')}</td><td>${escapeHtml(r.email||'')}</td><td><span class="badge">${escapeHtml(r.role||'')}</span></td><td>${escapeHtml(r.status||'')}</td><td>${escapeHtml(r.phone||'')}</td><td>${escapeHtml(r.member_no||'')}</td><td><button class="btn small blue" onclick="showUserForm(${JSON.stringify(r).replace(/</g,'\\u003c')})">Edit</button><button class="btn small red" onclick="deleteUser('${escapeAttr(r.id||'')}')">Delete</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No users found.</div>'}</div></section>`}catch(e){alert('Unable to load users.\n\n'+e.message)}finally{showLoading(false)}}
function filterSimpleTable(id,q){const b=document.getElementById(id);if(!b)return;q=String(q||'').toLowerCase();b.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function showUserForm(r){openModal(`<div class="modal-header"><h2>${r?'Edit':'Add'} User</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-grid"><div class="form-group"><label>Email</label><input id="userEmail" value="${escapeAttr(r?.email||'')}"></div><div class="form-group"><label>Full Name</label><input id="userFullName" value="${escapeAttr(r?.full_name||'')}"></div><div class="form-group"><label>Role</label><select id="userRole">${['Chairman','Treasurer','Secretary','Member'].map(x=>`<option ${r?.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group"><label>Status</label><select id="userStatus"><option ${r?.status!=='Inactive'?'selected':''}>Active</option><option ${r?.status==='Inactive'?'selected':''}>Inactive</option></select></div><div class="form-group"><label>Phone</label><input id="userPhone" value="${escapeAttr(r?.phone||'')}"></div><div class="form-group"><label>Member No</label><input id="userMemberNo" value="${escapeAttr(r?.member_no||'')}"></div><div class="form-group full"><label>Profile Photo URL</label><input id="userPhoto" value="${escapeAttr(r?.profile_photo||'')}"></div></div><button class="btn" onclick="saveUser(${r?JSON.stringify(r):'null'})">Save User</button>`)}
async function saveUser(r){const p={email:document.getElementById('userEmail').value.trim(),full_name:document.getElementById('userFullName').value.trim(),role:document.getElementById('userRole').value,status:document.getElementById('userStatus').value,phone:document.getElementById('userPhone').value.trim(),member_no:document.getElementById('userMemberNo').value.trim(),profile_photo:document.getElementById('userPhoto').value.trim()};if(!p.email||!p.full_name)return alert('Email and full name are required.');showLoading(true);try{const x=r?.id?await sb.from('users').update(p).eq('id',r.id):await sb.from('users').insert(p);if(x.error)throw x.error;closeModal();await openUsers();alert('User profile saved successfully.')}catch(e){alert('Save user failed.\n\n'+e.message)}finally{showLoading(false)}}
async function deleteUser(id){if(!id||!confirm('Delete this user profile?'))return;showLoading(true);try{const{error}=await sb.from('users').delete().eq('id',id);if(error)throw error;await openUsers()}catch(e){alert(e.message)}finally{showLoading(false)}}
async function openPermissionManager(){if(!isChairman())return alert('Only the Chairman can manage permissions.');showLoading(true);try{const{data,error}=await sb.from('permissions').select('*').order('role');if(error)throw error;const roles=['Chairman','Treasurer','Secretary','Member'],mods=BUILTIN_MODULES.filter(x=>!x.admin&&x.module!=='Home').map(x=>x.module);document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Role & Permission Manager</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="notice">Chairman has full access. Other roles can be assigned access below.</div><div class="table-wrap"><table><thead><tr><th>Module</th>${roles.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${mods.map(m=>`<tr><td><b>${m}</b></td>${roles.map(r=>{const p=data?.find(x=>String(x.role).toLowerCase()===r.toLowerCase()&&String(x.module).toLowerCase()===m.toLowerCase());return`<td style="text-align:center"><input type="checkbox" ${r==='Chairman'||p?.allowed?'checked':''} ${r==='Chairman'?'disabled':''} onchange="changePermission('${r}','${m}',this.checked)"></td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
async function changePermission(role,module,allowed){if(role==='Chairman')return;showLoading(true);try{const{data,error}=await sb.from('permissions').select('id').eq('role',role).eq('module',module).maybeSingle();if(error)throw error;if(data){const{error:e}=await sb.from('permissions').update({allowed}).eq('id',data.id);if(e)throw e}else{const{error:e}=await sb.from('permissions').insert({role,module,allowed});if(e)throw e}await openPermissionManager();await buildNavigation()}catch(e){alert(e.message)}finally{showLoading(false)}}
/* STATEMENTS / LOANS / FINANCIALS */
function openStatements(){document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Statements</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="facilities"><div class="facility" onclick="memberStatement()">👤<br><br>Member Statement</div><div class="facility" onclick="openModule('contributions')">💰<br><br>Contributions</div><div class="facility" onclick="groupStatement()">🏢<br><br>Group Statement</div><div class="facility" onclick="openModule('shares')">📊<br><br>Shares</div><div class="facility" onclick="openModule('loans')">💳<br><br>Loans</div><div class="facility" onclick="openModule('welfare')">❤️<br><br>Welfare</div></div></section>`}
function memberStatement(){openModal(`<div class="modal-header"><h2>Member Statement</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-group"><label>Member Number</label><input id="statementMember"></div><button class="btn" onclick="loadMemberStatement()">View Statement</button><div id="statementResult" style="margin-top:20px"></div>`)}
async function loadMemberStatement(){const n=document.getElementById('statementMember').value.trim();if(!n)return alert('Enter a member number.');showLoading(true);try{const{data:m,error}=await sb.from('members').select('*').eq('member_no',n).maybeSingle();if(error)throw error;if(!m)return alert('Member not found.');const[c,s,l,r,w]=await Promise.all([sb.from('contributions').select('amount').eq('member_id',m.id),sb.from('shares').select('amount').eq('member_id',m.id),sb.from('loans').select('principal_amount').eq('member_id',m.id),sb.from('repayments').select('amount').eq('member_id',m.id),sb.from('welfare').select('amount').eq('member_id',m.id)]);const sum=x=>(x.data||[]).reduce((a,v)=>a+(Number(v.amount||v.principal_amount)||0),0);document.getElementById('statementResult').innerHTML=`<div class="cards"><div class="card"><div class="card-title">Member</div><div class="card-value" style="font-size:17px">${escapeHtml(m.full_name||'')}</div></div><div class="card"><div class="card-title">Contributions</div><div class="card-value">${money(sum(c))}</div></div><div class="card"><div class="card-title">Shares</div><div class="card-value">${money(sum(s))}</div></div><div class="card"><div class="card-title">Repayments</div><div class="card-value">${money(sum(r))}</div></div></div><br><div class="notice">Loans issued: <b>${(l.data||[]).length}</b><br>Welfare: <b>${money(sum(w))}</b></div>`}catch(e){alert(e.message)}finally{showLoading(false)}}
async function groupStatement(){showLoading(true);try{const a={};for(const t of ['members','contributions','shares','welfare','loans','repayments']){const{data,error}=await sb.from(t).select('*');if(error)throw error;a[t]=data||[]}const sum=(arr,k='amount')=>arr.reduce((x,r)=>x+(Number(r[k])||0),0);document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Group Statement</h2><button class="btn gray" onclick="openStatements()">← Statements</button></div><div class="cards"><div class="card"><div class="card-title">Members</div><div class="card-value">${a.members.length}</div></div><div class="card"><div class="card-title">Contributions</div><div class="card-value">${money(sum(a.contributions))}</div></div><div class="card"><div class="card-title">Shares</div><div class="card-value">${money(sum(a.shares))}</div></div><div class="card"><div class="card-title">Welfare</div><div class="card-value">${money(sum(a.welfare))}</div></div><div class="card"><div class="card-title">Loans Issued</div><div class="card-value">${money(sum(a.loans,'principal_amount'))}</div></div><div class="card"><div class="card-title">Repayments</div><div class="card-value">${money(sum(a.repayments))}</div></div></div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
function openLoans(){document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Loans</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="facilities"><div class="facility" onclick="openModule('loans')">💳<br><br>Loan Register</div><div class="facility" onclick="openModule('repayments')">💵<br><br>Repayments</div><div class="facility" onclick="loanCalculator()">🧮<br><br>Loan Calculator</div><div class="facility" onclick="openModule('loan_approvals')">✅<br><br>Loan Approvals</div></div></section>`}
function loanCalculator(){openModal(`<div class="modal-header"><h2>Loan Calculator</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-grid"><div class="form-group"><label>Amount</label><input id="calcAmount" type="number"></div><div class="form-group"><label>Interest Rate %</label><input id="calcRate" type="number" value="15"></div><div class="form-group"><label>Months</label><input id="calcMonths" type="number" value="12"></div></div><button class="btn" onclick="calculateLoan()">Calculate</button><div id="loanCalculation" style="margin-top:20px"></div>`)}
function calculateLoan(){const a=Number(calcAmount.value),r=Number(calcRate.value),m=Number(calcMonths.value);if(!a||!r||!m)return alert('Enter amount, interest rate and months.');const i=a*r/100,t=a+i;loanCalculation.innerHTML=`<div class="card"><b>Principal:</b><br>${money(a)}<br><br><b>Interest:</b><br>${money(i)}<br><br><b>Monthly Installment:</b><br>${money(t/m)}<br><br><b>Total Payable:</b><br>${money(t)}</div>`}
function openFinancials(){document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Financial Statements</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="facilities"><div class="facility" onclick="financialSummary()">📈<br><br>Financial Summary</div><div class="facility" onclick="openModule('income')">📥<br><br>Income</div><div class="facility" onclick="openModule('expenses')">📤<br><br>Expenses</div><div class="facility" onclick="openModule('cashbook')">💵<br><br>Cashbook</div></div></section>`}
async function financialSummary(){showLoading(true);try{const[i,e]=await Promise.all([sb.from('income').select('amount'),sb.from('expenses').select('amount')]);if(i.error)throw i.error;if(e.error)throw e.error;const sum=x=>(x.data||[]).reduce((a,r)=>a+(Number(r.amount)||0),0),inc=sum(i),exp=sum(e);document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Financial Summary</h2><button class="btn gray" onclick="openFinancials()">← Financials</button></div><div class="cards"><div class="card"><div class="card-title">Total Income</div><div class="card-value">${money(inc)}</div></div><div class="card"><div class="card-title">Total Expenses</div><div class="card-value">${money(exp)}</div></div><div class="card"><div class="card-title">Net Balance</div><div class="card-value">${money(inc-exp)}</div></div></div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
function openModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function money(v){return'KES '+(Number(v)||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}function formatName(v){return String(v||'').replace(/_/g,' ').replace(/\b\w/g,x=>x.toUpperCase())}function escapeHtml(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function escapeAttr(v){return escapeHtml(v).replace(/`/g,'&#096;')}function showLoading(v){document.getElementById('loading').classList.toggle('show',!!v)}function setLoginMessage(m,e){const b=document.getElementById('loginMessage');b.textContent=m||'';b.style.color=e?'#9b2027':'#365a30'}sb.auth.onAuthStateChange(e=>{if(e==='SIGNED_OUT'){currentUser=null;currentProfile=null;showLogin()}});
\n/* FDG FEATURE PACK: documents, roles, facilities, notifications, password reset */
async function fdgApi(action,payload={}){if(!currentUser)throw Error('You are not logged in.');const {data:{session}}=await sb.auth.getSession();if(!session?.access_token)throw Error('Session expired.');const r=await fetch(FDG_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action,...payload})});const x=await r.json().catch(()=>({}));if(!r.ok||x.error)throw Error(x.error||'Request failed.');return x}
async function forgotPassword(){const email=prompt('Enter the email address registered with FDG:');if(!email)return;try{const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:location.origin+location.pathname});if(error)throw error;alert('Password reset email sent. Check your email and follow the link to set a new password.')}catch(e){alert(e.message)}}
async function updatePassword(){const p=prompt('Enter your new password (minimum 8 characters):');if(!p)return;if(p.length<8)return alert('Password must be at least 8 characters.');try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;alert('Password changed successfully.')}catch(e){alert(e.message)}}
async function openProfile(){closeSidebar();document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>My Account / Profile</h2><button class="btn gray" onclick="renderHome()">← Home</button></div><div class="cards"><div class="card"><div class="card-title">Name</div><div class="card-value" style="font-size:18px">${escapeHtml(currentProfile?.full_name||'')}</div></div><div class="card"><div class="card-title">Role</div><div class="card-value" style="font-size:18px">${escapeHtml(currentProfile?.role||'')}</div></div><div class="card"><div class="card-title">Member No.</div><div class="card-value" style="font-size:18px">${escapeHtml(currentProfile?.member_no||'')}</div></div></div><br><button class="btn" onclick="updatePassword()">Change Password</button></section>`}
async function openDocuments(){closeSidebar();showLoading(true);try{const x=await fdgApi('list_documents');const docs=x.documents||[];document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Documents</h2><div>${isChairman()?'<button class="btn" onclick="uploadDocument()">+ Upload Document</button>':''}<button class="btn gray" onclick="renderHome()">Home</button></div></div><div class="notice">Documents are private. Access is controlled per document, so restricting one document does not restrict the others.</div><div class="dynamic-grid">${docs.map(d=>`<div class="dynamic-button"><div class="dynamic-icon">📄</div><b>${escapeHtml(d.title)}</b><span class="small-muted">${escapeHtml(d.category||'General')}</span><div><button class="btn small blue" onclick="viewDocument('${d.id}',false)">View</button><button class="btn small" onclick="viewDocument('${d.id}',true)">Download</button>${isChairman()?`<button class="btn small gray" onclick="restrictDocument('${d.id}')">Access</button><button class="btn small red" onclick="deleteDocument('${d.id}')">Delete</button>`:''}</div></div>`).join('')||'<div class="empty">No documents available.</div>'}</div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
async function uploadDocument(){if(!isChairman())return alert('Chairman/Admin only.');openModal(`<div class="modal-header"><h2>Upload Document</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-group"><label>Title</label><input id="docTitle"></div><div class="form-grid"><div class="form-group"><label>Category</label><input id="docCategory" value="General"></div><div class="form-group"><label>Access</label><select id="docAccess"><option value="everyone">Everyone</option><option value="roles">Selected Roles</option><option value="members">Selected Members</option><option value="chairman">Chairman/Admin Only</option></select></div></div><div class="form-group"><label>Description</label><textarea id="docDescription"></textarea></div><div class="form-group"><label>File</label><input id="docFile" type="file"></div><button class="btn full" onclick="saveUploadedDocument()">Upload & Save</button>`)}
async function saveUploadedDocument(){const f=document.getElementById('docFile').files[0],title=document.getElementById('docTitle').value.trim();if(!f||!title)return alert('Title and file are required.');showLoading(true);try{const x=await fdgApi('upload_document_prepare',{file_name:f.name});const {error}=await sb.storage.from('fdg-documents').uploadToSignedUrl(x.path,x.token,f);if(error)throw error;await fdgApi('save_document',{document:{title,category:document.getElementById('docCategory').value.trim()||'General',description:document.getElementById('docDescription').value,storage_path:x.path,original_name:f.name,mime_type:f.type,file_size:f.size,access_mode:document.getElementById('docAccess').value}});closeModal();await openDocuments();alert('Document uploaded successfully.')}catch(e){alert(e.message)}finally{showLoading(false)}}
async function viewDocument(id,download){try{const x=await fdgApi('get_document_url',{id,download});if(!x.url)throw Error('Document URL unavailable.');window.open(x.url,'_blank','noopener');}catch(e){alert(e.message)}}
async function deleteDocument(id){if(!confirm('Delete this document permanently?'))return;showLoading(true);try{await fdgApi('delete_document',{id});await openDocuments()}catch(e){alert(e.message)}finally{showLoading(false)}}
async function restrictDocument(id){showLoading(true);try{const [d,m]=await Promise.all([fdgApi('list_all_documents'),sb.from('users').select('id,full_name,member_no,role,status').eq('status','Active').order('full_name')]);const doc=(d.documents||[]).find(x=>x.id===id);const members=m.data||[];openModal(`<div class="modal-header"><h2>Document Access</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-group"><label>Access Mode</label><select id="raMode"><option value="everyone" ${doc?.access_mode==='everyone'?'selected':''}>Everyone</option><option value="roles" ${doc?.access_mode==='roles'?'selected':''}>Selected Roles</option><option value="members" ${doc?.access_mode==='members'?'selected':''}>Selected Members</option><option value="chairman" ${doc?.access_mode==='chairman'?'selected':''}>Chairman/Admin Only</option></select></div><div class="notice">For Selected Members, tick only the members who may view this document.</div><div class="table-wrap"><table><thead><tr><th>Member</th><th>Role</th><th>Allow</th></tr></thead><tbody>${members.map(u=>`<tr><td>${escapeHtml(u.full_name||u.member_no||'')}</td><td>${escapeHtml(u.role||'')}</td><td><input class="doc-member-check" type="checkbox" value="${u.id}"></td></tr>`).join('')}</tbody></table></div><button class="btn full" onclick="saveDocumentAccess('${id}')">Save Access</button>`);const old=await fdgApi('list_document_access',{document_id:id});(old.access||[]).forEach(a=>{const c=document.querySelector(`.doc-member-check[value="${a.member_id}"]`);if(c)c.checked=!!a.can_view})}catch(e){alert(e.message)}finally{showLoading(false)}}
async function saveDocumentAccess(id){const mode=document.getElementById('raMode').value;const ids=[...document.querySelectorAll('.doc-member-check:checked')].map(x=>x.value);try{await fdgApi('set_document_access',{document_id:id,access_mode:mode,member_ids:ids,allowed_roles:[]});closeModal();await openDocuments();alert('Document access updated.')}catch(e){alert(e.message)}}
async function openRoles(){if(!isChairman())return alert('Chairman/Admin only.');showLoading(true);try{const {data:users,error}=await sb.from('users').select('id,email,full_name,role,status,phone,member_no').order('full_name');if(error)throw error;document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Manage Users & Officials</h2><button class="btn gray" onclick="renderHome()">Home</button></div><div class="notice">Assigning a new role immediately changes the user's MIS permissions. Every role change is recorded.</div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Member No</th><th>Current Role</th><th>Status</th><th>Action</th></tr></thead><tbody>${(users||[]).map(u=>`<tr><td>${escapeHtml(u.full_name||'')}</td><td>${escapeHtml(u.member_no||'')}</td><td><span class="badge">${escapeHtml(u.role||'')}</span></td><td>${escapeHtml(u.status||'')}</td><td><button class="btn small blue" onclick="changeMemberRole('${u.id}','${escapeAttr(u.full_name||u.email||'')}','${escapeAttr(u.role||'Member')}')">Change Role</button></td></tr>`).join('')}</tbody></table></div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
async function changeMemberRole(id,name,current){if(!isChairman())return;const role=prompt(`New role for ${name}:\n\nMember / Treasurer / Secretary / Chairman / Admin`,current);if(!role||role===current)return;const reason=prompt('Reason for role change (optional):','New appointment / replacement');try{await fdgApi('assign_role',{user_id:id,new_role:role.trim(),reason:reason||null});alert('Role changed successfully.');await openRoles()}catch(e){alert(e.message)}}
async function openFacilities(){closeSidebar();showLoading(true);try{const x=await fdgApi('list_facilities');const fs=x.facilities||[];document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Facilities / Products</h2><div>${isChairman()?'<button class="btn" onclick="createFacility()">+ Create Facility</button>':''}<button class="btn gray" onclick="renderHome()">Home</button></div></div><div class="dynamic-grid">${fs.map(f=>`<div class="dynamic-button"><div class="dynamic-icon">${escapeHtml(f.icon||'📦')}</div><b>${escapeHtml(f.facility_name)}</b><span class="small-muted">${escapeHtml(f.description||f.facility_code||'')}</span><button class="btn small" onclick="openDynamicTable('${escapeAttr(f.table_name||'')}')">Open</button>${isChairman()?`<button class="btn small red" onclick="deleteFacility('${f.id}')">Delete</button>`:''}</div>`).join('')||'<div class="empty">No facilities created yet.</div>'}</div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
async function createFacility(){openModal(`<div class="modal-header"><h2>Create Facility / Product</h2><span class="close" onclick="closeModal()">×</span></div><div class="form-grid"><div class="form-group"><label>Facility Name</label><input id="facName"></div><div class="form-group"><label>Facility Code</label><input id="facCode" placeholder="e.g. BURSARY"></div><div class="form-group"><label>Icon</label><input id="facIcon" value="📦"></div><div class="form-group"><label>Display Order</label><input id="facOrder" type="number" value="0"></div></div><div class="form-group"><label>Description</label><textarea id="facDesc"></textarea></div><div class="form-group"><label>Applicable Roles (comma separated)</label><input id="facRoles" value="Member,Treasurer,Secretary,Chairman"></div><div class="form-grid"><label><input id="facMember" type="checkbox" checked> Member Access</label><label><input id="facContrib" type="checkbox" checked> Contributions</label><label><input id="facStmt" type="checkbox" checked> Statements</label><label><input id="facDownload" type="checkbox" checked> Downloads</label></div><button class="btn full" onclick="saveFacility()">Create Facility</button>`)}
async function saveFacility(){const p={facility_name:facName.value.trim(),facility_code:facCode.value.trim(),icon:facIcon.value.trim(),display_order:Number(facOrder.value)||0,description:facDesc.value,applicable_roles:facRoles.value.split(',').map(x=>x.trim()).filter(Boolean),allow_member_access:facMember.checked,allow_contributions:facContrib.checked,allow_statements:facStmt.checked,allow_downloads:facDownload.checked};if(!p.facility_name||!p.facility_code)return alert('Facility name and code are required.');try{await fdgApi('create_facility',{facility:p});closeModal();await openFacilities();alert('Facility created. Its database table and dashboard product are ready.')}catch(e){alert(e.message)}}
async function deleteFacility(id){if(!confirm('Delete this facility and its data table?'))return;try{await fdgApi('delete_facility',{id});await openFacilities()}catch(e){alert(e.message)}}
async function openNotifications(){closeSidebar();showLoading(true);try{const x=await fdgApi('list_notifications');const a=x.notifications||[];document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Notifications</h2><button class="btn gray" onclick="renderHome()">Home</button></div><div class="dynamic-grid">${a.map(n=>`<div class="card"><div class="card-title">${escapeHtml(n.event_type||'Notification')}</div><div style="font-weight:700;margin:7px 0">${escapeHtml(n.subject||'')}</div><div>${escapeHtml(n.message||'')}</div><div class="small-muted" style="margin-top:8px">${escapeHtml(n.status||'pending')}</div></div>`).join('')||'<div class="empty">No notifications yet.</div>'}</div></section>`}catch(e){alert(e.message)}finally{showLoading(false)}}
function openAdministration(){if(!isChairman())return alert('Chairman/Admin only.');document.getElementById('main').innerHTML=`<section class="panel"><div class="page-title"><h2>Administration</h2><button class="btn gray" onclick="renderHome()">Home</button></div><div class="dynamic-grid"><div class="dynamic-button" onclick="openRoles()"><div class="dynamic-icon">👥</div>Manage Users & Officials</div><div class="dynamic-button" onclick="openPermissionManager()"><div class="dynamic-icon">🔐</div>Manage Permissions</div><div class="dynamic-button" onclick="openFacilities()"><div class="dynamic-icon">🧩</div>Manage Facilities</div><div class="dynamic-button" onclick="openDatabaseManager()"><div class="dynamic-icon">🗄️</div>Database Manager</div><div class="dynamic-button" onclick="openButtonManager()"><div class="dynamic-icon">🔘</div>Dashboard Buttons</div><div class="dynamic-button" onclick="openDocuments()"><div class="dynamic-icon">📁</div>Document Control</div></div></section>`}
</script></body></html>
