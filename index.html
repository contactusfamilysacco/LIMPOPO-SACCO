function openLRealDynamic(acct){let list=locks.filter(l=>l.account_no===acct).map(l=>`<div style="border:1px solid #c0392b;padding:8px;border-radius:6px;margin:6px 0;background:#ffebee"><div>🔒 ${l.account_no} - KES ${l.amount} until ${l.until_date} - Real from Supabase locks table</div><button class="btn d" onclick="delLockRealDynamic('${l.id}','${acct}')">Unlock Real - Delete from Supabase</button></div>`).join('')||'No locks - Real table empty - No hard code';modalHTML(`<div style="padding:16px"><h3>Lock-In - REAL Supabase - ${acct} - ${locks.length} - Zero hard code</h3><div style="background:#fdfcf0;padding:12px;border-radius:10px"><input type="number" id="lockAmt" placeholder="Amount - Real"><input type="date" id="lockUntil" style="margin-top:6px"><button class="btn d" style="width:100%;margin-top:8px" onclick="saveLockRealDynamic('${acct}')">Activate Lock Real to Supabase locks table</button></div><div style="margin-top:12px">${list}</div><button class="btn l" style="margin-top:10px" onclick="closem()">Close - Real</button></div>`);}
async function saveLockRealDynamic(acct){let amt=Number(document.getElementById('lockAmt').value);let until=document.getElementById('lockUntil').value;if(!amt||!until)return alert('Amount and Date required - Real');let {error}=await sb.from('locks').insert({account_no:acct,amount:amt,until_date:until,period:'12 months',reason:'Savings Lock'}).select();if(error)return alert('Supabase error - Account already locked (unique constraint real): '+error.message);loadAllReal();setTimeout(()=>openLRealDynamic(acct),800);}
async function delLockRealDynamic(id,acct){await sb.from('locks').delete().eq('id',id);loadAllReal();setTimeout(()=>openLRealDynamic(acct),800);}
