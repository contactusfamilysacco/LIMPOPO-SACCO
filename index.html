<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Development Group</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --maroon:#7a1010;
  --forest:#1E5631;
  --beige:#f6f3e8;
  --border:#d9d2b8;
  --green:#2e6b28;
  --crimson:#8B1E22;
  --bg:#eef1d6;
  --cream:#fdfcf0
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:#222
}

button,input,select,textarea{
  font:inherit
}

button{
  cursor:pointer
}

.hidden{
  display:none!important
}

/* TOP BAR */
.top{
  height:62px;
  background:var(--cream);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:20
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:900
}

.brand-badge{
  background:var(--crimson);
  color:#fff;
  padding:5px 10px;
  border-radius:5px
}

.hamb{
  font-size:21px;
  cursor:pointer
}

/* SIDEBAR */
.side{
  width:270px;
  background:var(--cream);
  border:1.5px solid var(--border);
  border-radius:12px;
  position:fixed;
  top:70px;
  bottom:10px;
  left:10px;
  overflow:auto;
  padding:10px;
  z-index:40
}

.main{
  margin-left:290px;
  padding:16px
}

.nav-btn{
  width:100%;
  display:flex;
  gap:10px;
  padding:12px;
  border:0;
  background:transparent;
  border-radius:8px;
  text-align:left;
  font-size:13px;
  align-items:center
}

.nav-btn:hover{
  background:var(--beige)
}

.nav-btn.active{
  color:var(--crimson);
  font-weight:800
}

.nav-btn.dev{
  background:var(--forest);
  color:#fff;
  font-weight:800;
  margin-top:10px
}

.profile{
  background:#111;
  color:#fff;
  border-radius:50%;
  width:100px;
  height:100px;
  margin:8px auto 14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:10px;
  font-weight:900
}

/* GENERAL */
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  margin-bottom:12px
}

.dashboard{
  background:var(--cream);
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:20px
}

.grid4,
.responsive-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px
}

.action{
  background:#fff;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:18px;
  text-align:center;
  cursor:pointer
}

.action:hover{
  box-shadow:0 2px 8px rgba(0,0,0,.08)
}

.icon{
  font-size:34px;
  margin-bottom:8px
}

/* BUTTONS */
.btn{
  border:0;
  padding:10px 14px;
  border-radius:8px;
  font-weight:800
}

.p{
  background:var(--maroon);
  color:#fff
}

.s{
  background:var(--forest);
  color:#fff
}

.l{
  background:#eee;
  color:#333
}

.d{
  background:#c0392b;
  color:#fff
}

.outline{
  border:1.5px solid var(--green);
  background:#fff;
  color:var(--green);
  padding:10px 12px;
  border-radius:9px;
  font-weight:800
}

.muted{
  font-size:11px;
  color:#666
}

/* FORM */
label{
  display:block;
  font-size:11px;
  font-weight:700;
  margin:8px 0 4px
}

input,
select,
textarea{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#fffdf0
}

textarea{
  min-height:90px;
  resize:vertical
}

/* TABLE */
table{
  width:100%;
  border-collapse:collapse;
  background:#fff
}

th{
  background:#1a1a1a;
  color:#fff;
  padding:9px 7px;
  text-align:left;
  font-size:11px
}

td{
  padding:9px 7px;
  border-bottom:1px solid #eee;
  font-size:11px
}

.table-wrap{
  overflow:auto
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:10px
}

.modal.on{
  display:flex
}

.box{
  background:#fff;
  border-radius:12px;
  width:min(960px,96%);
  max-height:92vh;
  overflow:auto
}

.modal-head{
  padding:13px 16px;
  border-bottom:1px solid #ddd;
  font-weight:900
}

.modal-body{
  padding:16px
}

.modal-foot{
  padding:12px 16px;
  border-top:1px solid #eee;
  display:flex;
  gap:8px;
  justify-content:flex-end
}

/* LOGIN */
.login{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  z-index:200
}

.login-box{
  width:min(420px,100%);
  background:var(--cream);
  border:1px solid var(--border);
  border-radius:14px;
  padding:24px;
  box-shadow:0 4px 20px rgba(0,0,0,.1)
}

.login-title{
  background:var(--crimson);
  color:#fff;
  text-align:center;
  padding:11px;
  border-radius:7px;
  font-weight:900;
  font-size:20px
}

.msg{
  padding:9px;
  border-radius:7px;
  font-size:11px;
  margin:10px 0
}

.ok{
  background:#e2f4e6;
  color:#17652a
}

.err{
  background:#ffe5e5;
  color:#a11
}

/* ACCOUNT STATEMENT */
.statement-card{
  border:1.5px solid #9b2c2c;
  border-radius:14px;
  padding:20px 16px;
  background:var(--cream);
  max-width:560px;
  margin:0 auto 20px;
  text-align:center
}

.btn-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px
}

.account-actions{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px
}

.account-actions button{
  padding:12px 5px;
  background:#fff;
  border:1.5px solid var(--green);
  color:var(--green);
  border-radius:9px;
  font-weight:800;
  font-size:11px
}

.mobile-backdrop{
  display:none
}

/* RESPONSIVE */
@media(max-width:1100px){

  .grid4,
  .responsive-grid{
    grid-template-columns:repeat(2,minmax(0,1fr))!important
  }

}

@media(max-width:760px){

  .top{
    height:56px
  }

  .brand-badge{
    font-size:11px
  }

  .side{
    top:64px;
    left:8px;
    bottom:8px;
    transform:translateX(-115%);
    transition:.2s
  }

  .side.open{
    transform:translateX(0)
  }

  .mobile-backdrop.on{
    display:block;
    position:fixed;
    inset:56px 0 0;
    background:rgba(0,0,0,.25);
    z-index:35
  }

  .main{
    margin-left:0;
    padding:10px
  }

  .grid4,
  .responsive-grid{
    grid-template-columns:1fr!important
  }

  .account-actions{
    grid-template-columns:1fr 1fr
  }

  .btn-grid{
    grid-template-columns:1fr 1fr
  }

  .box{
    width:100%;
    max-height:96vh
  }

  .table-wrap{
    overflow:auto
  }

}

@media(max-width:420px){

  .btn-grid,
  .account-actions{
    grid-template-columns:1fr
  }

}

/* ================= ROLE BASED SYSTEM ================= */
.role-dashboard{display:grid;gap:18px}.role-header{background:var(--cream);border:1px solid var(--border);border-radius:12px;padding:18px}.role-header h2{margin:0 0 6px;color:var(--maroon)}.role-header p{margin:0;color:#666}.role-badge{display:inline-block;padding:7px 13px;border-radius:20px;background:var(--maroon);color:#fff;font-size:12px;font-weight:700}.role-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.role-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px}.role-stat small{display:block;color:#777;margin-bottom:7px}.role-stat strong{font-size:22px;color:var(--maroon)}.role-action-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.role-action{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.2s}.role-action:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,0,0,.08)}.role-action .role-icon{font-size:27px;margin-bottom:10px}.role-action b{display:block;color:var(--maroon)}.role-action span{display:block;margin-top:5px;color:#777;font-size:13px}.role-access-denied{padding:25px;background:#fff4f4;border:1px solid #e2b4b4;border-radius:10px;color:#8b1e22}@media(max-width:1100px){.role-stat-grid,.role-action-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.role-stat-grid,.role-action-grid{grid-template-columns:1fr}}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">

  <div class="login-box">

    <div class="login-title">
      FAMILY DEVELOPMENT GROUP
    </div>

    <h3 style="text-align:center;margin:14px 0 4px">
      Secure Member Login
    </h3>

    <div class="muted" style="text-align:center">
      Use your Member No or Email
    </div>

    <div id="loginMsg"></div>

    <label>Member No or Email</label>

    <input
      id="identifier"
      type="text"
      autocomplete="username"
      placeholder="Enter Member No or Email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="Enter Password"
    >

    <button
      id="loginBtn"
      class="btn p"
      style="width:100%;margin-top:14px"
      onclick="loginUser()"
    >
      LOGIN
    </button>

    <div
      style="text-align:right;margin-top:9px;color:var(--maroon);font-size:11px;cursor:pointer"
      onclick="resetPassword()"
    >
      Forgot Password?
    </div>

  </div>

</div>


<!-- APPLICATION -->
<div id="app" class="hidden">

  <div
    class="mobile-backdrop"
    id="backdrop"
    onclick="toggleSide(false)"
  ></div>

  <!-- TOP -->
  <header class="top">

    <div class="brand">

      <span
        class="hamb"
        id="hamb"
        onclick="toggleSide()"
      >
        ☰
      </span>

      <span class="brand-badge">
        👨‍👩‍👧‍👦 FAMILY DEVELOPMENT GROUP
      </span>

    </div>

    <div>

      <span
        id="roleBadge"
        class="muted"
      ></span>

      <button
        class="btn l"
        onclick="logout()"
      >
        Logout
      </button>

    </div>

  </header>


  <!-- SIDEBAR -->
  <aside class="side" id="side">

    <div
      class="profile"
      id="sideProfile"
    >
      FAMILY<br>
      DEVELOPMENT<br>
      GROUP
    </div>

    <button
      class="nav-btn active"
      onclick="showPage('home')"
    >
      🏛️ Home
    </button>

    <button
      class="nav-btn"
      onclick="showPage('financials')"
    >
      💰 Financials
    </button>

    <button
      class="nav-btn"
      onclick="showPage('loan')"
    >
      💳 Loan Application
    </button>

    <button
      class="nav-btn"
      onclick="showPage('members')"
    >
      👥 Members
    </button>

    <button
      class="nav-btn"
      onclick="showPage('documents')"
    >
      📁 Documents
    </button>

    <button
      class="nav-btn"
      onclick="showPage('projects')"
    >
      💡 Projects
    </button>

    <button
      class="nav-btn dev"
      onclick="showPage('settings')"
    >
      ⚙️ Settings - 15 Modules
    </button>

    <button
      id="managementNav"
      class="nav-btn dev"
      style="display:none"
      onclick="showPage('management')"
    >
      🛠️ Management Control
    </button>

  </aside>


  <!-- MAIN -->
  <main
    id="main"
    class="main"
  ></main>

</div>


<!-- MODAL -->
<div
  id="modal"
  class="modal"
>

  <div
    id="box"
    class="box"
  ></div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  'https://lodjqbszdrpimldtdfev.supabase.co';

const SUPABASE_KEY =
  'sb_publishable_ewOzpBWF_G6MPhceYJKWNA_NYZkMcYR';

const sb =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   APPLICATION STATE
========================================================= */

let currentUser = null;
let currentMember = null;
let currentProfile = null;
let currentAccounts = [];


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
  document.getElementById(id);

const esc = s =>
  String(s ?? '').replace(
    /[&<>"']/g,
    c => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[c])
  );

const money = n =>
  Number(n || 0).toLocaleString(
    'en-KE',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );


function loginMessage(text,ok=false){

  $('loginMsg').innerHTML =
    text
      ? `<div class="msg ${ok?'ok':'err'}">${esc(text)}</div>`
      : '';

}


function notify(text,ok=false){

  alert(text);

}


/* =========================================================
   LOGIN
========================================================= */

async function resolveEmail(identifier){

  if(identifier.includes('@')){
    return identifier.toLowerCase();
  }

  const q =
    await sb
      .from('members')
      .select('email,status')
      .eq('member_no',identifier)
      .maybeSingle();

  if(q.error){
    throw new Error(q.error.message);
  }

  if(!q.data){
    throw new Error('Member No not found.');
  }

  if(
    String(q.data.status || '').toLowerCase()
    !== 'active'
  ){
    throw new Error(
      'This member account is not active.'
    );
  }

  if(!q.data.email){
    throw new Error(
      'No email is registered for this member.'
    );
  }

  return q.data.email.toLowerCase();

}


async function loginUser(){

  const identifier =
    $('identifier').value.trim();

  const password =
    $('password').value;

  const btn =
    $('loginBtn');

  if(!identifier || !password){

    return loginMessage(
      'Enter your Member No or Email and password.'
    );

  }

  btn.disabled = true;
  btn.textContent = 'LOGGING IN...';

  loginMessage(
    'Signing in...',
    true
  );

  try{

    const email =
      await resolveEmail(identifier);

    const r =
      await sb.auth.signInWithPassword({
        email,
        password
      });

    if(r.error){
      throw new Error(r.error.message);
    }

    if(!r.data.user){
      throw new Error('Login failed.');
    }

    await enterApp(r.data.user);

  }catch(e){

    console.error(e);

    loginMessage(
      e.message || 'Unable to login.'
    );

  }finally{

    btn.disabled = false;
    btn.textContent = 'LOGIN';

  }

}


async function resetPassword(){

  const v =
    $('identifier').value.trim();

  if(!v || !v.includes('@')){

    return loginMessage(
      'Enter your email address for password reset.'
    );

  }

  const q =
    await sb.auth.resetPasswordForEmail(
      v,
      {
        redirectTo:location.href
      }
    );

  loginMessage(
    q.error
      ? q.error.message
      : 'Password reset email sent.',
    !q.error
  );

}


/* =========================================================
   ENTER APPLICATION
========================================================= */

async function enterApp(user){

  currentUser = user;

  const profileQuery =
    await sb
      .from('profiles')
      .select('*')
      .eq('id',user.id)
      .maybeSingle();

  currentProfile =
    profileQuery.data || null;

  let m = null;

  if(currentProfile?.member_id){

    m =
      (
        await sb
          .from('members')
          .select('*')
          .eq(
            'id',
            currentProfile.member_id
          )
          .maybeSingle()
      ).data;

  }

  if(!m){

    m =
      (
        await sb
          .from('members')
          .select('*')
          .eq(
            'email',
            user.email
          )
          .maybeSingle()
      ).data;

  }

  currentMember = m;

  document.title =
    'Family Development Group';

  $('login')
    .classList
    .add('hidden');

  $('app')
    .classList
    .remove('hidden');

  $('roleBadge').textContent =
    'Role: ' +
    (
      currentProfile?.role ||
      'Member'
    );

  $('sideProfile').innerHTML =
    esc(
      (
        currentMember?.full_name ||
        currentProfile?.full_name ||
        user.email
      ).toUpperCase()
    );

  await loadAccounts();

  await loadDatabasePermissions();
  applyRoleNavigation();
  await openRoleDashboard();
}


/* =========================================================
   ACCOUNTS
========================================================= */

async function loadAccounts(){

  if(!currentMember){
    currentAccounts = [];
    return;
  }

  const q =
    await sb
      .from('zimele_accounts')
      .select('*')
      .eq(
        'member_id',
        currentMember.id
      )
      .order(
        'created_at',
        {
          ascending:true
        }
      );

  if(q.error){

    console.error(
      'Account loading error:',
      q.error
    );

    currentAccounts = [];
    return;

  }

  currentAccounts =
    q.data || [];

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  await sb.auth.signOut();

  currentUser = null;
  currentMember = null;
  currentProfile = null;
  currentAccounts = [];

  $('app')
    .classList
    .add('hidden');

  $('login')
    .classList
    .remove('hidden');

}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

function toggleSide(force){

  const s = $('side');
  const b = $('backdrop');

  const open =
    force === undefined
      ? !s.classList.contains('open')
      : force;

  s.classList.toggle(
    'open',
    open
  );

  b.classList.toggle(
    'on',
    open
  );

}


/* =========================================================
   PAGE NAVIGATION
========================================================= */

function showPage(page){

  toggleSide(false);

  const permissionMap = {
    home:'dashboard',
    financials:'financials',
    loan:'loans',
    members:'members',
    documents:'documents',
    projects:'projects',
    settings:'settings',
    management:'management'
  };

  const module = permissionMap[page];

  if(module && !hasRolePermission(module)){
    notify('Access denied. Your role does not have permission to access this module.');
    return;
  }

  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));

  const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
  const map = {home:0,financials:1,loan:2,members:3,documents:4,projects:5,settings:6,management:7};
  navButtons[map[page]]?.classList.add('active');

  const pages = {
    home:home,
    financials:financials,
    loan:loanPage,
    members:membersPage,
    documents:documentsPage,
    projects:projectsPage,
    settings:settingsPage,
    management:managementPage
  };

  return (pages[page] || home)();
}


/* =========================================================
   MODAL
========================================================= */

function modal(html){

  $('box').innerHTML = html;

  $('modal')
    .classList
    .add('on');

}


function closeModal(){

  $('modal')
    .classList
    .remove('on');

}


$('modal').onclick = e => {

  if(e.target.id === 'modal'){
    closeModal();
  }

};


/* =========================================================
   HOME
   ONLY: STATEMENTS / DEPOSITS / WITHDRAWAL
========================================================= */

function home(){

  $('main').innerHTML = `

    <div class="dashboard">

      <h2>
        Family Development Group Accounts
      </h2>

      <p>
        Welcome,
        <b>
          ${esc(
            currentMember?.full_name ||
            currentUser?.email ||
            'Member'
          )}
        </b>
      </p>

      <div
        class="grid4"
        style="margin-top:16px"
      >

        <!-- STATEMENTS -->

        <div
          class="action"
          onclick="statementsPage()"
        >

          <div class="icon">
            📑
          </div>

          <b>
            Statements
          </b>

        </div>


        <!-- DEPOSITS -->

        <div
          class="action"
          onclick="deposit()"
        >

          <div class="icon">
            ➕
          </div>

          <b>
            Deposits
          </b>

        </div>


        <!-- WITHDRAWAL -->

        <div
          class="action"
          onclick="openHomeWithdrawal()"
        >

          <div class="icon">
            💸
          </div>

          <b>
            Withdrawal
          </b>

        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   HOME WITHDRAWAL
========================================================= */

function openHomeWithdrawal(){

  const a =
    currentAccounts[0];

  if(!a){

    notify(
      'No financial account found.'
    );

    return;

  }

  withdrawAccount(
    a.account_no
  );

}


/* =========================================================
   FINANCIALS
========================================================= */

function financials(){

  $('main').innerHTML = `

    <div class="card">

      <h2>
        Financials
      </h2>

      <div class="grid4">

        <div
          class="action"
          onclick="statementsPage()"
        >
          <div class="icon">
            📑
          </div>
          <b>
            Statements
          </b>
        </div>

        <div
          class="action"

/* =========================================================
   FILTER ACCOUNT TRANSACTIONS
========================================================= */

async function filterTransactions(no){

  const a =
    currentAccounts.find(
      x =>
        x.account_no === no
    );

  if(!a){
    return;
  }

  let q =
    sb
      .from('zimele_transactions')
      .select('*')
      .eq(
        'account_id',
        a.id
      )
      .order(
        'transaction_date',
        {
          ascending:false
        }
      );

  const f =
    $('fromDate')?.value;

  const t =
    $('toDate')?.value;

  if(f){
    q = q.gte(
      'transaction_date',
      f
    );
  }

  if(t){
    q = q.lte(
      'transaction_date',
      t
    );
  }

  const r =
    await q;

  if(r.error){

    $('stmtRows').innerHTML =
      `
      <div class="msg err">
        ${esc(r.error.message)}
      </div>
      `;

    return;

  }

  let rows =
    r.data || [];

  const type =
    $('txType')?.value;

  if(type === 'deposit'){

    rows =
      rows.filter(
        x =>
          Number(x.deposit) > 0
      );

  }

  if(type === 'withdrawal'){

    rows =
      rows.filter(
        x =>
          Number(x.withdrawal) > 0
      );

  }

  if(type === 'transfer'){

    rows =
      rows.filter(
        x =>
          String(
            x.transaction_type || ''
          ).toLowerCase()
          === 'transfer'
      );

  }

  $('stmtRows').innerHTML = `

    <div class="table-wrap">

      <table>

        <tr>

          <th>Date</th>
          <th>Reference</th>
          <th>Description</th>
          <th>Type</th>
          <th>Debit</th>
          <th>Credit</th>
          <th>Balance</th>

        </tr>

        ${
          rows
            .map(
              x => `

              <tr>

                <td>
                  ${esc(x.transaction_date)}
                </td>

                <td>
                  ${esc(
                    x.reference_no || ''
                  )}
                </td>

                <td>
                  ${esc(
                    x.description || ''
                  )}
                </td>

                <td>
                  ${
                    Number(x.withdrawal) > 0
                      ? 'Withdrawal'
                      : Number(x.deposit) > 0
                        ? 'Deposit'
                        : 'Transfer'
                  }
                </td>

                <td>
                  ${money(x.withdrawal)}
                </td>

                <td>
                  ${money(
                    Number(x.deposit || 0) +
                    Number(x.interest || 0)
                  )}
                </td>

                <td>
                  -
                </td>

              </tr>

            `
            )
            .join('')
          ||
          `
          <tr>
            <td colspan="7">
              No transactions found.
            </td>
          </tr>
          `
        }

      </table>

    </div>

  `;

}

/* =========================================================
   RECALCULATE BALANCE
========================================================= */

async function recalc(accountId){

  const q =
    await sb
      .from('zimele_transactions')
      .select(
        'deposit,withdrawal,interest'
      )
      .eq(
        'account_id',
        accountId
      );

  if(q.error){

    console.error(
      q.error.message
    );

    return;

  }

  const bal =
    (q.data || [])
      .reduce(
        (s,x) =>
          s +
          Number(x.deposit || 0) +
          Number(x.interest || 0) -
          Number(x.withdrawal || 0),
        0
      );

  await sb
    .from('zimele_accounts')
    .update({
      balance:bal,
      updated_at:
        new Date().toISOString()
    })
    .eq(
      'id',
      accountId
    );

}

async function submitLoan(){

    Number(
      $('loanAmt')
        .value || 0

      .from('loan_applications')

          'LA-' +

async function loadDatabasePermissions(){
  try{
    const session=(await sb.auth.getSession()).data.session;
    if(!session) return;
    const r=await fetch(`${SUPABASE_URL}/functions/v1/admin-user-manager`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session.access_token}`},
      body:JSON.stringify({action:'list_permissions'})
    });
    const j=await r.json();
    if(!r.ok || j.error) return;
    DB_ROLE_PERMISSIONS={};
    (j.permissions||[]).forEach(x=>{
      if(!DB_ROLE_PERMISSIONS[x.role]) DB_ROLE_PERMISSIONS[x.role]={};
      DB_ROLE_PERMISSIONS[x.role][x.module]=x.can_view===true;
    });
  }catch(e){ console.warn('Permission load failed:',e); }
}

async function adminUserManager(action,payload={}){
  const session=(await sb.auth.getSession()).data.session;
  if(!session) throw new Error('Your session has expired. Please log in again.');
  const r=await fetch(`${SUPABASE_URL}/functions/v1/admin-user-manager`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':`Bearer ${session.access_token}`},
    body:JSON.stringify({action,...payload})
  });
  const j=await r.json();
  if(!r.ok || j.error) throw new Error(j.error||'Administrator request failed.');
  return j;
}

/* ---------------------------------------------------------
   GET CURRENT ROLE
   --------------------------------------------------------- */

function getCurrentRole() {

  if (
    typeof currentProfile !== 'undefined' &&
    currentProfile &&
    currentProfile.role
  ) {
    return currentProfile.role;
  }

  return 'Member';
}


/* ---------------------------------------------------------
   CHECK PERMISSION
   --------------------------------------------------------- */

function hasRolePermission(module) {

  const role = getCurrentRole();

  if (!ROLE_PERMISSIONS[role]) {
    return false;
  }

  return ROLE_PERMISSIONS[role][module] === true;
}


/* ---------------------------------------------------------
   PROTECT PAGE
   --------------------------------------------------------- */

function requireRolePermission(module, callback) {

  if (!hasRolePermission(module)) {

    notify(
      'Access denied. Your role does not have permission to access this module.'
    );

    return false;
  }

  if (typeof callback === 'function') {
    callback();
  }

  return true;
}

async function guarantorDashboard() {

  const memberId =
    currentMember ? currentMember.id : null;

  let requests = [];

  if (memberId) {

    const result = await sb
      .from('guarantor_requests')
      .select('*')

      .order('created_at', {

  const pending =

      x => x.status === 'Pending'

  $('main').innerHTML = `

    <div class="role-dashboard">

      <div class="role-header">

          <small>Total Requests</small>

        <div class="role-stat">
          <small>Role</small>
          <strong>GUARANTOR</strong>

        <div class="role-stat">
          <small>Member Services</small>

      </div>

      <div class="card">

        <h3>Guarantor Requests</h3>

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>Status</th>
                <th>Action</th>
              </tr>

            </thead>

            <tbody>

              ${
                requests.length

                ? requests.map(r => `

                    <td>

                    <td>
                      ${esc(r.requested_date || '')}

/* =========================================================
   COUNT RECORDS
   ========================================================= */

async function getCount(table) {

  try {

    const result = await sb
      .from(table)
      .select('*', {
        count:'exact',
        head:true
      });

    return result.count || 0;

  } catch(e) {

    return 0;

  }

}


/* =========================================================
   GUARANTOR DECISION
   ========================================================= */

async function guarantorDecision(
  requestId,
  decision
) {

  if (getCurrentRole() !== 'Guarantor') {

    notify(
      'Only a Guarantor can respond to a guarantee request.'
    );

    return;

  }

  const memberId =
    currentMember ? currentMember.id : null;

  const result = await sb
    .from('guarantor_requests')
    .update({
      status:decision,
      response_date:
        new Date()
          .toISOString()
          .slice(0,10)
    })
    .eq('id', requestId)
    .eq('guarantor_member_id', memberId);

  if (result.error) {

    notify(result.error.message);

    return;

  }

  notify(
    'Guarantee request ' +
    decision.toLowerCase() +
    '.'
  );

  await guarantorDashboard();

}


/* =========================================================
   ROLE NAVIGATION
   ========================================================= */

function applyRoleNavigation(){

  const role = getCurrentRole();
  const permission = ROLE_PERMISSIONS[role] || ROLE_PERMISSIONS.Member;
  const navButtons = Array.from(document.querySelectorAll('.nav-btn'));
  const rules = [
    permission.dashboard,
    permission.financials,
    permission.loans,
    permission.members,
    permission.documents,
    permission.projects,
    permission.settings,
    permission.management
  ];

  navButtons.forEach((el,i)=>{
    if(rules[i] === undefined) return;
    el.style.display = rules[i] ? 'flex' : 'none';
  });
}


/* =========================================================
   SECURE PAGE WRAPPER
   ========================================================= */

async function openProtectedPage(
  module,
  pageFunction
) {

  if (!hasRolePermission(module)) {

    notify(
      'You do not have permission to access this module.'
    );

    return;

  }

  if (typeof pageFunction === 'function') {

    return await pageFunction();

  }

}
